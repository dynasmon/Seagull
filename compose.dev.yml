services:
  redis:
    environment:
      SEAGULL_REDIS_CONFIG_FILE: /etc/seagull/redis/${SEAGULL_REDIS_DEV_CONFIG:-${NETWATCH_REDIS_DEV_CONFIG:-redis.dev.conf}}
      SEAGULL_REDIS_STRICT_PASSWORD: "false"
    stop_grace_period: ${SEAGULL_REDIS_STOP_GRACE_PERIOD:-${NETWATCH_REDIS_STOP_GRACE_PERIOD:-10s}}

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      seagull-portal:
        condition: service_healthy
      seagull-backend:
        condition: service_healthy
    ports:
      - "${SEAGULL_EDGE_HTTP_PORT:-${NETWATCH_EDGE_HTTP_PORT:-8081}}:8081"
      - "${SEAGULL_EDGE_HTTPS_PORT:-${NETWATCH_EDGE_HTTPS_PORT:-8443}}:8443"
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ${SEAGULL_TLS_CERT_FILE:-${NETWATCH_TLS_CERT_FILE:-./secrets/tls/tls.crt}}:/etc/seagull/tls/tls.crt:ro
      - ${SEAGULL_TLS_KEY_FILE:-${NETWATCH_TLS_KEY_FILE:-./secrets/tls/tls.key}}:/etc/seagull/tls/tls.key:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - seagull
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - --no-check-certificate https://127.0.0.1:8443/api/health/live >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  seagull-backend:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SEAGULL_ENV: dev
      SEAGULL_DB_AUTO_UPGRADE: "true"
      SEAGULL_SEARCH_BACKEND: auto
      SEAGULL_CLICKHOUSE_REQUIRED: "false"
      SEAGULL_RULES_ENV: dev
      SEAGULL_RULES_ENABLED_PACKS: ${SEAGULL_RULES_ENABLED_PACKS:-${NETWATCH_RULES_ENABLED_PACKS:-core,network,lab}}
      SEAGULL_RULES_INCLUDE_EXPERIMENTAL: ${SEAGULL_RULES_INCLUDE_EXPERIMENTAL:-${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-true}}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys,urllib.request; u=urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2); sys.exit(0 if u.getcode()==200 else 1)\"",
        ]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 25s

  seagull-ingest-pipeline:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SEAGULL_ENV: dev
      SEAGULL_DB_AUTO_UPGRADE: "true"
      SEAGULL_CLICKHOUSE_REQUIRED: "false"

  seagull-intelligence-worker:
    environment:
      SEAGULL_ENV: dev
      SEAGULL_DB_AUTO_UPGRADE: "true"
      SEAGULL_RULES_ENV: dev
      SEAGULL_RULES_ENABLED_PACKS: ${SEAGULL_RULES_ENABLED_PACKS:-${NETWATCH_RULES_ENABLED_PACKS:-core,network,lab}}
      SEAGULL_RULES_INCLUDE_EXPERIMENTAL: ${SEAGULL_RULES_INCLUDE_EXPERIMENTAL:-${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-true}}

  seagull-maintenance-worker:
    environment:
      SEAGULL_ENV: dev
      SEAGULL_DB_AUTO_UPGRADE: "true"

  seagull-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${SEAGULL_PORTAL_PORT:-${NETWATCH_PORTAL_PORT:-8080}}:5173"
    environment:
      SEAGULL_API_BASE: http://seagull-backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('node:http');const req=http.get('http://127.0.0.1:5173/',(res)=>process.exit((res.statusCode||500)<500?0:1));req.setTimeout(2000,()=>{req.destroy();process.exit(1);});req.on('error',()=>process.exit(1));\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  seagull-agent-core:
    environment:
      SEAGULL_TLS_CA_FILE: /etc/seagull/server-ca.crt

  seagull-agent-sensor:
    environment:
      SEAGULL_TLS_CA_FILE: /etc/seagull/server-ca.crt

  seagull-agent-lateral:
    environment:
      SEAGULL_TLS_CA_FILE: /etc/seagull/server-ca.crt

  seagull-agent-proc:
    environment:
      SEAGULL_TLS_CA_FILE: /etc/seagull/server-ca.crt

  seagull-agent-scan:
    environment:
      SEAGULL_TLS_CA_FILE: /etc/seagull/server-ca.crt

  seagull-agent-ddos:
    environment:
      SEAGULL_TLS_CA_FILE: /etc/seagull/server-ca.crt

  seagull-agent-vuln:
    environment:
      SEAGULL_TLS_CA_FILE: /etc/seagull/server-ca.crt
