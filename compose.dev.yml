services:
  netwatch-edge:
    profiles: ["tls"]
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      - netwatch-portal
      - netwatch-backend
    ports:
      - "${NETWATCH_EDGE_HTTP_PORT:-8081}:8081"
      - "${NETWATCH_EDGE_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./infra/nginx/edge.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NETWATCH_TLS_CERT_FILE:-./secrets/tls/tls.crt}:/etc/netwatch/tls/tls.crt:ro
      - ${NETWATCH_TLS_KEY_FILE:-./secrets/tls/tls.key}:/etc/netwatch/tls/tls.key:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-backend:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-ingest-worker:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-rules-worker:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-es-indexer:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-rollup-worker:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-ip-intel:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-proto-intel:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-attack-chain:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${NETWATCH_PORTAL_PORT:-8080}:5173"
    environment:
      NETWATCH_API_BASE: http://netwatch-backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
