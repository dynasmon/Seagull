services:
  netwatch-edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      netwatch-portal:
        condition: service_healthy
      netwatch-backend:
        condition: service_healthy
    ports:
      - "${NETWATCH_EDGE_HTTP_PORT:-8081}:8081"
      - "${NETWATCH_EDGE_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./infra/nginx/edge.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NETWATCH_TLS_CERT_FILE:-./secrets/tls/tls.crt}:/etc/netwatch/tls/tls.crt:ro
      - ${NETWATCH_TLS_KEY_FILE:-./secrets/tls/tls.key}:/etc/netwatch/tls/tls.key:ro
      - ${NETWATCH_AGENT_CA_CERT_FILE:-./secrets/agent-ca/ca.crt}:/etc/netwatch/agent-ca/ca.crt:ro
      - ${NETWATCH_AGENT_CA_CRL_FILE:-./secrets/agent-ca/ca.crl}:/etc/netwatch/agent-ca/ca.crl:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - netwatch
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - --no-check-certificate https://127.0.0.1:8443/api/health/ready >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  netwatch-backend:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"
      NETWATCH_AGENT_AUTH_MODE: mtls
      NETWATCH_RULES_ENV: dev
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network,lab}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-true}

  netwatch-ingest-worker:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-rules-worker:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"
      NETWATCH_RULES_ENV: dev
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network,lab}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-true}

  netwatch-audit-retention:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-es-indexer:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-rollup-worker:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-ip-intel:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-proto-intel:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-attack-chain:
    environment:
      NETWATCH_ENV: dev
      NETWATCH_DB_AUTO_UPGRADE: "true"

  netwatch-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${NETWATCH_PORTAL_PORT:-8080}:5173"
    environment:
      NETWATCH_API_BASE: http://netwatch-backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('node:http');const req=http.get('http://127.0.0.1:5173/',(res)=>process.exit((res.statusCode||500)<500?0:1));req.setTimeout(2000,()=>{req.destroy();process.exit(1);});req.on('error',()=>process.exit(1));\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
