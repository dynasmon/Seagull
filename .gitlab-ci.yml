stages:
  - test
  - reproducibility

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

cli-reproducibility-tests:
  stage: test
  image: python:3.12-slim
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - pip install --no-cache-dir cryptography pytest
  script:
    - python -m pytest cli/tests -q

backend-quality:
  stage: test
  image: python:3.12-slim
  interruptible: true
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - pip install --no-cache-dir -r backend/requirements-dev.txt
  script:
    - bash scripts/ci/backend-quality.sh

seagull-up-fresh-machine:
  stage: reproducibility
  tags:
    - seagull-docker-host
  timeout: 60m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    SEAGULL_MODE: "dev"
    GIT_DEPTH: "1"
  script:
    - bash scripts/ci/seagull-up-smoke.sh
