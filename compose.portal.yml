# compose.portal.yml — frontend portal service
# Requires: compose.base.yml, compose.backend.yml (seagull-backend healthcheck dependency)

services:
  seagull-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seagull-portal
    depends_on:
      seagull-backend:
        condition: service_healthy
    environment: {}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "0.50"
    networks:
      - seagull
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
