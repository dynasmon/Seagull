services:
  seagull-backend:
    environment:
      SEAGULL_COOKIE_SECURE: "true"
      SEAGULL_TRUST_PROXY_HEADERS: "true"
      SEAGULL_TRUSTED_PROXY_CIDRS: ${SEAGULL_TRUSTED_PROXY_CIDRS:-${NETWATCH_TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1,::1}}
      SEAGULL_ALLOWED_HOSTS: ${SEAGULL_ALLOWED_HOSTS:-${NETWATCH_ALLOWED_HOSTS:-localhost,127.0.0.1}}
