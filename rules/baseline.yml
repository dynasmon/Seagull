rules:
  # 1) SSH brute force (authlog)
  - id: ssh_bruteforce_authlog_v1
    name: "SSH brute force (authlog-based)"
    description: "Detects repeated failed SSH logins from the same source IP using ssh_auth events."
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "2m"
    cooldown: "10m"
    match:
      event_type: "ssh_auth"
      agent_id: "agent-proc-1"
      dst_port: 22
      extra_action: "failed"
    group_by: "src_ip"
    condition:
      operator: ">="
      value: 8

  # 2) Vertical port scan (many ports on same target)
  - id: port_scan_v1
    name: "Vertical port scan"
    description: "Detects a source IP scanning many destination ports on the same target."
    enabled: true
    severity: "high"
    type: "distinct_count"
    window: "5m"
    cooldown: "10m"
    match:
      event_type: "flow"
      agent_id: "agent-proc-1"
      # proto: "tcp"             # optional; remove to include tcp6 events
    group_by: "src_ip"
    distinct_field: "dst_port"
    condition:
      operator: ">="
      value: 6

  # 3) Horizontal scan on a single port (e.g., SSH) across multiple destinations
  - id: horizontal_scan_v1
    name: "Horizontal scan on a single port"
    description: "Detects a source IP hitting the same destination port across many destination IPs."
    enabled: true
    severity: "medium"
    type: "distinct_count"
    window: "10m"
    cooldown: "15m"
    match:
      event_type: "flow"
      agent_id: "agent-proc-1"
      dst_port: 22
    group_by: "src_ip"
    distinct_field: "dst_ip"
    condition:
      operator: ">="
      value: 3

  # 4) Sanity check: any traffic observed from agent-proc-1
  - id: real_traffic_seen_v1
    name: "Real traffic observed from agent-proc-1"
    description: "Fires when any flow is observed from the proc-based agent."
    enabled: true
    severity: "low"
    type: "aggregate_count"
    window: "5m"
    cooldown: "30m"
    match:
      event_type: "flow"
      agent_id: "agent-proc-1"
    group_by: "src_ip"
    condition:
      operator: ">="
      value: 1
