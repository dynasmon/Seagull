rules:
  - id: lateral_admin_spray_v1
    name: "Lateral admin-port spray"
    description: "One source attempts admin protocols against multiple internal targets with sustained confidence."
    status: "active"
    risk_score: 72
    source: "lateral_conn"
    false_positives: "Automated IT inventory or management scanners can trigger this rule."
    response: "Validate source role, inspect connection fan-out, and isolate unauthorized lateral reconnaissance."
    mitre:
      tactic: "lateral_movement"
      technique_id: "T1021"
      technique: "Remote Services"
      confidence: 82
    enabled: true
    severity: "high"
    type: "distinct_count"
    window: "4m"
    cooldown: "20m"
    match:
      event_type: "lateral_conn"
      extra_lateral_kind: "attempt"
      dst_port_in: [22, 135, 139, 445, 3389, 5985, 5986]
      extra_lateral_confidence_gte: 72
    group_by: "src_ip"
    distinct_field: "dst_ip"
    min_events: 26
    condition:
      operator: ">="
      value: 6
    tuning:
      allowlist:
        src_cidrs: []
        src_ips: []
    tests:
      - id: admin_spray_fires
        description: "Twenty-six admin-port attempts across distinct hosts cross the spray threshold."
        expect: hit
