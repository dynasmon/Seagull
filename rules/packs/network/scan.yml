schema_version: 1
pack: network
category: discovery
pack_version: 2
maturity: stable

rules:
  - id: tcp_vertical_port_scan_v3
    name: "TCP vertical port scan"
    description: "One source probing many TCP ports on the same target with high-confidence scan metadata."
    status: "active"
    risk_score: 66
    source: "scan_probe"
    false_positives: "Authorized vulnerability scanners and red-team exercises."
    response: "Confirm source authorization and inspect process lineage on scanning origin."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 86
    enabled: true
    severity: "high"
    type: "distinct_count"
    window: "60s"
    cooldown: "10m"
    match:
      event_type: "scan_probe"
      proto: "tcp"
      src_port_gte: 1024
      extra_scan_confidence_gte: 72
      extra_scan_type_not_in: ["tcp_ack"]
    group_by: ["src_ip", "dst_ip"]
    distinct_field: "dst_port"
    min_events: 45
    condition:
      operator: ">="
      value: 22
    tests:
      - id: tcp_vertical_spread_fires
        description: "Forty-five probes across forty-five TCP ports on one target trip the vertical-scan rule."
