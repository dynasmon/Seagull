schema_version: 1
pack: network
category: recon
pack_version: 1
maturity: stable

rules:
  - id: admin_ports_vertical_recon_v1
    name: "Admin ports vertical recon"
    description: "Source probes multiple administration ports on the same target."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 74
    enabled: true
    severity: "medium"
    type: "distinct_count"
    window: "5m"
    cooldown: "20m"
    match:
      event_type: "scan_probe"
      proto: "tcp"
      dst_port_in: [22, 135, 139, 445, 3389, 5985, 5986]
      extra_scan_confidence_gte: 70
      extra_scan_type_not_in: ["tcp_ack"]
    group_by: ["src_ip", "dst_ip"]
    distinct_field: "dst_port"
    min_events: 35
    condition:
      operator: ">="
      value: 4

  - id: admin_surface_horizontal_recon_v1
    name: "Horizontal recon against admin surface"
    description: "Source fans out probes to many targets on administration ports."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 80
    enabled: true
    severity: "high"
    type: "distinct_count"
    window: "5m"
    cooldown: "20m"
    match:
      event_type: "scan_probe"
      proto: "tcp"
      dst_port_in: [22, 135, 139, 445, 3389, 5985, 5986]
      extra_scan_confidence_gte: 70
      extra_scan_type_not_in: ["tcp_ack"]
    group_by: "src_ip"
    distinct_field: "dst_ip"
    min_events: 50
    condition:
      operator: ">="
      value: 8

  - id: multi_protocol_scan_pattern_v1
    name: "Multi-protocol scan pattern"
    description: "Source scans one target with broad port spread across multiple protocols."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 83
    enabled: true
    severity: "high"
    type: "multi_distinct"
    window: "4m"
    cooldown: "20m"
    match:
      event_type: "scan_probe"
      extra_scan_confidence_gte: 70
    group_by: ["src_ip", "dst_ip"]
    min_events: 120
    distinct_conditions:
      - field: "dst_port"
        operator: ">="
        value: 28
      - field: "proto"
        operator: ">="
        value: 2

  - id: high_rate_single_target_probe_v1
    name: "High-rate probe burst on single target"
    description: "Very high probe count against one target from one source in a short interval."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 78
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "90s"
    cooldown: "15m"
    match:
      event_type: "scan_probe"
      extra_scan_confidence_gte: 70
    group_by: ["src_ip", "dst_ip", "proto"]
    condition:
      operator: ">="
      value: 250

  - id: wide_ssh_recon_v1
    name: "Wide SSH recon sweep"
    description: "Source probes SSH across many targets with sustained event volume."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 76
    enabled: true
    severity: "medium"
    type: "distinct_count"
    window: "8m"
    cooldown: "25m"
    match:
      event_type: "scan_probe"
      proto: "tcp"
      dst_port: 22
      extra_scan_confidence_gte: 70
    group_by: "src_ip"
    distinct_field: "dst_ip"
    min_events: 60
    condition:
      operator: ">="
      value: 12
