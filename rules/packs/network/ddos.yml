      technique: "Network Denial of Service"
      confidence: 82
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "30s"
    cooldown: "2m"
    match:
      event_type: "dos_attack"
      extra_attack: "dos"
      extra_confidence_gte: 70
      extra_vector_not_in: ["http_flood", "tls_handshake_flood", "icmp_flood"]
    group_by: ["dst_ip", "dst_port", "proto"]
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "high-confidence single-source dos fires"
        expected: match
        events:
          - {event_type: "dos_attack", agent_id: "agent-1", dst_ip: "203.0.113.20", dst_port: 80, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {attack: "dos", confidence: 85, vector: "volumetric"}}
      - name: "distributed attack does not match single-source rule"
        expected: no_match
