    cooldown: "5m"
    match:
      event_type: "scan_summary"
      extra_total_probes_gte: 1
    group_by: ["dst_ip", "proto"]
    distinct_field: "src_ip"
    min_events: 1200
    condition:
      operator: ">="
      value: 80
    tests:
