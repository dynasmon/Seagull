          - {event_type: "dos_attack", agent_id: "agent-1", dst_ip: "203.0.113.20", dst_port: 80, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {attack: "ddos", confidence: 85, vector: "volumetric"}}
      - name: "specific L7 vector is handled elsewhere"
        expected: no_match
        events:
          - {event_type: "dos_attack", agent_id: "agent-1", dst_ip: "203.0.113.20", dst_port: 80, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {attack: "dos", confidence: 85, vector: "http_flood"}}

