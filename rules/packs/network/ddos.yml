schema_version: 1
pack: network
category: impact
pack_version: 3
maturity: stable

rules:
  - id: ddos_attack_high_conf_v1
    name: "DDoS detected (high confidence)"
    description: "High-confidence distributed DoS event that is not already covered by specific vector rules."
    status: "active"
    risk_score: 76
    source: "dos_attack"
    false_positives: "Large legitimate load tests against exposed services."
    response: "Validate target ownership, assess upstream mitigation, and confirm vector with packet telemetry."
    mitre:
      tactic: "impact"
      technique_id: "T1498"
      technique: "Network Denial of Service"
      confidence: 90
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "30s"
    cooldown: "2m"
    match:
      event_type: "dos_attack"
      extra_attack: "ddos"
      extra_confidence_gte: 72
      extra_vector_not_in: ["udp_amp_flood", "tcp_syn_flood", "http_flood", "tls_handshake_flood", "icmp_flood"]
    group_by: ["dst_ip", "dst_port", "proto"]
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "high-confidence generic ddos fires"
        expected: match
        events:
          - {event_type: "dos_attack", agent_id: "agent-1", dst_ip: "203.0.113.20", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {attack: "ddos", confidence: 90, vector: "generic_flood"}}
      - name: "low confidence does not fire"
        expected: no_match
        events:
          - {event_type: "dos_attack", agent_id: "agent-1", dst_ip: "203.0.113.20", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {attack: "ddos", confidence: 50, vector: "generic_flood"}}
      - name: "specific vector is handled by vector rules"
        expected: no_match
        events:
          - {event_type: "dos_attack", agent_id: "agent-1", dst_ip: "203.0.113.20", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {attack: "ddos", confidence: 90, vector: "tcp_syn_flood"}}

  - id: dos_attack_high_conf_v1
