  - id: dos_scan_summary_volume_v1
    name: "High-volume probe storm against target"
    description: "Large volume of probe summaries against one target within a short window, treated as DoS-impact telemetry when packet DDoS classification is absent."
    status: "active"
    risk_score: 50
    source: "scan_summary"
    false_positives: "Authorized high-rate scanner tests and controlled benchmark traffic."
    response: "Validate test window and source ownership; if unexpected, apply temporary perimeter filtering."
    mitre:
      tactic: "impact"
      technique_id: "T1498"
      technique: "Network Denial of Service"
      confidence: 74
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "5m"
    cooldown: "5m"
    match:
      event_type: "scan_summary"
      extra_total_probes_gte: 1
    group_by: ["dst_ip", "proto"]
    condition:
      operator: ">="
