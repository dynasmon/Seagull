      - name: "distributed attack does not match this rule"
        expected: no_match
        events:
          - {event_type: "dos_attack", agent_id: "agent-1", dst_ip: "203.0.113.20", dst_port: 80, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {attack: "ddos", confidence: 80}}
          - {event_type: "dos_attack", agent_id: "agent-1", dst_ip: "203.0.113.20", dst_port: 80, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {attack: "ddos", confidence: 80}}

  - id: ddos_scan_summary_fanout_v1
    name: "Distributed probe storm against target"
    description: "High-volume probe summaries from many source IPs against the same target, consistent with DDoS-style fanout or noisy flood tooling."
    status: "active"
    risk_score: 70
    source: "scan_summary"
    false_positives: "Large authorized distributed scanner jobs and synthetic DDoS tests."
    response: "Confirm whether the source set is expected, then rate-limit at edge or upstream if traffic is unauthorized."
    mitre:
      tactic: "impact"
      technique_id: "T1498"
      technique: "Network Denial of Service"
      confidence: 82
    enabled: true
    severity: "high"
    type: "distinct_count"
    window: "5m"
    cooldown: "5m"
    match:
      event_type: "scan_summary"
      extra_total_probes_gte: 1
    group_by: ["dst_ip", "proto"]
    distinct_field: "src_ip"
    min_events: 1200
    condition:
      operator: ">="
      value: 80
    tests:
      - name: "a handful of summaries stays below fanout threshold"
        expected: no_match
        events:
          - {event_type: "scan_summary", agent_id: "agent-1", src_ip: "203.0.113.1", dst_ip: "10.0.0.9", proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {total_probes: 100}}
          - {event_type: "scan_summary", agent_id: "agent-1", src_ip: "203.0.113.2", dst_ip: "10.0.0.9", proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {total_probes: 100}}
          - {event_type: "scan_summary", agent_id: "agent-1", src_ip: "203.0.113.3", dst_ip: "10.0.0.9", proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {total_probes: 100}}
      - name: "summaries without probes do not fire"
        expected: no_match
        events:
          - {event_type: "scan_summary", agent_id: "agent-1", src_ip: "203.0.113.1", dst_ip: "10.0.0.9", proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {total_probes: 0}}

