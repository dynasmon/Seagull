  - id: dos_repeated_same_target_v1
    name: "Repeated DoS events on same target"
    description: "Repeated high-confidence DoS events to same destination indicate sustained impact activity."
    status: "active"
    risk_score: 54
    source: "dos_attack"
    false_positives: "Controlled load/performance tests against a single service."
    response: "Confirm event recurrence pattern and engage adaptive mitigation controls if unplanned."
