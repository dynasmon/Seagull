schema_version: 1
pack: lab
category: behavior
pack_version: 1
maturity: experimental
environments: ["dev", "lab", "homolog"]

rules:
  - id: beaconing_fixed_tuple_candidate_v1
    name: "Potential beaconing on fixed tuple"
    description: "Many low-byte flows on a fixed src/dst/port tuple in a short interval."
    false_positives: "Monitoring agents, software-update pollers, and chat/VoIP keepalives that poll a fixed endpoint on a regular cadence."
    response: "Correlate the fixed tuple against known management/update infrastructure; if the destination is untrusted, capture the periodic flows and inspect payload entropy and jitter before escalating."
    risk_score: 52
    mitre:
      tactic: "command_and_control"
      technique_id: "T1071"
      technique: "Application Layer Protocol"
      confidence: 60
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "10m"
    cooldown: "30m"
    match:
      event_type: "flow"
      bytes_lte: 1500
      dst_port_not_in: [53, 67, 68, 123]
    group_by: ["src_ip", "dst_ip", "dst_port", "proto"]
    condition:
      operator: ">="
      value: 140
    tuning:
      allowlist:
        src_cidrs: []
        dst_cidrs: []
        dst_ports: []
    tests:
      - id: fixed_tuple_beacon_fires
        description: "One hundred forty low-byte flows on a fixed tuple cross the beaconing threshold."
        expect: hit
        events:
          - {"event_type": "flow", "agent_id": "agent-1", "timestamp": "2026-06-01T00:00:00Z", "src_ip": "10.0.0.5", "dst_ip": "203.0.113.20", "dst_port": 8443, "proto": "tcp", "bytes": 200}
