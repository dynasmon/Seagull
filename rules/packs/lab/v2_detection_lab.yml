  - schema_version: 2
    id: v2_lab_port_scan_cardinality_v1
    name: "V2 Lab: Port scan cardinality"
    description: "Single source probing many distinct destination ports (v2 schema demo)."
    enabled: false
    status: disabled
    maturity: experimental
    severity: medium
    confidence: 65
    logsource:
      source: network
