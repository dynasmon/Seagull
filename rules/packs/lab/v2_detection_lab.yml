  - schema_version: 2
    id: v2_lab_lateral_multi_cardinality_v1
    name: "V2 Lab: Lateral movement multi-cardinality"
    description: "Source combines many distinct targets and ports for lateral movement (v2 schema demo)."
    enabled: false
    status: disabled
    maturity: experimental
    severity: high
    confidence: 72
    logsource:
      source: network
      event_type: lateral_conn
    attack:
      tactic: lateral_movement
      technique_id: T1021
      technique: "Remote Services"
      confidence: 72
    detection:
      selection:
        event.type: lateral_conn
        destination.port|in:
          - 22
          - 445
          - 3389
      condition: selection
    aggregation:
      type: multi_cardinality
      window: 10m
      group_by:
        - source.ip
      min_events: 20
      distinct_conditions:
        - field: destination.ip
          operator: ">="
          value: 5
        - field: destination.port
          operator: ">="
          value: 2
    suppression:
      cooldown: 30m
      rules: []
    tuning: {}
    response:
      playbook: Confirm whether the source host's role explains broad multi-service fan-out; otherwise treat as a lateral-movement pivot and correlate with recon or credential-access signals.
      false_positives: Backup, deployment, or orchestration hosts that legitimately reach many targets across SSH/SMB/RDP.
    tests:
      - id: lateral_multi_cardinality_fires
        description: "Twenty attempts spanning many hosts and two ports cross the v2 multi-cardinality threshold."
