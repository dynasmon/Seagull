schema_version: 2
pack: lab
category: v2_lab
pack_version: 1
maturity: experimental
environments: ["dev", "lab"]

rules:
  - schema_version: 2
    id: v2_lab_ssh_threshold_v1
    name: "V2 Lab: SSH auth threshold"
    description: "High volume of SSH auth events from a single source (v2 schema demo)."
    enabled: false
    status: disabled
    maturity: experimental
    severity: medium
    confidence: 70
    logsource:
      source: ssh_auth
      event_type: ssh_auth
    attack:
      tactic: credential_access
      technique_id: T1110.001
      technique: "Brute Force: Password Guessing"
      confidence: 70
    detection:
      selection:
        event.type: ssh_auth
        destination.port: 22
      condition: selection
    aggregation:
      type: threshold
      window: 5m
      group_by:
        - source.ip
        - destination.ip
      condition:
        operator: ">="
        value: 20
      min_events: 20
    suppression:
      cooldown: 15m
      rules: []
    tuning: {}
    response:
      playbook: Investigate the source IP for repeated SSH activity.
      false_positives: Automation or health-check accounts performing frequent scripted SSH logins from a fixed management host.
    tests:
      - id: ssh_volume_threshold_fires
        description: "Twenty SSH auth events from one source to one target cross the v2 threshold."
        expect: hit
        events:
          - {"event_type": "ssh_auth", "agent_id": "agent-1", "timestamp": "2026-06-01T00:00:00Z", "src_ip": "203.0.113.10", "dst_ip": "10.0.0.5", "dst_port": 22, "extra": {"source": "auth.log", "action": "failed_password", "src_port": 50000, "username": "user"}}
          - {"event_type": "ssh_auth", "agent_id": "agent-1", "timestamp": "2026-06-01T00:00:00Z", "src_ip": "203.0.113.10", "dst_ip": "10.0.0.5", "dst_port": 22, "extra": {"source": "auth.log", "action": "failed_password", "src_port": 50000, "username": "user"}}
