  - id: traffic_seen_smoke_v1
    name: "Smoke test: traffic ingestion"
    description: "Pipeline sanity check. Keep disabled by default and enable only during controlled validation windows."
    status: "disabled"
    source: "flow"
    false_positives: "Not intended for threat detection."
    response: "Use only for ingestion smoke validation."
    enabled: false
    severity: "low"
    type: "aggregate_count"
    window: "5m"
    cooldown: "30m"
    match:
      event_type: "flow"
    group_by: "agent_id"
    condition:
      operator: ">="
      value: 1
    tests:
      - id: any_flow_fires_smoke_signal
        description: "A single flow event satisfies the ingestion smoke signal."
        expect: hit
        events:
          - {"event_type": "flow", "agent_id": "agent-1", "timestamp": "2026-06-01T00:00:00Z", "src_ip": "203.0.113.10", "dst_ip": "10.0.0.5", "dst_port": 443, "proto": "tcp", "bytes": 1000}
      - id: non_flow_event_ignored
        description: "A non-flow event does not satisfy the flow-only smoke signal."
        expect: no_hit
        events:
          - {"event_type": "ssh_auth", "agent_id": "agent-1", "timestamp": "2026-06-01T00:00:00Z", "src_ip": "203.0.113.10", "dst_ip": "10.0.0.5", "dst_port": 22, "extra": {"source": "auth.log", "action": "accepted", "src_port": 50000, "username": "user"}}

