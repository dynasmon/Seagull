schema_version: 1
pack: core
category: baseline
pack_version: 2
maturity: stable

rules:
  - id: ssh_bruteforce_authlog_v2
    name: "SSH brute force (authlog-based, fast detector)"
    description: "Fast detector for concentrated SSH failures from one source to one target."
    status: "active"
    risk_score: 74
    source: "ssh_auth"
    false_positives: "Bursted login mistakes from jump hosts; use tuning allowlist for trusted automation origins."
    response: "Investigate source identity, block abusive source, and validate hardening on target SSH service."
    mitre:
      tactic: "credential_access"
      technique_id: "T1110.001"
      technique: "Brute Force: Password Guessing"
      confidence: 84
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "2m"
    cooldown: "10m"
    match:
      event_type: "ssh_auth"
      dst_port: 22
      extra_source: "auth.log"
      extra_action_in: ["failed_password", "invalid_user"]
      extra_src_port_gte: 1024
    group_by: ["src_ip", "dst_ip"]
    min_events: 10
    condition:
      operator: ">="
      value: 10
    tuning:
      allowlist:
        src_ips: []
        src_cidrs: []

  - id: port_scan_pcap_v1
    name: "Vertical port scan (pcap baseline)"
    description: "Deprecated in favor of tcp_vertical_port_scan_v3 (network/discovery), which detects the same vertical TCP scan with tuned anti-noise thresholds."
    status: "deprecated"
    source: "scan_probe"
    false_positives: "Superseded by tcp_vertical_port_scan_v3."
    response: "Use tcp_vertical_port_scan_v3 for active vertical TCP scan triage."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 86
    enabled: false
    severity: "high"
    type: "distinct_count"
    window: "2m"
    cooldown: "10m"
    match:
      event_type: "scan_probe"
      proto: "tcp"
      src_port_gte: 1024
      extra_scan_confidence_gte: 72
      extra_scan_type_not_in: ["tcp_ack"]
    group_by: ["src_ip", "dst_ip"]
    distinct_field: "dst_port"
    min_events: 30
    condition:
      operator: ">="
      value: 14

  - id: horizontal_scan_pcap_v1
    name: "Horizontal scan on a single port (deprecated baseline)"
    description: "Deprecated in favor of wide_ssh_recon_v1 and admin_surface_horizontal_recon_v1."
    status: "deprecated"
    source: "scan_probe"
    false_positives: "Superseded by tuned recon rules."
    response: "Use tuned recon pack rules for production triage."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 60
    enabled: false
    severity: "medium"
    type: "distinct_count"
    window: "5m"
    cooldown: "15m"
    match:
      event_type: "scan_probe"
      proto: "tcp"
      dst_port: 22
      extra_scan_confidence_gte: 70
    group_by: "src_ip"
    distinct_field: "dst_ip"
    condition:
      operator: ">="
      value: 4

  - id: traffic_seen_smoke_v1
    name: "Smoke test: traffic ingestion"
    description: "Pipeline sanity check. Keep disabled by default and enable only during controlled validation windows."
    status: "disabled"
    source: "flow"
    false_positives: "Not intended for threat detection."
    response: "Use only for ingestion smoke validation."
    enabled: false
    severity: "low"
    type: "aggregate_count"
    window: "5m"
    cooldown: "30m"
    match:
      event_type: "flow"
    group_by: "agent_id"
    condition:
      operator: ">="
      value: 1

  - id: horizontal_scan_ssh_pcap_v1
    name: "Horizontal scan on SSH (deprecated baseline)"
    description: "Deprecated in favor of wide_ssh_recon_v1 with stronger anti-noise thresholds."
    status: "deprecated"
    source: "scan_probe"
    false_positives: "Superseded by tuned recon pack rules."
    response: "Use wide_ssh_recon_v1 for active SSH sweep detection."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 60
    enabled: false
    severity: "medium"
    type: "distinct_count"
    window: "5m"
    cooldown: "15m"
    match:
      event_type: "scan_probe"
      proto: "tcp"
      dst_port: 22
      extra_scan_confidence_gte: 70
    group_by: "src_ip"
    distinct_field: "dst_ip"
    min_events: 10
    condition:
      operator: ">="
      value: 4

  - id: lateral_admin_ports_burst_v1
    name: "Lateral burst on admin ports (deprecated baseline)"
    description: "Deprecated in favor of network/lateral rules with richer service-specific ATT&CK mapping."
    status: "deprecated"
    source: "lateral_conn"
    false_positives: "Superseded by tuned lateral pack rules."
    response: "Use lateral_admin_spray_v1 and service-specific lateral rules."
    mitre:
      tactic: "lateral_movement"
      technique_id: "T1021"
      technique: "Remote Services"
      confidence: 58
    enabled: false
    severity: "high"
    type: "aggregate_count"
    window: "90s"
    cooldown: "10m"
    match:
      event_type: "lateral_conn"
      extra_lateral_kind: "attempt"
      dst_port_in: [445, 3389, 5985, 5986, 135, 139]
      extra_lateral_confidence_gte: 70
    group_by: "src_ip"
    condition:
      operator: ">="
      value: 12

  - id: lateral_admin_port_diversity_v1
    name: "Admin port diversity (deprecated baseline)"
    description: "Deprecated in favor of lateral_admin_multi_service_pivot_v1 with stronger context."
    status: "deprecated"
    source: "lateral_conn"
    false_positives: "Superseded by tuned lateral pack rules."
    response: "Use lateral_admin_multi_service_pivot_v1 for active triage."
    mitre:
      tactic: "lateral_movement"
      technique_id: "T1021"
      technique: "Remote Services"
      confidence: 55
    enabled: false
    severity: "medium"
    type: "distinct_count"
    window: "2m"
    cooldown: "15m"
    match:
      event_type: "lateral_conn"
      extra_lateral_kind: "attempt"
      extra_lateral_confidence_gte: 70
    group_by: "src_ip"
    distinct_field: "dst_port"
    min_events: 10
    condition:
      operator: ">="
      value: 3
