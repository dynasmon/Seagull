schema_version: 1
pack: core
category: baseline
pack_version: 1

rules:
  - id: ssh_bruteforce_authlog_v2
    name: "SSH brute force (authlog-based)"
    description: "Counts ssh_auth events per source IP."
    mitre:
      tactic: "credential_access"
      technique_id: "T1110.001"
      technique: "Brute Force: Password Guessing"
      confidence: 80
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "2m"
    cooldown: "10m"
    match:
      event_type: "ssh_auth"
      agent_id: "agent-proc-1"
      dst_port: 22
    group_by: "src_ip"
    condition:
      operator: ">="
      value: 8

  # 2) Vertical port scan (many ports on same target)
  - id: port_scan_pcap_v1
    name: "Vertical port scan (pcap)"
    description: "Distinct destination ports per source IP using scan_probe."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 85
    enabled: true
    severity: "high"
    type: "distinct_count"
    window: "2m"
    cooldown: "10m"
    match:
      event_type: "scan_probe"
      proto: "tcp"
    group_by: "src_ip"
    distinct_field: "dst_port"
    min_events: 25
    condition:
      operator: ">="
      value: 12


  # 3) Horizontal scan on a single port (e.g., SSH) across multiple destinations
  - id: horizontal_scan_pcap_v1
    name: "Horizontal scan on a single port (pcap)"
    description: "Distinct destination IPs per source IP for a fixed port using scan_probe."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 75
    enabled: true
    severity: "medium"
    type: "distinct_count"
    window: "5m"
    cooldown: "15m"
    match:
      event_type: "scan_probe"
      agent_id: "agent-scan-1"
      proto: "tcp"
      dst_port: 22
    group_by: "src_ip"
    distinct_field: "dst_ip"
    condition:
      operator: ">="
      value: 4

  # 4) Sanity check: any traffic observed from agent-proc-1
  - id: traffic_seen_smoke_v1
    name: "Smoke test: traffic ingestion"
    description: "Pipeline sanity check. Enable only during deployments."
    enabled: false
    severity: "low"
    type: "aggregate_count"
    window: "5m"
    cooldown: "30m"
    match:
      event_type: "flow"
      agent_id: "agent-proc-1"
    group_by: "agent_id"
    condition:
      operator: ">="
      value: 1

  - id: horizontal_scan_ssh_pcap_v1
    name: "Horizontal scan on SSH (pcap)"
    description: "Distinct destination IPs per source IP on dst_port 22 using scan_probe."
    mitre:
      tactic: "discovery"
      technique_id: "T1046"
      technique: "Network Service Scanning"
      confidence: 75
    enabled: true
    severity: "medium"
    type: "distinct_count"
    window: "5m"
    cooldown: "15m"
    match:
      event_type: "scan_probe"
      proto: "tcp"
      dst_port: 22
    group_by: "src_ip"
    distinct_field: "dst_ip"
    min_events: 10
    condition:
      operator: ">="
      value: 4

  - id: lateral_admin_ports_burst_v1
    name: "Lateral burst on admin ports"
    description: "High rate of admin-port attempts from one source (host-based)."
    mitre:
      tactic: "lateral_movement"
      technique_id: "T1021"
      technique: "Remote Services"
      confidence: 70
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "90s"
    cooldown: "10m"
    match:
      event_type: "lateral_conn"
      extra_lateral_kind: "attempt"
      dst_port_in: [445,3389,5985,5986,135,139]
    group_by: "src_ip"
    condition:
      operator: ">="
      value: 12

  - id: lateral_admin_port_diversity_v1
    name: "Admin port diversity (host-based)"
    description: "One source touching many admin ports on this host."
    mitre:
      tactic: "lateral_movement"
      technique_id: "T1021"
      technique: "Remote Services"
      confidence: 60
    enabled: true
    severity: "medium"
    type: "distinct_count"
    window: "2m"
    cooldown: "15m"
    match:
      event_type: "lateral_conn"
      extra_lateral_kind: "attempt"
    group_by: "src_ip"
    distinct_field: "dst_port"
    min_events: 10
    condition:
      operator: ">="
      value: 3
