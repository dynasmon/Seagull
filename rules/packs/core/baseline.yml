schema_version: 1
pack: core
category: baseline
pack_version: 2
maturity: stable

rules:
  - id: ssh_bruteforce_authlog_v2
    name: "SSH brute force (authlog-based, fast detector)"
    description: "Fast detector for concentrated SSH failures from one source to one target."
    status: "active"
    risk_score: 74
    source: "ssh_auth"
    false_positives: "Bursted login mistakes from jump hosts; use tuning allowlist for trusted automation origins."
    response: "Investigate source identity, block abusive source, and validate hardening on target SSH service."
    mitre:
      tactic: "credential_access"
      technique_id: "T1110.001"
      technique: "Brute Force: Password Guessing"
      confidence: 84
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "2m"
    cooldown: "10m"
    match:
      event_type: "ssh_auth"
      dst_port: 22
      extra_source: "auth.log"
      extra_action_in: ["failed_password", "invalid_user"]
      extra_src_port_gte: 1024
    group_by: ["src_ip", "dst_ip"]
    min_events: 10
    condition:
      operator: ">="
      value: 10
    tuning:
      allowlist:
        src_ips: []
        src_cidrs: []
    tests:
      - id: concentrated_failures_fire
        description: "Ten failures from one source to one target trip the fast authlog detector."
        expect: hit
        events:
          - {"event_type": "ssh_auth", "agent_id": "agent-1", "timestamp": "2026-06-01T00:00:00Z", "src_ip": "203.0.113.10", "dst_ip": "10.0.0.5", "dst_port": 22, "extra": {"source": "auth.log", "action": "failed_password", "src_port": 50000, "username": "user"}}
          - {"event_type": "ssh_auth", "agent_id": "agent-1", "timestamp": "2026-06-01T00:00:00Z", "src_ip": "203.0.113.10", "dst_ip": "10.0.0.5", "dst_port": 22, "extra": {"source": "auth.log", "action": "failed_password", "src_port": 50000, "username": "user"}}
