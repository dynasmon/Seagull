  - id: ssh_accepted_login_signal_v1
    name: "SSH accepted login from external source"
    description: "SSH authentication accepted from a high-port ephemeral source. Low-severity observability signal designed to surface successful logins for correlation with prior brute-force or spray detections from the same IP."
    status: "active"
    source: "ssh_auth"
    maturity: "stable"
    risk_score: 25
    false_positives: "All legitimate interactive and automation logins from approved remote management hosts. Expected to fire frequently on internet-exposed bastion hosts."
    response: "Check for recent brute-force or spray alerts from the same source IP in the preceding 30 minutes. If prior credential-guessing activity is present, treat the login as a likely compromise and escalate. Add known management source CIDRs to the allowlist to reduce signal volume."
    mitre:
      tactic: "initial_access"
      technique_id: "T1078"
      technique: "Valid Accounts"
      confidence: 55
    enabled: true
    severity: "low"
    type: "aggregate_count"
    window: "5m"
    cooldown: "30m"
    match:
      event_type: "ssh_auth"
      dst_port: 22
      extra_action: "accepted"
      extra_src_port_gte: 1024
    group_by: ["src_ip", "dst_ip", "ssh_username"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tuning:
      allowlist:
        src_cidrs: []
        src_ips: []
    tests:
      - name: "accepted login from ephemeral source fires"
        expected: match
        events:
          - {event_type: "ssh_auth", agent_id: "agent-1", src_ip: "198.51.100.10", dst_ip: "10.0.0.5", dst_port: 22, timestamp: "2026-06-01T00:00:00Z", extra: {action: "accepted", src_port: 40000, username: "deploy"}}
      - name: "failed password does not fire this signal"
        expected: no_match
        events:
          - {event_type: "ssh_auth", agent_id: "agent-1", src_ip: "198.51.100.10", dst_ip: "10.0.0.5", dst_port: 22, timestamp: "2026-06-01T00:00:00Z", extra: {action: "failed_password", src_port: 40000, username: "deploy"}}
      - name: "privileged source port does not fire"
        expected: no_match
        events:
          - {event_type: "ssh_auth", agent_id: "agent-1", src_ip: "198.51.100.10", dst_ip: "10.0.0.5", dst_port: 22, timestamp: "2026-06-01T00:00:00Z", extra: {action: "accepted", src_port: 22, username: "deploy"}}
