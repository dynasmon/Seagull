schema_version: 1
pack: core
category: auth
pack_version: 2
maturity: stable

rules:
  - id: ssh_invalid_user_burst_v1
    name: "SSH invalid-user burst"
    description: "Repeated invalid-user SSH attempts from one source to one target in a short window."
    status: "active"
    risk_score: 72
    source: "ssh_auth"
    false_positives: "Internet-exposed bastions under background scanning; tune with src_cidrs/src_ips allowlist when expected."
    response: "Block source at edge, inspect attempted usernames, and verify whether target host should expose SSH."
    mitre:
      tactic: "credential_access"
      technique_id: "T1110.001"
      technique: "Brute Force: Password Guessing"
      confidence: 82
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "3m"
    cooldown: "15m"
    match:
      event_type: "ssh_auth"
      dst_port: 22
      extra_source: "auth.log"
      extra_action: "invalid_user"
      extra_src_port_gte: 1024
    group_by: ["src_ip", "dst_ip"]
    min_events: 14
    condition:
      operator: ">="
      value: 14
    tuning:
      allowlist:
        src_cidrs: []
        src_ips: []
    tests:
      - id: burst_of_invalid_user_attempts_fires
        description: "Fourteen invalid-user attempts from one source to one target cross the burst threshold."
        expect: hit
        events:
          - {"event_type": "ssh_auth", "agent_id": "agent-1", "timestamp": "2026-06-01T00:00:00Z", "src_ip": "203.0.113.10", "dst_ip": "10.0.0.5", "dst_port": 22, "extra": {"source": "auth.log", "action": "invalid_user", "src_port": 50000, "username": "user"}}
          - {"event_type": "ssh_auth", "agent_id": "agent-1", "timestamp": "2026-06-01T00:00:00Z", "src_ip": "203.0.113.10", "dst_ip": "10.0.0.5", "dst_port": 22, "extra": {"source": "auth.log", "action": "invalid_user", "src_port": 50000, "username": "user"}}
