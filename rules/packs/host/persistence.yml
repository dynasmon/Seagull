schema_version: 1
pack: host
category: persistence
pack_version: 1
maturity: stable

rules:
  - id: persistence_cron_unprivileged_write_v1
    name: "Unprivileged cron persistence write"
    description: "Cron persistence files were created or modified by a non-root account."
    status: "active"
    risk_score: 74
    source: "persistence_cron"
    false_positives: "Rare automation agents with delegated cron ownership on non-production hosts."
    response: "Validate actor identity, review cron payload, and confirm whether host role expects delegated cron control."
    mitre:
      tactic: "persistence"
      technique_id: "T1053.003"
      technique: "Scheduled Task/Job: Cron"
      confidence: 86
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "12m"
    cooldown: "25m"
    match:
      event_type: "persistence_cron"
      extra_action_in: ["create", "modify", "rename"]
      extra_uid_neq: 0
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tuning:
      threshold_scopes:
        - name: "prod-hardening-threshold"
          when:
            environments: ["prod", "production"]
          min_events: 2
          condition: {operator: ">=", value: 2}
      allowlist_scopes:
        - name: "approved-config-mgmt-host"
          reason: "Known configuration-management host"
          when:
            host_roles: ["config-mgmt", "automation"]
            environments: ["dev", "lab"]
    tests:
      - name: "non-root cron create fires"
        expected: match
        events:
          - {event_type: "persistence_cron", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/cron.d/backup", path_category: "cron", action: "create", uid: 1000}}
      - name: "root-owned cron change does not fire"
        expected: no_match
        events:
          - {event_type: "persistence_cron", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/cron.d/backup", path_category: "cron", action: "create", uid: 0}}
      - name: "cron delete does not fire"
        expected: no_match
        events:
          - {event_type: "persistence_cron", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/cron.d/backup", path_category: "cron", action: "delete", uid: 1000}}

  - id: persistence_systemd_unit_create_modify_v1
    name: "Systemd unit create/modify persistence"
    description: "Systemd unit file was created, modified, or renamed in persistence paths."
    status: "active"
    risk_score: 56
    source: "persistence_systemd"
    false_positives: "Expected service rollout windows and package upgrades."
    response: "Inspect unit diff and ensure ExecStart target and owner align with approved deployment policy."
    mitre:
      tactic: "persistence"
      technique_id: "T1543.002"
      technique: "Create or Modify System Process: Systemd Service"
      confidence: 82
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "10m"
    cooldown: "20m"
    match:
      event_type: "persistence_systemd"
      extra_path_category: "systemd_unit"
      extra_action_in: ["create", "modify", "rename"]
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "new systemd unit fires"
        expected: match
        events:
          - {event_type: "persistence_systemd", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/systemd/system/payload.service", path_category: "systemd_unit", action: "create"}}
      - name: "override change does not match unit rule"
        expected: no_match
        events:
          - {event_type: "persistence_systemd", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/systemd/system/payload.service.d/override.conf", path_category: "systemd_override", action: "create"}}
      - name: "unit delete does not fire"
        expected: no_match
        events:
          - {event_type: "persistence_systemd", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/systemd/system/payload.service", path_category: "systemd_unit", action: "delete"}}

  - id: persistence_systemd_override_dropin_change_v1
    name: "Systemd override/drop-in persistence change"
    description: "Systemd override/drop-in content changed and may alter service startup behavior."
    status: "active"
    risk_score: 72
    source: "persistence_systemd"
    false_positives: "Legitimate service hardening with approved override snippets."
    response: "Review override directives and verify whether changed directives are expected for this host role."
    mitre:
      tactic: "persistence"
      technique_id: "T1543.002"
      technique: "Create or Modify System Process: Systemd Service"
      confidence: 84
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "12m"
    cooldown: "25m"
    match:
      event_type: "persistence_systemd"
      extra_path_category: "systemd_override"
      extra_action_in: ["create", "modify", "rename", "permission_change", "ownership_change"]
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "override drop-in modify fires"
        expected: match
        events:
          - {event_type: "persistence_systemd", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/systemd/system/ssh.service.d/override.conf", path_category: "systemd_override", action: "modify"}}
      - name: "plain unit change does not match override rule"
        expected: no_match
        events:
          - {event_type: "persistence_systemd", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/systemd/system/ssh.service", path_category: "systemd_unit", action: "modify"}}
      - name: "override read access does not fire"
        expected: no_match
        events:
          - {event_type: "persistence_systemd", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/systemd/system/ssh.service.d/override.conf", path_category: "systemd_override", action: "access"}}

  - id: persistence_authorized_keys_nonroot_change_v1
    name: "authorized_keys change by non-root user"
    description: "authorized_keys was changed and recorded UID is non-root."
    status: "active"
    risk_score: 76
    source: "ssh_key_change"
    false_positives: "Self-service key enrollment on non-privileged user accounts with approved workflows."
    response: "Validate account ownership and key provenance, then review lateral movement indicators from the same host."
    mitre:
      tactic: "persistence"
      technique_id: "T1098"
      technique: "Account Manipulation"
      confidence: 88
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "15m"
    cooldown: "30m"
    match:
      event_type: "ssh_key_change"
      extra_action_in: ["create", "modify", "rename", "permission_change", "ownership_change"]
      extra_uid_neq: 0
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "non-root authorized_keys modify fires"
        expected: match
        events:
          - {event_type: "ssh_key_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/home/dev/.ssh/authorized_keys", path_category: "ssh_authorized_keys", action: "modify", uid: 1000}}
      - name: "root-owned key change does not fire"
        expected: no_match
        events:
          - {event_type: "ssh_key_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/root/.ssh/authorized_keys", path_category: "ssh_authorized_keys", action: "modify", uid: 0}}
      - name: "read access does not fire"
        expected: no_match
        events:
          - {event_type: "ssh_key_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/home/dev/.ssh/authorized_keys", path_category: "ssh_authorized_keys", action: "access", uid: 1000}}

  - id: persistence_ssh_config_tamper_v1
    name: "SSH configuration tamper"
    description: "SSH daemon or client configuration changed in a security-sensitive way."
    status: "active"
    risk_score: 54
    source: "fim_change"
    false_positives: "Approved SSH hardening change windows."
    response: "Confirm authorized change request and inspect adjacent account/persistence activity on host."
    mitre:
      tactic: "persistence"
      technique_id: "T1098"
      technique: "Account Manipulation"
      confidence: 76
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "15m"
    cooldown: "25m"
    match:
      event_type: "fim_change"
      extra_path_category: "ssh_config"
      extra_action_in: ["modify", "rename", "permission_change", "ownership_change", "delete"]
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "sshd_config modify fires"
        expected: match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/ssh/sshd_config", path_category: "ssh_config", action: "modify"}}
      - name: "non-ssh config does not fire"
        expected: no_match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/nginx/nginx.conf", path_category: "config_file", action: "modify"}}
      - name: "fresh config create does not fire"
        expected: no_match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/ssh/sshd_config", path_category: "ssh_config", action: "create"}}

  - id: persistence_shell_profile_startup_change_v1
    name: "Shell startup/profile persistence"
    description: "Shell profile startup files changed, indicating potential user-level persistence."
    status: "active"
    risk_score: 50
    source: "fim_change"
    false_positives: "Expected shell profile customization by developers on workstation hosts."
    response: "Review modified profile command content and correlate with suspicious process execution from the same user context."
    mitre:
      tactic: "persistence"
      technique_id: "T1037"
      technique: "Boot or Logon Initialization Scripts"
      confidence: 74
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "20m"
    cooldown: "30m"
    match:
      event_type: "fim_change"
      extra_path_category: "shell_profile"
      extra_action_in: ["create", "modify", "rename"]
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "bashrc modify fires"
        expected: match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/home/dev/.bashrc", path_category: "shell_profile", action: "modify"}}
      - name: "non-profile file does not fire"
        expected: no_match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/home/dev/notes.txt", path_category: "user_file", action: "modify"}}
      - name: "profile delete does not fire"
        expected: no_match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/home/dev/.bashrc", path_category: "shell_profile", action: "delete"}}

  - id: persistence_rc_local_reactivation_v1
    name: "rc.local persistence reactivation"
    description: "rc.local changed, potentially re-enabling startup execution."
    status: "active"
    risk_score: 72
    source: "fim_change"
    false_positives: "Legacy init compatibility changes during approved maintenance."
    response: "Validate rc.local ownership, execution bits, and command payload legitimacy."
    mitre:
      tactic: "persistence"
      technique_id: "T1037"
      technique: "Boot or Logon Initialization Scripts"
      confidence: 80
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "30m"
    cooldown: "40m"
    match:
      event_type: "fim_change"
      extra_path_category: "rc_local"
      extra_action_in: ["create", "modify", "rename", "permission_change", "ownership_change"]
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "rc.local modify fires"
        expected: match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/rc.local", path_category: "rc_local", action: "modify"}}
      - name: "non-rc-local file does not fire"
        expected: no_match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/hosts", path_category: "config_file", action: "modify"}}
      - name: "rc.local read access does not fire"
        expected: no_match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/rc.local", path_category: "rc_local", action: "access"}}

  - id: persistence_unusual_tmp_staging_path_v1
    name: "Persistence staging in temporary execution paths"
    description: "Persistence-related file change occurred under temporary or memory-backed execution paths."
    status: "active"
    risk_score: 72
    source: "fim_change"
    false_positives: "Ephemeral test automation creating temporary bootstrap scripts."
    response: "Inspect artifact contents and process lineage that created the file; isolate host if unapproved."
    mitre:
      tactic: "persistence"
      technique_id: "T1037"
      technique: "Boot or Logon Initialization Scripts"
      confidence: 79
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "15m"
    cooldown: "30m"
    match:
      event_type: "fim_change"
      extra_persistence_related: true
      extra_action_in: ["create", "rename", "modify"]
      extra_path_contains: ["/tmp/", "/var/tmp/", "/dev/shm/"]
    group_by: ["agent_id", "fim_path"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "persistence artifact staged in tmp fires"
        expected: match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/dev/shm/startup.sh", path_category: "tmp_exec", action: "create", persistence_related: true}}
      - name: "non-persistence tmp change does not fire"
        expected: no_match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/dev/shm/startup.sh", path_category: "tmp_exec", action: "create", persistence_related: false}}
      - name: "persistence change outside tmp does not fire"
        expected: no_match
        events:
          - {event_type: "fim_change", agent_id: "agent-1", timestamp: "2026-06-01T00:00:00Z", extra: {path: "/etc/profile.d/app.sh", path_category: "shell_profile", action: "create", persistence_related: true}}
