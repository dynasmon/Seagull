schema_version: 1
pack: host
category: outbound_anomaly
pack_version: 1
maturity: stable

rules:
  - id: outbound_dns_app_on_non_dns_port_v1
    name: "Outbound DNS application protocol on non-DNS port"
    description: "Outbound L7 flow is classified as DNS but destination port is outside expected DNS ports."
    status: "active"
    risk_score: 70
    source: "l7_flow"
    false_positives: "Custom service-mesh forwarding where DNS-over-nonstandard ports is explicitly approved."
    response: "Validate destination service profile and inspect payload patterns for tunneling or C2 behavior."
    mitre:
      tactic: "command_and_control"
      technique_id: "T1071.004"
      technique: "Application Layer Protocol: DNS"
      confidence: 82
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "10m"
    cooldown: "20m"
    match:
      event_type: "l7_flow"
      extra_flow_direction: "outbound_from_local"
      extra_app_proto: "dns"
      dst_port_not_in: [53, 5353, 853]
    group_by: ["agent_id", "dst_ip", "dst_port", "proto"]
    min_events: 3
    condition:
      operator: ">="
      value: 3
    tests:
      - name: "repeated DNS app-proto on non-DNS port fires"
        expected: match
        events:
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 4444, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "dns"}}
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 4444, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "dns"}}
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 4444, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "dns"}}
      - name: "two events stay below threshold"
        expected: no_match
        events:
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 4444, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "dns"}}
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 4444, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "dns"}}
      - name: "DNS on standard DNS port does not fire"
        expected: no_match
        events:
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 53, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "dns"}}
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 53, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "dns"}}
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 53, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "dns"}}

  - id: outbound_http_on_admin_or_control_ports_v1
    name: "Outbound HTTP on admin/control ports"
    description: "Outbound HTTP traffic repeatedly targets ports atypical for HTTP usage."
    status: "active"
    risk_score: 54
    source: "l7_flow"
    false_positives: "Internal diagnostics services using alternate HTTP control ports."
    response: "Check destination ownership and inspect request metadata for command-and-control behavior."
    mitre:
      tactic: "command_and_control"
      technique_id: "T1071"
      technique: "Application Layer Protocol"
      confidence: 74
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "10m"
    cooldown: "20m"
    match:
      event_type: "l7_flow"
      extra_flow_direction: "outbound_from_local"
      extra_app_proto: "http"
      dst_port_in: [22, 53, 123]
    group_by: ["agent_id", "dst_ip", "dst_port", "proto"]
    min_events: 2
    condition:
      operator: ">="
      value: 2
    tests:
      - name: "repeated HTTP on SSH port fires"
        expected: match
        events:
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 22, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "http"}}
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 22, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "http"}}
      - name: "single event stays below threshold"
        expected: no_match
        events:
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 22, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "http"}}
      - name: "HTTP on standard web port does not fire"
        expected: no_match
        events:
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 80, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "http"}}
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 80, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "http"}}

  - id: outbound_tls_on_suspicious_ports_v1
    name: "Outbound TLS on suspicious protocol/port combination"
    description: "Outbound TLS is observed on ports commonly associated with non-TLS traffic or control channels."
    status: "active"
    risk_score: 68
    source: "l7_flow"
    false_positives: "Approved encrypted overlays using custom control-plane ports."
    response: "Validate destination profile and inspect SNI/host evidence for newly observed encrypted channels."
    mitre:
      tactic: "command_and_control"
      technique_id: "T1071"
      technique: "Application Layer Protocol"
      confidence: 80
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "10m"
    cooldown: "20m"
    match:
      event_type: "l7_flow"
      extra_flow_direction: "outbound_from_local"
      extra_app_proto: "tls"
      dst_port_in: [53, 123, 1900]
    group_by: ["agent_id", "dst_ip", "dst_port", "proto"]
    min_events: 2
    condition:
      operator: ">="
      value: 2
    tests:
      - name: "repeated TLS on SSDP port fires"
        expected: match
        events:
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 1900, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "tls"}}
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 1900, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "tls"}}
      - name: "single event stays below threshold"
        expected: no_match
        events:
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 1900, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "tls"}}
      - name: "non-TLS app proto does not fire"
        expected: no_match
        events:
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 1900, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "http"}}
          - {event_type: "l7_flow", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 1900, proto: "udp", timestamp: "2026-06-01T00:00:00Z", extra: {flow_direction: "outbound_from_local", app_proto: "http"}}

  - id: outbound_contextual_rare_destination_v1
    name: "Contextual rare outbound destination anomaly"
    description: "Derived egress anomaly indicates rare destination correlated with suspicious local execution or persistence."
    status: "active"
    risk_score: 74
    source: "egress_anomaly"
    false_positives: "One-time onboarding to newly approved external services without baseline warm-up."
    response: "Validate destination trust, inspect local suspicious chain, and block egress if destination is unapproved."
    mitre:
      tactic: "command_and_control"
      technique_id: "T1071"
      technique: "Application Layer Protocol"
      confidence: 88
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "20m"
    cooldown: "30m"
    match:
      event_type: "egress_anomaly"
      extra_reason_kind_in:
        - "rare_destination_after_suspicious_exec"
        - "bursty_outbound_after_persistence"
        - "rare_destination_unusual_protocol"
      extra_confidence_gte: 70
    group_by: ["agent_id", "dst_ip", "dst_port", "proto"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "rare destination after suspicious exec fires"
        expected: match
        events:
          - {event_type: "egress_anomaly", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {reason_kind: "rare_destination_after_suspicious_exec", confidence: 82}}
      - name: "low confidence does not fire"
        expected: no_match
        events:
          - {event_type: "egress_anomaly", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {reason_kind: "rare_destination_after_suspicious_exec", confidence: 60}}
      - name: "unrelated reason does not fire"
        expected: no_match
        events:
          - {event_type: "egress_anomaly", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {reason_kind: "known_destination", confidence: 90}}

  - id: outbound_contextual_bursty_upload_anomaly_v1
    name: "Contextual bursty outbound upload anomaly"
    description: "Derived egress anomaly reports bursty outbound bytes with baseline deviation."
    status: "active"
    risk_score: 72
    source: "egress_anomaly"
    false_positives: "Scheduled backup jobs to newly provisioned endpoints on approved backup hosts."
    response: "Confirm transfer intent and inspect associated process lineage and destination ownership."
    mitre:
      tactic: "exfiltration"
      technique_id: "T1048"
      technique: "Exfiltration Over Alternative Protocol"
      confidence: 84
    enabled: true
    severity: "high"
    type: "aggregate_count"
    window: "25m"
    cooldown: "35m"
    match:
      event_type: "egress_anomaly"
      extra_reason_kind_in: ["bursty_outbound", "bursty_outbound_after_persistence"]
      extra_recent_bytes_gte: 2097152
      extra_confidence_gte: 68
    group_by: ["agent_id", "dst_ip", "dst_port", "proto"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tuning:
      threshold_scopes:
        - name: "prod-backup-hosts"
          when:
            environments: ["prod", "production"]
            host_roles: ["backup", "storage"]
          min_events: 2
          condition: {operator: ">=", value: 2}
      allowlist_scopes:
        - name: "known-egress-gateway"
          reason: "Dedicated egress gateway host role"
          when:
            host_roles: ["egress-gateway", "proxy"]
            environments: ["dev", "lab"]
    tests:
      - name: "large bursty upload fires"
        expected: match
        events:
          - {event_type: "egress_anomaly", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {reason_kind: "bursty_outbound", recent_bytes: 8388608, confidence: 80}}
      - name: "small transfer below byte threshold does not fire"
        expected: no_match
        events:
          - {event_type: "egress_anomaly", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {reason_kind: "bursty_outbound", recent_bytes: 4096, confidence: 80}}
      - name: "unrelated reason does not fire"
        expected: no_match
        events:
          - {event_type: "egress_anomaly", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {reason_kind: "steady_baseline", recent_bytes: 8388608, confidence: 80}}

  - id: outbound_contextual_suspicious_host_pattern_v1
    name: "Contextual suspicious SNI/host pattern"
    description: "Derived egress anomaly identifies suspicious destination host naming patterns."
    status: "active"
    risk_score: 50
    source: "egress_anomaly"
    false_positives: "Legitimate CDNs with deep subdomain labels in specific SaaS integrations."
    response: "Inspect DNS/SNI profile, JA3/JA4 metadata, and whether destination was previously trusted for this host."
    mitre:
      tactic: "command_and_control"
      technique_id: "T1071"
      technique: "Application Layer Protocol"
      confidence: 76
    enabled: true
    severity: "medium"
    type: "aggregate_count"
    window: "25m"
    cooldown: "35m"
    match:
      event_type: "egress_anomaly"
      extra_host_suspicion_reason_in: ["many_labels", "long_host", "digit_heavy_host"]
      extra_confidence_gte: 62
    group_by: ["agent_id", "dst_ip", "dst_port", "proto"]
    min_events: 1
    condition:
      operator: ">="
      value: 1
    tests:
      - name: "many-label host pattern fires"
        expected: match
        events:
          - {event_type: "egress_anomaly", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {host_suspicion_reason: "many_labels", confidence: 70}}
      - name: "low confidence does not fire"
        expected: no_match
        events:
          - {event_type: "egress_anomaly", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {host_suspicion_reason: "many_labels", confidence: 50}}
      - name: "benign host pattern does not fire"
        expected: no_match
        events:
          - {event_type: "egress_anomaly", agent_id: "agent-1", dst_ip: "203.0.113.9", dst_port: 443, proto: "tcp", timestamp: "2026-06-01T00:00:00Z", extra: {host_suspicion_reason: "known_cdn", confidence: 90}}

  - schema_version: 2
    id: tls_ja4_on_http_port_v2
    name: "TLS ClientHello fingerprint on cleartext HTTP ports"
    description: "A JA4 TLS fingerprint was captured on destination port 80, 8080, or 8000. These ports normally carry unencrypted HTTP; a TLS ClientHello here indicates deliberate evasion or C2 tunneling over a port that perimeter controls may not decrypt."
    enabled: true
    status: active
    maturity: stable
    severity: high
    risk_score: 68
    confidence: 84
    logsource:
      source: l7_flow
      event_type: l7_flow
    attack:
      tactic: command_and_control
      technique_id: T1071.001
      technique: "Application Layer Protocol: Web Protocols"
      confidence: 84
    detection:
      selection:
        event.type: l7_flow
        tls.ja4|exists: true
        destination.port|in:
          - 80
          - 8080
          - 8000
      condition: selection
    aggregation:
      type: threshold
      window: 10m
      group_by:
        - agent.id
        - destination.ip
        - destination.port
      condition:
        operator: ">="
        value: 2
      min_events: 2
    suppression:
      cooldown: 20m
      rules: []
    tuning: {}
    response:
      playbook: "Inspect the JA4 fingerprint and destination profile. A TLS ClientHello on port 80 is inconsistent with normal HTTP traffic and may indicate C2 tunneling or deliberate HTTPS-to-HTTP downgrade evasion. Correlate with recent process execution and persistence signals on the same agent."
      false_positives: "Service mesh or reverse proxy configurations deliberately using mTLS on port 80 for internal traffic. Add the agent.id or destination.ip to allowlist if the behavior is expected and approved."
