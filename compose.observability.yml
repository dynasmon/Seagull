# compose.observability.yml — optional observability stack (Kibana, Grafana)
# Both services require profile "observability" to start: docker compose --profile observability up
# Requires: compose.base.yml, compose.data.yml (elasticsearch, postgres)

services:
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: seagull-kibana
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${SEAGULL_ES_USERNAME:-${NETWATCH_ES_USERNAME:-}}
      ELASTICSEARCH_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:-}}
      ELASTICSEARCH_PASSWORD_FILE: ${SEAGULL_ES_PASSWORD_FILE:-${NETWATCH_ES_PASSWORD_FILE:-}}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      - seagull
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: seagull-grafana
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-}
      GF_SECURITY_ADMIN_PASSWORD__FILE: ${GF_SECURITY_ADMIN_PASSWORD_FILE:-}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - seagull
    restart: unless-stopped
