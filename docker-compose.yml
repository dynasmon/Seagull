x-agent-env: &agent-env
  NETWATCH_API_URL: http://127.0.0.1:${NETWATCH_BACKEND_PORT}
  NETWATCH_HTTP_TIMEOUT: ${NETWATCH_HTTP_TIMEOUT}
  NETWATCH_CONTROL_HEARTBEAT_EVERY: ${NETWATCH_CONTROL_HEARTBEAT_EVERY}
  NETWATCH_CONTROL_CONFIG_EVERY: ${NETWATCH_CONTROL_CONFIG_EVERY}
  NETWATCH_PCAP_IFACE: ${NETWATCH_PCAP_IFACE}
  NETWATCH_SKIP_LOOPBACK: ${NETWATCH_SKIP_LOOPBACK}
  NETWATCH_SKIP_LINK_LOCAL: ${NETWATCH_SKIP_LINK_LOCAL}
  NETWATCH_DENY_CIDRS: ${NETWATCH_DENY_CIDRS}
  NETWATCH_DENY_DST_PORTS: ${NETWATCH_DENY_DST_PORTS}
  # Syscollector defaults (can be overridden by control-plane config)
  NETWATCH_AGENT_CONFIG_FILE: ${NETWATCH_AGENT_CONFIG_FILE}
  NETWATCH_SYSCOLLECT_EVERY: ${NETWATCH_SYSCOLLECT_EVERY}
  NETWATCH_SYSCOLLECT_CMD_TIMEOUT: ${NETWATCH_SYSCOLLECT_CMD_TIMEOUT}
  NETWATCH_SYSCOLLECT_MAX_OUTPUT_BYTES: ${NETWATCH_SYSCOLLECT_MAX_OUTPUT_BYTES}
  NETWATCH_SYSCOLLECT_MAX_PACKAGES: ${NETWATCH_SYSCOLLECT_MAX_PACKAGES}
  NETWATCH_AUTHLOG_DEDUP_TTL: ${NETWATCH_AUTHLOG_DEDUP_TTL}
  NETWATCH_AUTHLOG_INCLUDE_ACCEPTED: ${NETWATCH_AUTHLOG_INCLUDE_ACCEPTED}

x-agent-base: &agent-base
  build:
    context: ./agent
    dockerfile: Dockerfile
  network_mode: host
  user: "0:0"
  cap_add:
    - NET_RAW
    - NET_ADMIN
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: netwatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - netwatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  netwatch-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: netwatch-portal
    depends_on:
      - netwatch-backend
    ports:
      - "${NETWATCH_PORTAL_PORT:-8085}:5173"
    environment:
      NETWATCH_API_BASE: http://netwatch-backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    networks:
      - netwatch
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: netwatch-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - netwatch
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: netwatch-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    networks:
      - netwatch
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: netwatch-kibana
    profiles: ["extra"]
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-backend:
    build: ./backend
    container_name: netwatch-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${NETWATCH_UVICORN_WORKERS:-2}", "--no-access-log"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${NETWATCH_BACKEND_PORT}:8000"
    environment:
      NETWATCH_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NETWATCH_MAX_EVENT_CLOCK_SKEW_SECONDS: ${NETWATCH_MAX_EVENT_CLOCK_SKEW_SECONDS}
      NETWATCH_ENV: ${NETWATCH_ENV:-dev}
      NETWATCH_JWT_SECRET: ${NETWATCH_JWT_SECRET}
      NETWATCH_TOKEN_PEPPER: ${NETWATCH_TOKEN_PEPPER:-}
      NETWATCH_ACCESS_TOKEN_TTL_SECONDS: ${NETWATCH_ACCESS_TOKEN_TTL_SECONDS:-600}
      NETWATCH_REFRESH_TOKEN_TTL_SECONDS: ${NETWATCH_REFRESH_TOKEN_TTL_SECONDS:-604800}
      NETWATCH_OTP_TOKEN_TTL_SECONDS: ${NETWATCH_OTP_TOKEN_TTL_SECONDS:-900}
      NETWATCH_COOKIE_SECURE: ${NETWATCH_COOKIE_SECURE:-false}
      NETWATCH_COOKIE_SAMESITE: ${NETWATCH_COOKIE_SAMESITE:-lax}
      NETWATCH_COOKIE_DOMAIN: ${NETWATCH_COOKIE_DOMAIN:-}
      NETWATCH_SEARCH_BACKEND: ${NETWATCH_SEARCH_BACKEND:-auto}
      NETWATCH_ES_URL: ${NETWATCH_ES_URL:-http://elasticsearch:9200}
      NETWATCH_ES_INDEX_PREFIX: ${NETWATCH_ES_INDEX_PREFIX:-netwatch-events}
      NETWATCH_ES_REQUEST_TIMEOUT_SECONDS: ${NETWATCH_ES_REQUEST_TIMEOUT_SECONDS:-30}
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-}
      NETWATCH_ES_PASSWORD: ${NETWATCH_ES_PASSWORD:-}
      NETWATCH_ES_VERIFY_CERTS: ${NETWATCH_ES_VERIFY_CERTS:-true}
      NETWATCH_ES_CA_CERTS: ${NETWATCH_ES_CA_CERTS:-}
      NETWATCH_ES_PING_TTL_SECONDS: ${NETWATCH_ES_PING_TTL_SECONDS:-2}
      NETWATCH_BOOTSTRAP_ADMIN_USERNAME: ${NETWATCH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD: ${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD}
      NETWATCH_ENROLL_TOKEN: ${NETWATCH_ENROLL_TOKEN}
      NETWATCH_DEFAULT_AGENT_CONFIG_JSON: ${NETWATCH_DEFAULT_AGENT_CONFIG_JSON}
      NETWATCH_MAX_AGENT_CONFIG_BYTES: ${NETWATCH_MAX_AGENT_CONFIG_BYTES}
    volumes:
      - ./rules:/app/rules:ro
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-rules-worker:
    build: ./backend
    container_name: netwatch-rules-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NETWATCH_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NETWATCH_RULES_EVERY_SECONDS: ${NETWATCH_RULES_EVERY_SECONDS}
    volumes:
      - ./rules:/app/rules:ro
    command: ["python", "-m", "app.workers.runner"]
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-es-indexer:
    build: ./backend
    container_name: netwatch-es-indexer
    depends_on:
      postgres:
        condition: service_healthy
      netwatch-backend:
        condition: service_started
      elasticsearch:
        condition: service_started
    environment:
      NETWATCH_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NETWATCH_ES_URL: ${NETWATCH_ES_URL:-http://elasticsearch:9200}
      NETWATCH_ES_INDEX_PREFIX: ${NETWATCH_ES_INDEX_PREFIX:-netwatch-events}
      NETWATCH_ES_BATCH_SIZE: ${NETWATCH_ES_BATCH_SIZE:-500}
      NETWATCH_ES_EVERY_SECONDS: ${NETWATCH_ES_EVERY_SECONDS:-1}
      NETWATCH_ES_IDLE_SLEEP_SECONDS: ${NETWATCH_ES_IDLE_SLEEP_SECONDS:-2}
      NETWATCH_ES_REQUEST_TIMEOUT_SECONDS: ${NETWATCH_ES_REQUEST_TIMEOUT_SECONDS:-30}
      NETWATCH_ES_BOOTSTRAP: ${NETWATCH_ES_BOOTSTRAP:-true}
    command: ["python", "-m", "app.workers.es_indexer"]
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-rollup-worker:
    build: ./backend
    container_name: netwatch-rollup-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NETWATCH_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NETWATCH_ROLLUP_EVERY_SECONDS: ${NETWATCH_ROLLUP_EVERY_SECONDS:-1}
      NETWATCH_ROLLUP_IDLE_SLEEP_SECONDS: ${NETWATCH_ROLLUP_IDLE_SLEEP_SECONDS:-2}
      NETWATCH_ROLLUP_MAX_ROWS: ${NETWATCH_ROLLUP_MAX_ROWS:-5000}
    command: ["python", "-m", "app.workers.rollup_1m"]
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-ip-intel:
    build: ./backend
    container_name: netwatch-ip-intel
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NETWATCH_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NETWATCH_IPINFO_TOKEN: ${NETWATCH_IPINFO_TOKEN}
      NETWATCH_IP_INTEL_EVERY_SECONDS: ${NETWATCH_IP_INTEL_EVERY_SECONDS:-1}
      NETWATCH_IP_INTEL_IDLE_SLEEP_SECONDS: ${NETWATCH_IP_INTEL_IDLE_SLEEP_SECONDS:-2}
      NETWATCH_IP_INTEL_MAX_ROWS: ${NETWATCH_IP_INTEL_MAX_ROWS:-2000}
      NETWATCH_IP_INTEL_BATCH_SIZE: ${NETWATCH_IP_INTEL_BATCH_SIZE:-200}
      NETWATCH_IP_INTEL_HTTP_TIMEOUT_SECONDS: ${NETWATCH_IP_INTEL_HTTP_TIMEOUT_SECONDS:-8}
      NETWATCH_IP_INTEL_CACHE_TTL_DAYS: ${NETWATCH_IP_INTEL_CACHE_TTL_DAYS:-7}
      NETWATCH_IP_INTEL_SKIP_PRIVATE: ${NETWATCH_IP_INTEL_SKIP_PRIVATE:-true}
    command: ["python", "-m", "app.workers.ip_intel"]
    networks:
      - netwatch
    restart: always

  netwatch-proto-intel:
    build: ./backend
    container_name: netwatch-proto-intel
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Keep DB wiring consistent across workers.
      NETWATCH_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      NETWATCH_PROTO_INTEL_EVERY_SECONDS: ${NETWATCH_PROTO_INTEL_EVERY_SECONDS:-1.0}
      NETWATCH_PROTO_INTEL_IDLE_SLEEP_SECONDS: ${NETWATCH_PROTO_INTEL_IDLE_SLEEP_SECONDS:-2.0}
      NETWATCH_PROTO_INTEL_MAX_ROWS: ${NETWATCH_PROTO_INTEL_MAX_ROWS:-5000}
      NETWATCH_PROTO_INTEL_BATCH_SIZE: ${NETWATCH_PROTO_INTEL_BATCH_SIZE:-500}
      NETWATCH_PROTO_INTEL_PAYLOAD_MAX_BYTES: ${NETWATCH_PROTO_INTEL_PAYLOAD_MAX_BYTES:-4096}
    command: ["python", "-m", "app.workers.proto_intel"]
    networks:
      - netwatch
    restart: always

  grafana:
    image: grafana/grafana-oss:latest
    container_name: netwatch-grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-agent-proc:
    <<: *agent-base
    container_name: netwatch-agent-proc-1
    depends_on:
      - netwatch-backend
    environment:
      <<: *agent-env
      NETWATCH_AGENT_ID: ${AGENT_PROC_ID}
      NETWATCH_SOURCES: proc,authlog,syscollector
      NETWATCH_AUTHLOG_PATH: /var/log/auth.log
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro
      - agent-proc-state:/var/lib/netwatch

  netwatch-agent-scan:
    <<: *agent-base
    container_name: netwatch-agent-scan-1
    depends_on:
      - netwatch-backend
    environment:
      <<: *agent-env
      NETWATCH_AGENT_ID: ${AGENT_SCAN_ID}
      NETWATCH_SOURCES: scan,syscollector
    volumes:
      - agent-scan-state:/var/lib/netwatch

  netwatch-agent-lateral:
    <<: *agent-base
    container_name: netwatch-agent-lateral
    depends_on:
      - netwatch-backend
    profiles: ["extra"]
    environment:
      <<: *agent-env
      NETWATCH_AGENT_ID: ${AGENT_LATERAL_ID}
      NETWATCH_SOURCES: lateral,syscollector
      NETWATCH_LATERAL_MODE: ${NETWATCH_LATERAL_MODE}
      NETWATCH_LATERAL_PCAP_IFACE: ${NETWATCH_LATERAL_PCAP_IFACE}
      NETWATCH_LATERAL_PORTS: ${NETWATCH_LATERAL_PORTS}
      NETWATCH_LATERAL_INCLUDE_ESTABLISHED: ${NETWATCH_LATERAL_INCLUDE_ESTABLISHED}
      NETWATCH_LATERAL_DEDUP_TTL: ${NETWATCH_LATERAL_DEDUP_TTL}
      NETWATCH_LATERAL_MAX_BATCH: ${NETWATCH_LATERAL_MAX_BATCH}
    volumes:
      - agent-lateral-state:/var/lib/netwatch

  netwatch-agent-ddos:
    <<: *agent-base
    container_name: netwatch-agent-ddos
    depends_on:
      - netwatch-backend
    environment:
      <<: *agent-env
      NETWATCH_AGENT_ID: ${AGENT_DDOS_ID}
      NETWATCH_SOURCES: ddos,syscollector
      NETWATCH_DDOS_SUSTAIN_WINDOWS: ${NETWATCH_DDOS_SUSTAIN_WINDOWS}
      NETWATCH_DDOS_COOLDOWN: ${NETWATCH_DDOS_COOLDOWN}
    volumes:
      - agent-ddos-state:/var/lib/netwatch

networks:
  netwatch:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  elastic-data:
  agent-proc-state:
  agent-scan-state:
  agent-ddos-state:
  agent-lateral-state:
