x-agent-env: &agent-env
  NETWATCH_API_URL: http://127.0.0.1:${NETWATCH_BACKEND_PORT}
  NETWATCH_HTTP_TIMEOUT: ${NETWATCH_HTTP_TIMEOUT}
  NETWATCH_CONTROL_HEARTBEAT_EVERY: ${NETWATCH_CONTROL_HEARTBEAT_EVERY}
  NETWATCH_CONTROL_CONFIG_EVERY: ${NETWATCH_CONTROL_CONFIG_EVERY}
  NETWATCH_PCAP_IFACE: ${NETWATCH_PCAP_IFACE}
  NETWATCH_SKIP_LOOPBACK: ${NETWATCH_SKIP_LOOPBACK}
  NETWATCH_SKIP_LINK_LOCAL: ${NETWATCH_SKIP_LINK_LOCAL}
  NETWATCH_DENY_CIDRS: ${NETWATCH_DENY_CIDRS}
  NETWATCH_DENY_DST_PORTS: ${NETWATCH_DENY_DST_PORTS}

x-agent-base: &agent-base
  build:
    context: ./agent
    dockerfile: Dockerfile
  network_mode: host
  user: "0:0"
  cap_add:
    - NET_RAW
    - NET_ADMIN
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: netwatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - netwatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: netwatch-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-backend:
    build: ./backend
    container_name: netwatch-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${NETWATCH_BACKEND_PORT}:8000"
    environment:
      NETWATCH_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NETWATCH_MAX_EVENT_CLOCK_SKEW_SECONDS: ${NETWATCH_MAX_EVENT_CLOCK_SKEW_SECONDS}
    volumes:
      - ./rules:/app/rules:ro
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-rules-worker:
    build: ./backend
    container_name: netwatch-rules-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NETWATCH_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NETWATCH_RULES_EVERY_SECONDS: ${NETWATCH_RULES_EVERY_SECONDS}
    volumes:
      - ./rules:/app/rules:ro
    command: ["python", "-m", "app.workers.runner"]
    networks:
      - netwatch
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: netwatch-grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-agent-proc:
    <<: *agent-base
    container_name: netwatch-agent-proc-1
    depends_on:
      - netwatch-backend
    environment:
      <<: *agent-env
      NETWATCH_AGENT_ID: ${AGENT_PROC_ID}
      NETWATCH_SOURCES: proc,authlog
      NETWATCH_AUTHLOG_PATH: /var/log/auth.log
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro
      - agent-proc-state:/var/lib/netwatch

  netwatch-agent-scan:
    <<: *agent-base
    container_name: netwatch-agent-scan-1
    depends_on:
      - netwatch-backend
    environment:
      <<: *agent-env
      NETWATCH_AGENT_ID: ${AGENT_SCAN_ID}
      NETWATCH_SOURCES: scan
    volumes:
      - agent-scan-state:/var/lib/netwatch

  netwatch-agent-ddos:
    <<: *agent-base
    container_name: netwatch-agent-ddos
    depends_on:
      - netwatch-backend
    environment:
      <<: *agent-env
      NETWATCH_AGENT_ID: ${AGENT_DDOS_ID}
      NETWATCH_SOURCES: ddos
      NETWATCH_DDOS_SUSTAIN_WINDOWS: ${NETWATCH_DDOS_SUSTAIN_WINDOWS}
      NETWATCH_DDOS_COOLDOWN: ${NETWATCH_DDOS_COOLDOWN}
    volumes:
      - agent-ddos-state:/var/lib/netwatch

  netwatch-agent-lateral:
    <<: *agent-base
    container_name: netwatch-agent-lateral
    depends_on:
      - netwatch-backend
    profiles: ["extra"]
    environment:
      <<: *agent-env
      NETWATCH_AGENT_ID: ${AGENT_LATERAL_ID}
      NETWATCH_SOURCES: lateral
      NETWATCH_LATERAL_MODE: ${NETWATCH_LATERAL_MODE}
      NETWATCH_LATERAL_PCAP_IFACE: ${NETWATCH_LATERAL_PCAP_IFACE}
      NETWATCH_LATERAL_PORTS: ${NETWATCH_LATERAL_PORTS}
      NETWATCH_LATERAL_INCLUDE_ESTABLISHED: ${NETWATCH_LATERAL_INCLUDE_ESTABLISHED}
      NETWATCH_LATERAL_DEDUP_TTL: ${NETWATCH_LATERAL_DEDUP_TTL}
      NETWATCH_LATERAL_MAX_BATCH: ${NETWATCH_LATERAL_MAX_BATCH}
    volumes:
      - agent-lateral-state:/var/lib/netwatch

networks:
  netwatch:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  agent-proc-state:
  agent-scan-state:
  agent-ddos-state:
  agent-lateral-state:
