x-agent-env: &agent-env
  SEAGULL_API_URL: ${SEAGULL_API_URL:-https://127.0.0.1:${SEAGULL_EDGE_HTTPS_PORT:-${NETWATCH_EDGE_HTTPS_PORT:-8443}}/agent}
  SEAGULL_HTTP_TIMEOUT: ${SEAGULL_HTTP_TIMEOUT:-${NETWATCH_HTTP_TIMEOUT:-}}
  SEAGULL_CONTROL_HEARTBEAT_EVERY: ${SEAGULL_CONTROL_HEARTBEAT_EVERY:-${NETWATCH_CONTROL_HEARTBEAT_EVERY:-}}
  SEAGULL_CONTROL_HEARTBEAT_JITTER: ${SEAGULL_CONTROL_HEARTBEAT_JITTER:-${NETWATCH_CONTROL_HEARTBEAT_JITTER:-5s}}
  SEAGULL_CONTROL_CONFIG_EVERY: ${SEAGULL_CONTROL_CONFIG_EVERY:-${NETWATCH_CONTROL_CONFIG_EVERY:-}}
  SEAGULL_CONTROL_CONFIG_JITTER: ${SEAGULL_CONTROL_CONFIG_JITTER:-${NETWATCH_CONTROL_CONFIG_JITTER:-30s}}
  SEAGULL_PCAP_IFACE: ${SEAGULL_PCAP_IFACE:-${NETWATCH_PCAP_IFACE:-}}
  SEAGULL_SKIP_LOOPBACK: ${SEAGULL_SKIP_LOOPBACK:-${NETWATCH_SKIP_LOOPBACK:-}}
  SEAGULL_SKIP_LINK_LOCAL: ${SEAGULL_SKIP_LINK_LOCAL:-${NETWATCH_SKIP_LINK_LOCAL:-}}
  SEAGULL_DENY_CIDRS: ${SEAGULL_DENY_CIDRS:-${NETWATCH_DENY_CIDRS:-}}
  SEAGULL_DENY_DST_PORTS: ${SEAGULL_DENY_DST_PORTS:-${NETWATCH_DENY_DST_PORTS:-}}
  # Syscollector defaults (can be overridden by control-plane config)
  SEAGULL_AGENT_CONFIG_FILE: ${SEAGULL_AGENT_CONFIG_FILE:-${NETWATCH_AGENT_CONFIG_FILE:-}}
  SEAGULL_SYSCOLLECT_EVERY: ${SEAGULL_SYSCOLLECT_EVERY:-${NETWATCH_SYSCOLLECT_EVERY:-}}
  SEAGULL_SYSCOLLECT_STARTUP_JITTER: ${SEAGULL_SYSCOLLECT_STARTUP_JITTER:-${NETWATCH_SYSCOLLECT_STARTUP_JITTER:-45s}}
  SEAGULL_SYSCOLLECT_CMD_TIMEOUT: ${SEAGULL_SYSCOLLECT_CMD_TIMEOUT:-${NETWATCH_SYSCOLLECT_CMD_TIMEOUT:-}}
  SEAGULL_SYSCOLLECT_MAX_OUTPUT_BYTES: ${SEAGULL_SYSCOLLECT_MAX_OUTPUT_BYTES:-${NETWATCH_SYSCOLLECT_MAX_OUTPUT_BYTES:-}}
  SEAGULL_SYSCOLLECT_MAX_PACKAGES: ${SEAGULL_SYSCOLLECT_MAX_PACKAGES:-${NETWATCH_SYSCOLLECT_MAX_PACKAGES:-}}
  SEAGULL_AUTHLOG_DEDUP_TTL: ${SEAGULL_AUTHLOG_DEDUP_TTL:-${NETWATCH_AUTHLOG_DEDUP_TTL:-}}
  SEAGULL_AUTHLOG_INCLUDE_ACCEPTED: ${SEAGULL_AUTHLOG_INCLUDE_ACCEPTED:-${NETWATCH_AUTHLOG_INCLUDE_ACCEPTED:-}}
  SEAGULL_VULN_STARTUP_JITTER: ${SEAGULL_VULN_STARTUP_JITTER:-${NETWATCH_VULN_STARTUP_JITTER:-2m}}
  SEAGULL_AGENT_BOOTSTRAP_TOKEN: ${SEAGULL_AGENT_BOOTSTRAP_TOKEN:-${NETWATCH_AGENT_BOOTSTRAP_TOKEN:-}}
  SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: ${SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE:-${NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE:-}}
  SEAGULL_FORCE_ENROLL_ON_START: ${SEAGULL_FORCE_ENROLL_ON_START:-${NETWATCH_FORCE_ENROLL_ON_START:-true}}
  SEAGULL_TLS_SERVER_NAME: ${SEAGULL_AGENT_TLS_SERVER_NAME:-${NETWATCH_AGENT_TLS_SERVER_NAME:-localhost}}
  SEAGULL_AGENT_CREDENTIAL_FILE: ${SEAGULL_AGENT_CREDENTIAL_FILE:-${NETWATCH_AGENT_CREDENTIAL_FILE:-/var/lib/seagull/agent.credential}}
  SEAGULL_TLS_CA_FILE: ${SEAGULL_TLS_CA_FILE:-${NETWATCH_TLS_CA_FILE:-/etc/seagull/server-ca.crt}}
  SEAGULL_CONTROL_CREDENTIAL_ROTATE_EVERY: ${SEAGULL_CONTROL_CREDENTIAL_ROTATE_EVERY:-${NETWATCH_CONTROL_CREDENTIAL_ROTATE_EVERY:-5m}}
  SEAGULL_CONTROL_CREDENTIAL_ROTATE_BEFORE: ${SEAGULL_CONTROL_CREDENTIAL_ROTATE_BEFORE:-${NETWATCH_CONTROL_CREDENTIAL_ROTATE_BEFORE:-24h}}

x-agent-build: &agent-build
  build:
    context: ./agent
    dockerfile: Dockerfile

x-agent-common: &agent-common
  <<: *agent-build
  network_mode: host
  user: "0:0"
  group_add:
    - "${SEAGULL_HOST_ADM_GID:-${NETWATCH_HOST_ADM_GID:-4}}"
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-agent-core-base: &agent-core-base
  <<: *agent-common
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  mem_limit: 384m
  cpus: "0.75"

x-agent-sensor-base: &agent-sensor-base
  <<: *agent-common
  cap_drop:
    - ALL
  cap_add:
    - NET_RAW
    - NET_ADMIN
  read_only: true
  tmpfs:
    - /tmp
  mem_limit: 512m
  cpus: "1.50"

services:
  postgres:
    image: postgres:16-alpine
    container_name: seagull-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - seagull
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "DB_PASS=\"$${POSTGRES_PASSWORD:-}\"; if [ -z \"$$DB_PASS\" ] && [ -n \"$${POSTGRES_PASSWORD_FILE:-}\" ]; then DB_PASS=\"$$(cat \"$${POSTGRES_PASSWORD_FILE}\")\"; fi; PGPASSWORD=\"$$DB_PASS\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc 'SELECT 1' >/dev/null 2>&1 || { echo 'postgres auth failed: verify POSTGRES_PASSWORD against existing postgres-data volume; for disposable dev data run: make nuke'; exit 1; }",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  seagull-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seagull-portal
    depends_on:
      seagull-backend:
        condition: service_healthy
    environment: {}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "0.50"
    networks:
      - seagull
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: seagull-redis
    command: ["/bin/sh", "/etc/seagull/redis/start.sh"]
    environment:
      SEAGULL_REDIS_PASSWORD: ${SEAGULL_REDIS_PASSWORD:-${NETWATCH_REDIS_PASSWORD:-}}
      SEAGULL_REDIS_PASSWORD_FILE: ${SEAGULL_REDIS_PASSWORD_FILE:-${NETWATCH_REDIS_PASSWORD_FILE:-}}
      SEAGULL_REDIS_CONFIG_FILE: /etc/seagull/redis/redis.dev.conf
      SEAGULL_REDIS_STRICT_PASSWORD: "false"
    volumes:
      - ./infra/redis:/etc/seagull/redis:ro
      - redis-data:/data
    networks:
      - seagull
    healthcheck:
      test: ["CMD", "/bin/sh", "/etc/seagull/redis/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: seagull-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    networks:
      - seagull
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ES_PASSWORD=\"$${ELASTIC_PASSWORD:-}\"; if [ -z \"$$ES_PASSWORD\" ] && [ -n \"$${ELASTIC_PASSWORD_FILE:-}\" ]; then ES_PASSWORD=\"$$(cat \"$${ELASTIC_PASSWORD_FILE}\")\"; fi; if [ -n \"$$ES_PASSWORD\" ]; then curl -fsS -u \"elastic:$$ES_PASSWORD\" \"http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s\" >/dev/null; else curl -fsS \"http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s\" >/dev/null; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: seagull-clickhouse
    environment:
      CLICKHOUSE_DB: ${SEAGULL_CLICKHOUSE_DATABASE:-${NETWATCH_CLICKHOUSE_DATABASE:-seagull}}
      CLICKHOUSE_USER: ${SEAGULL_CLICKHOUSE_USERNAME:-${NETWATCH_CLICKHOUSE_USERNAME:-default}}
      CLICKHOUSE_PASSWORD: ${SEAGULL_CLICKHOUSE_PASSWORD:-${NETWATCH_CLICKHOUSE_PASSWORD:-}}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    networks:
      - seagull
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q 'Ok.'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: seagull-kibana
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${SEAGULL_ES_USERNAME:-${NETWATCH_ES_USERNAME:-}}
      ELASTICSEARCH_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:-}}
      ELASTICSEARCH_PASSWORD_FILE: ${SEAGULL_ES_PASSWORD_FILE:-${NETWATCH_ES_PASSWORD_FILE:-}}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      - seagull
    restart: unless-stopped

  seagull-backend:
    build: ./backend
    container_name: seagull-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${SEAGULL_UVICORN_WORKERS:-${NETWATCH_UVICORN_WORKERS:-2}}", "--no-access-log"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SEAGULL_BACKEND_PORT:-${NETWATCH_BACKEND_PORT:-}}:8000"
    environment:
      SEAGULL_DB_HOST: postgres
      SEAGULL_DB_PORT: 5432
      SEAGULL_DB_NAME: ${POSTGRES_DB}
      SEAGULL_DB_USER: ${POSTGRES_USER}
      SEAGULL_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      SEAGULL_DB_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      SEAGULL_REDIS_PASSWORD: ${SEAGULL_REDIS_PASSWORD:-${NETWATCH_REDIS_PASSWORD:-}}
      SEAGULL_REDIS_PASSWORD_FILE: ${SEAGULL_REDIS_PASSWORD_FILE:-${NETWATCH_REDIS_PASSWORD_FILE:-}}
      SEAGULL_MAX_EVENT_CLOCK_SKEW_SECONDS: ${SEAGULL_MAX_EVENT_CLOCK_SKEW_SECONDS:-${NETWATCH_MAX_EVENT_CLOCK_SKEW_SECONDS:-}}
      # Ingest storm control (protect Postgres under volumetric attacks)
      SEAGULL_INGEST_MAX_BATCH: ${SEAGULL_INGEST_MAX_BATCH:-${NETWATCH_INGEST_MAX_BATCH:-10000}}
      SEAGULL_INGEST_STORM_EVENTS_PER_SECOND: ${SEAGULL_INGEST_STORM_EVENTS_PER_SECOND:-${NETWATCH_INGEST_STORM_EVENTS_PER_SECOND:-8000}}
      SEAGULL_INGEST_STORM_MIN_BATCH: ${SEAGULL_INGEST_STORM_MIN_BATCH:-${NETWATCH_INGEST_STORM_MIN_BATCH:-2500}}
      SEAGULL_INGEST_STORM_TTL_SECONDS: ${SEAGULL_INGEST_STORM_TTL_SECONDS:-${NETWATCH_INGEST_STORM_TTL_SECONDS:-20}}
      SEAGULL_INGEST_STORM_SAMPLE_PERCENT: ${SEAGULL_INGEST_STORM_SAMPLE_PERCENT:-${NETWATCH_INGEST_STORM_SAMPLE_PERCENT:-2}}
      SEAGULL_INGEST_ROLLUP_ALWAYS: ${SEAGULL_INGEST_ROLLUP_ALWAYS:-${NETWATCH_INGEST_ROLLUP_ALWAYS:-false}}
      SEAGULL_INGEST_VALUES_PAGE_SIZE: ${SEAGULL_INGEST_VALUES_PAGE_SIZE:-${NETWATCH_INGEST_VALUES_PAGE_SIZE:-1000}}
      SEAGULL_INGEST_ROLLUP_PAGE_SIZE: ${SEAGULL_INGEST_ROLLUP_PAGE_SIZE:-${NETWATCH_INGEST_ROLLUP_PAGE_SIZE:-500}}
      # Backpressure (Redis queue)
      SEAGULL_INGEST_QUEUE_KEY: ${SEAGULL_INGEST_QUEUE_KEY:-${NETWATCH_INGEST_QUEUE_KEY:-seagull:ingest:queue}}
      SEAGULL_INGEST_WORKER_BATCH_MESSAGES: ${SEAGULL_INGEST_WORKER_BATCH_MESSAGES:-${NETWATCH_INGEST_WORKER_BATCH_MESSAGES:-50}}
      SEAGULL_INGEST_WORKER_IDLE_SLEEP_SECONDS: ${SEAGULL_INGEST_WORKER_IDLE_SLEEP_SECONDS:-${NETWATCH_INGEST_WORKER_IDLE_SLEEP_SECONDS:-0.25}}
      SEAGULL_INGEST_BACKPRESSURE_SOFT_BACKLOG_EVENTS: ${SEAGULL_INGEST_BACKPRESSURE_SOFT_BACKLOG_EVENTS:-${NETWATCH_INGEST_BACKPRESSURE_SOFT_BACKLOG_EVENTS:-50000}}
      SEAGULL_INGEST_BACKPRESSURE_HARD_BACKLOG_EVENTS: ${SEAGULL_INGEST_BACKPRESSURE_HARD_BACKLOG_EVENTS:-${NETWATCH_INGEST_BACKPRESSURE_HARD_BACKLOG_EVENTS:-200000}}
      SEAGULL_INGEST_BACKPRESSURE_MODE: ${SEAGULL_INGEST_BACKPRESSURE_MODE:-${NETWATCH_INGEST_BACKPRESSURE_MODE:-rollup_only}}
      SEAGULL_INGEST_BACKPRESSURE_WARM_SAMPLE_PERCENT: ${SEAGULL_INGEST_BACKPRESSURE_WARM_SAMPLE_PERCENT:-${NETWATCH_INGEST_BACKPRESSURE_WARM_SAMPLE_PERCENT:-2}}

      # Hot/Warm sampling
      SEAGULL_INGEST_WARM_ENABLED: ${SEAGULL_INGEST_WARM_ENABLED:-${NETWATCH_INGEST_WARM_ENABLED:-true}}
      SEAGULL_INGEST_WARM_SAMPLE_PERCENT: ${SEAGULL_INGEST_WARM_SAMPLE_PERCENT:-${NETWATCH_INGEST_WARM_SAMPLE_PERCENT:-0}}
      SEAGULL_INGEST_STORM_HOT_SAMPLE_PERCENT: ${SEAGULL_INGEST_STORM_HOT_SAMPLE_PERCENT:-${NETWATCH_INGEST_STORM_HOT_SAMPLE_PERCENT:-2}}
      SEAGULL_INGEST_STORM_WARM_SAMPLE_PERCENT: ${SEAGULL_INGEST_STORM_WARM_SAMPLE_PERCENT:-${NETWATCH_INGEST_STORM_WARM_SAMPLE_PERCENT:-5}}
      SEAGULL_INGEST_STORM_ALERT_TTL_SECONDS: ${SEAGULL_INGEST_STORM_ALERT_TTL_SECONDS:-${NETWATCH_INGEST_STORM_ALERT_TTL_SECONDS:-3600}}
      SEAGULL_INGEST_ELEVATED_HOT_SAMPLE_PERCENT: ${SEAGULL_INGEST_ELEVATED_HOT_SAMPLE_PERCENT:-${NETWATCH_INGEST_ELEVATED_HOT_SAMPLE_PERCENT:-50}}
      SEAGULL_INGEST_DEGRADED_HOT_SAMPLE_PERCENT: ${SEAGULL_INGEST_DEGRADED_HOT_SAMPLE_PERCENT:-${NETWATCH_INGEST_DEGRADED_HOT_SAMPLE_PERCENT:-5}}
      SEAGULL_INGEST_CRITICAL_HOT_SAMPLE_PERCENT: ${SEAGULL_INGEST_CRITICAL_HOT_SAMPLE_PERCENT:-${NETWATCH_INGEST_CRITICAL_HOT_SAMPLE_PERCENT:-1}}
      SEAGULL_INGEST_CLICKHOUSE_SAMPLE_PERCENT: ${SEAGULL_INGEST_CLICKHOUSE_SAMPLE_PERCENT:-${NETWATCH_INGEST_CLICKHOUSE_SAMPLE_PERCENT:-100}}
      SEAGULL_INGEST_DEGRADED_CLICKHOUSE_SAMPLE_PERCENT: ${SEAGULL_INGEST_DEGRADED_CLICKHOUSE_SAMPLE_PERCENT:-${NETWATCH_INGEST_DEGRADED_CLICKHOUSE_SAMPLE_PERCENT:-25}}
      SEAGULL_INGEST_CRITICAL_CLICKHOUSE_SAMPLE_PERCENT: ${SEAGULL_INGEST_CRITICAL_CLICKHOUSE_SAMPLE_PERCENT:-${NETWATCH_INGEST_CRITICAL_CLICKHOUSE_SAMPLE_PERCENT:-10}}
      SEAGULL_INGEST_MIN_HOT_EVENTS_PER_BATCH: ${SEAGULL_INGEST_MIN_HOT_EVENTS_PER_BATCH:-${NETWATCH_INGEST_MIN_HOT_EVENTS_PER_BATCH:-1}}
      SEAGULL_INGEST_MIN_CLICKHOUSE_EVENTS_PER_BATCH: ${SEAGULL_INGEST_MIN_CLICKHOUSE_EVENTS_PER_BATCH:-${NETWATCH_INGEST_MIN_CLICKHOUSE_EVENTS_PER_BATCH:-32}}
      SEAGULL_INGEST_RECENT_FEED_MAX_EVENTS: ${SEAGULL_INGEST_RECENT_FEED_MAX_EVENTS:-${NETWATCH_INGEST_RECENT_FEED_MAX_EVENTS:-5000}}
      SEAGULL_INGEST_RECENT_FEED_PER_AGENT_MAX_EVENTS: ${SEAGULL_INGEST_RECENT_FEED_PER_AGENT_MAX_EVENTS:-${NETWATCH_INGEST_RECENT_FEED_PER_AGENT_MAX_EVENTS:-1000}}
      SEAGULL_INGEST_RECENT_FEED_MIN_BATCH: ${SEAGULL_INGEST_RECENT_FEED_MIN_BATCH:-${NETWATCH_INGEST_RECENT_FEED_MIN_BATCH:-24}}
      SEAGULL_INGEST_RECENT_FEED_LOOKBACK_SECONDS: ${SEAGULL_INGEST_RECENT_FEED_LOOKBACK_SECONDS:-${NETWATCH_INGEST_RECENT_FEED_LOOKBACK_SECONDS:-900}}
      SEAGULL_INGEST_RECENT_FEED_MAX_PUSH_PER_CALL: ${SEAGULL_INGEST_RECENT_FEED_MAX_PUSH_PER_CALL:-${NETWATCH_INGEST_RECENT_FEED_MAX_PUSH_PER_CALL:-512}}

      SEAGULL_ENV: ${SEAGULL_ENV:-${NETWATCH_ENV:-dev}}
      SEAGULL_JWT_SECRET: ${SEAGULL_JWT_SECRET:-${NETWATCH_JWT_SECRET:-}}
      SEAGULL_JWT_SECRET_FILE: ${SEAGULL_JWT_SECRET_FILE:-${NETWATCH_JWT_SECRET_FILE:-}}
      SEAGULL_TOKEN_PEPPER: ${SEAGULL_TOKEN_PEPPER:-${NETWATCH_TOKEN_PEPPER:-}}
      SEAGULL_ACCESS_TOKEN_TTL_SECONDS: ${SEAGULL_ACCESS_TOKEN_TTL_SECONDS:-${NETWATCH_ACCESS_TOKEN_TTL_SECONDS:-600}}
      SEAGULL_REFRESH_TOKEN_TTL_SECONDS: ${SEAGULL_REFRESH_TOKEN_TTL_SECONDS:-${NETWATCH_REFRESH_TOKEN_TTL_SECONDS:-604800}}
      SEAGULL_OTP_TOKEN_TTL_SECONDS: ${SEAGULL_OTP_TOKEN_TTL_SECONDS:-${NETWATCH_OTP_TOKEN_TTL_SECONDS:-900}}
      SEAGULL_COOKIE_SECURE: ${SEAGULL_COOKIE_SECURE:-${NETWATCH_COOKIE_SECURE:-false}}
      SEAGULL_COOKIE_SAMESITE: ${SEAGULL_COOKIE_SAMESITE:-${NETWATCH_COOKIE_SAMESITE:-lax}}
      SEAGULL_COOKIE_DOMAIN: ${SEAGULL_COOKIE_DOMAIN:-${NETWATCH_COOKIE_DOMAIN:-}}
      SEAGULL_ENABLE_HSTS: ${SEAGULL_ENABLE_HSTS:-${NETWATCH_ENABLE_HSTS:-false}}
      SEAGULL_TRUST_PROXY_HEADERS: ${SEAGULL_TRUST_PROXY_HEADERS:-${NETWATCH_TRUST_PROXY_HEADERS:-false}}
      SEAGULL_TRUSTED_PROXY_CIDRS: ${SEAGULL_TRUSTED_PROXY_CIDRS:-${NETWATCH_TRUSTED_PROXY_CIDRS:-127.0.0.1,::1}}
      SEAGULL_AUDIT_HASH_PEPPER: ${SEAGULL_AUDIT_HASH_PEPPER:-${NETWATCH_AUDIT_HASH_PEPPER:-}}
      SEAGULL_AUDIT_HASH_PEPPER_FILE: ${SEAGULL_AUDIT_HASH_PEPPER_FILE:-${NETWATCH_AUDIT_HASH_PEPPER_FILE:-}}
      SEAGULL_AUDIT_RETENTION_ENABLED: ${SEAGULL_AUDIT_RETENTION_ENABLED:-${NETWATCH_AUDIT_RETENTION_ENABLED:-true}}
      SEAGULL_AUDIT_RETENTION_DAYS: ${SEAGULL_AUDIT_RETENTION_DAYS:-${NETWATCH_AUDIT_RETENTION_DAYS:-30}}
      SEAGULL_LOGIN_AUDIT_RETENTION_DAYS: ${SEAGULL_LOGIN_AUDIT_RETENTION_DAYS:-${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS:-30}}
      SEAGULL_GOVERNANCE_RETENTION_DAYS: ${SEAGULL_GOVERNANCE_RETENTION_DAYS:-${NETWATCH_GOVERNANCE_RETENTION_DAYS:-30}}
      SEAGULL_AUDIT_RETENTION_EVERY_SECONDS: ${SEAGULL_AUDIT_RETENTION_EVERY_SECONDS:-${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}}
      SEAGULL_AUDIT_RETENTION_DELETE_BATCH: ${SEAGULL_AUDIT_RETENTION_DELETE_BATCH:-${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}}
      SEAGULL_SEARCH_BACKEND: ${SEAGULL_SEARCH_BACKEND:-${NETWATCH_SEARCH_BACKEND:-auto}}
      SEAGULL_ES_URL: ${SEAGULL_ES_URL:-${NETWATCH_ES_URL:-http://elasticsearch:9200}}
      SEAGULL_ES_INDEX_PREFIX: ${SEAGULL_ES_INDEX_PREFIX:-${NETWATCH_ES_INDEX_PREFIX:-seagull-events}}
      SEAGULL_INGEST_WARM_INDEX_PREFIX: ${SEAGULL_INGEST_WARM_INDEX_PREFIX:-${NETWATCH_INGEST_WARM_INDEX_PREFIX:-seagull-events-warm}}
      SEAGULL_INGEST_WARM_ILM_ENABLED: ${SEAGULL_INGEST_WARM_ILM_ENABLED:-${NETWATCH_INGEST_WARM_ILM_ENABLED:-true}}
      SEAGULL_INGEST_WARM_ILM_POLICY: ${SEAGULL_INGEST_WARM_ILM_POLICY:-${NETWATCH_INGEST_WARM_ILM_POLICY:-seagull-warm-delete-30d}}
      SEAGULL_INGEST_WARM_ILM_DELETE_AFTER_DAYS: ${SEAGULL_INGEST_WARM_ILM_DELETE_AFTER_DAYS:-${NETWATCH_INGEST_WARM_ILM_DELETE_AFTER_DAYS:-30}}
      SEAGULL_ES_REQUEST_TIMEOUT_SECONDS: ${SEAGULL_ES_REQUEST_TIMEOUT_SECONDS:-${NETWATCH_ES_REQUEST_TIMEOUT_SECONDS:-30}}
      SEAGULL_ES_USERNAME: ${SEAGULL_ES_USERNAME:-${NETWATCH_ES_USERNAME:-}}
      SEAGULL_ES_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:-}}
      SEAGULL_ES_PASSWORD_FILE: ${SEAGULL_ES_PASSWORD_FILE:-${NETWATCH_ES_PASSWORD_FILE:-}}
      SEAGULL_ES_VERIFY_CERTS: ${SEAGULL_ES_VERIFY_CERTS:-${NETWATCH_ES_VERIFY_CERTS:-true}}
      SEAGULL_ES_CA_CERTS: ${SEAGULL_ES_CA_CERTS:-${NETWATCH_ES_CA_CERTS:-}}
      SEAGULL_ES_PING_TTL_SECONDS: ${SEAGULL_ES_PING_TTL_SECONDS:-${NETWATCH_ES_PING_TTL_SECONDS:-2}}
      SEAGULL_CLICKHOUSE_ENABLED: ${SEAGULL_CLICKHOUSE_ENABLED:-${NETWATCH_CLICKHOUSE_ENABLED:-true}}
      SEAGULL_CLICKHOUSE_REQUIRED: ${SEAGULL_CLICKHOUSE_REQUIRED:-${NETWATCH_CLICKHOUSE_REQUIRED:-true}}
      SEAGULL_CLICKHOUSE_HOST: ${SEAGULL_CLICKHOUSE_HOST:-${NETWATCH_CLICKHOUSE_HOST:-clickhouse}}
      SEAGULL_CLICKHOUSE_PORT: ${SEAGULL_CLICKHOUSE_PORT:-${NETWATCH_CLICKHOUSE_PORT:-8123}}
