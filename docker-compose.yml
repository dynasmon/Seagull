services:
  netwatch-backend:
    build: ./backend
    container_name: netwatch-backend
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      - NETWATCH_DB_URL=postgresql+psycopg2://netwatch:netwatch123@postgres:5432/netwatch
    networks:
      - netwatch_internal
    volumes:
      - ./rules:/app/rules:ro
    restart: unless-stopped

  netwatch-agent-scan:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: netwatch-agent-scan
    network_mode: host

    # Packet capture needs privileges
    user: "0:0"
    cap_add:
      - NET_RAW
      - NET_ADMIN

    environment:
      - NETWATCH_AGENT_ID=agent-scan-1
      - NETWATCH_API_URL=http://127.0.0.1:8000
      - NETWATCH_SOURCES=scan
      - NETWATCH_POLL_INTERVAL=500ms

      # PCAP
      - NETWATCH_PCAP_IFACE=any
      - NETWATCH_SCAN_DEDUP_TTL=1s
      - NETWATCH_SCAN_MAX_BATCH=2000

      - NETWATCH_SCAN_MODE=summary
      - NETWATCH_LOG_LEVEL=info
      - NETWATCH_LOG_SUMMARY_EVERY=60s
      - NETWATCH_LOG_HEARTBEAT_EVERY=5m
      - NETWATCH_LOG_MIN_EVENTS=200

      # Noise control (keep consistent with your proc agent)
      - NETWATCH_SKIP_LOOPBACK=true
      - NETWATCH_SKIP_LINK_LOCAL=true
      - NETWATCH_DENY_CIDRS=172.24.0.0/16,172.17.0.0/16,172.18.0.0/16
      - NETWATCH_DENY_DST_PORTS=8000,3000,5432,6379

    depends_on:
      - netwatch-backend
    restart: unless-stopped

  netwatch-agent-proc:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: netwatch-agent-proc
    network_mode: host

    # Required to read /var/log/auth.log on most distros
    user: "0:0"

    environment:
      - NETWATCH_AGENT_ID=agent-proc-1
      - NETWATCH_API_URL=http://127.0.0.1:8000

      # Enable sources (keep MODE for backward compatibility if your code still reads it)
      - NETWATCH_SOURCES=proc,authlog
      - NETWATCH_AGENT_MODE=proc

      # Proc paths
      - NETWATCH_PROC_TCP4_PATH=/proc/net/tcp
      - NETWATCH_PROC_TCP6_PATH=/proc/net/tcp6

      # Auth log path
      - NETWATCH_AUTHLOG_PATH=/var/log/auth.log

      # Reduce noise
      - NETWATCH_ESTABLISHED_TTL=30m
      - NETWATCH_DEDUP_TTL=30s
      - NETWATCH_SKIP_LOOPBACK=true
      - NETWATCH_SKIP_LINK_LOCAL=true
      - NETWATCH_SKIP_PRIVATE_TO_PRIVATE=false
      # Drop internal stack/docker chatter (adjust to your docker subnets)
      - NETWATCH_DENY_CIDRS=172.24.0.0/16,172.17.0.0/16,172.18.0.0/16
      - NETWATCH_DENY_DST_PORTS=3000,8000,5432,6379

    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro

    depends_on:
      - netwatch-backend
    restart: unless-stopped

  netwatch-rules-worker:
    build: ./backend
    container_name: netwatch-rules-worker
    depends_on:
      - postgres
    environment:
      - NETWATCH_DB_URL=postgresql+psycopg2://netwatch:netwatch123@postgres:5432/netwatch
    networks:
      - netwatch_internal
    volumes:
      - ./rules:/app/rules:ro
    command: >
      sh -c "while true; do
               echo '[RULES] Running detection cycle...';
               python -m app.workers;
               sleep 60;
             done"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: netwatch-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - netwatch_internal
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: netwatch-postgres
    environment:
      - POSTGRES_DB=netwatch
      - POSTGRES_USER=netwatch
      - POSTGRES_PASSWORD=netwatch123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - netwatch_internal
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: netwatch-grafana
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - netwatch_internal
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped

networks:
  netwatch_internal:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
