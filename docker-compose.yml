      SEAGULL_BOOTSTRAP_ROTATOR_OUTPUT_DIR: ${SEAGULL_BOOTSTRAP_ROTATOR_OUTPUT_DIR:-${NETWATCH_BOOTSTRAP_ROTATOR_OUTPUT_DIR:-/etc/seagull/bootstrap}}
      SEAGULL_BOOTSTRAP_ROTATOR_STATE_DIR: ${SEAGULL_BOOTSTRAP_ROTATOR_STATE_DIR:-${NETWATCH_BOOTSTRAP_ROTATOR_STATE_DIR:-/var/lib/seagull/bootstrap-rotator}}
    command: ["python", "-m", "app.workers.manager", "maintenance"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: "0.30"
    networks:
      - seagull
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.manager", "health", "maintenance"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

