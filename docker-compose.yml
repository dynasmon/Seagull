x-agent-env: &agent-env
  NETWATCH_API_URL: https://localhost:${NETWATCH_EDGE_HTTPS_PORT:-8443}/agent
  NETWATCH_HTTP_TIMEOUT: ${NETWATCH_HTTP_TIMEOUT}
  NETWATCH_CONTROL_HEARTBEAT_EVERY: ${NETWATCH_CONTROL_HEARTBEAT_EVERY}
  NETWATCH_CONTROL_CONFIG_EVERY: ${NETWATCH_CONTROL_CONFIG_EVERY}
  NETWATCH_PCAP_IFACE: ${NETWATCH_PCAP_IFACE}
  NETWATCH_SKIP_LOOPBACK: ${NETWATCH_SKIP_LOOPBACK}
  NETWATCH_SKIP_LINK_LOCAL: ${NETWATCH_SKIP_LINK_LOCAL}
  NETWATCH_DENY_CIDRS: ${NETWATCH_DENY_CIDRS}
  NETWATCH_DENY_DST_PORTS: ${NETWATCH_DENY_DST_PORTS}
  # Syscollector defaults (can be overridden by control-plane config)
  NETWATCH_AGENT_CONFIG_FILE: ${NETWATCH_AGENT_CONFIG_FILE}
  NETWATCH_SYSCOLLECT_EVERY: ${NETWATCH_SYSCOLLECT_EVERY}
  NETWATCH_SYSCOLLECT_CMD_TIMEOUT: ${NETWATCH_SYSCOLLECT_CMD_TIMEOUT}
  NETWATCH_SYSCOLLECT_MAX_OUTPUT_BYTES: ${NETWATCH_SYSCOLLECT_MAX_OUTPUT_BYTES}
  NETWATCH_SYSCOLLECT_MAX_PACKAGES: ${NETWATCH_SYSCOLLECT_MAX_PACKAGES}
  NETWATCH_AUTHLOG_DEDUP_TTL: ${NETWATCH_AUTHLOG_DEDUP_TTL}
  NETWATCH_AUTHLOG_INCLUDE_ACCEPTED: ${NETWATCH_AUTHLOG_INCLUDE_ACCEPTED}
  NETWATCH_AGENT_BOOTSTRAP_TOKEN: ${NETWATCH_AGENT_BOOTSTRAP_TOKEN:-}
  NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: ${NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE:-}
  NETWATCH_FORCE_ENROLL_ON_START: ${NETWATCH_FORCE_ENROLL_ON_START:-true}
  NETWATCH_TLS_CA_FILE: /etc/netwatch/agent-mtls/server-ca.crt
  NETWATCH_TLS_CERT_FILE: /etc/netwatch/agent-mtls/tls.crt
  NETWATCH_TLS_KEY_FILE: /etc/netwatch/agent-mtls/tls.key
  NETWATCH_TLS_SERVER_NAME: ${NETWATCH_AGENT_TLS_SERVER_NAME:-localhost}

x-agent-base: &agent-base
  build:
    context: ./agent
    dockerfile: Dockerfile
  network_mode: host
  user: "0:0"
  cap_add:
    - NET_RAW
    - NET_ADMIN
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: netwatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - netwatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  netwatch-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netwatch-portal
    depends_on:
      netwatch-backend:
        condition: service_healthy
    environment: {}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "0.50"
    networks:
      - netwatch
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: netwatch-redis
    command: >
      sh -ec '
      REDIS_PASSWORD="$${NETWATCH_REDIS_PASSWORD:-}";
      if [ -z "$$REDIS_PASSWORD" ] && [ -n "$${NETWATCH_REDIS_PASSWORD_FILE:-}" ]; then
        REDIS_PASSWORD="$$(cat "$${NETWATCH_REDIS_PASSWORD_FILE}")";
      fi;
      if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --appendonly yes --appendfsync everysec --save "" --requirepass "$$REDIS_PASSWORD";
      fi;
      exec redis-server --appendonly yes --appendfsync everysec --save "";
      '
    environment:
      NETWATCH_REDIS_PASSWORD: ${NETWATCH_REDIS_PASSWORD:-}
      NETWATCH_REDIS_PASSWORD_FILE: ${NETWATCH_REDIS_PASSWORD_FILE:-}
    volumes:
      - redis-data:/data
    networks:
      - netwatch
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDIS_PASSWORD=\"$${NETWATCH_REDIS_PASSWORD:-}\"; if [ -z \"$$REDIS_PASSWORD\" ] && [ -n \"$${NETWATCH_REDIS_PASSWORD_FILE:-}\" ]; then REDIS_PASSWORD=\"$$(cat \"$${NETWATCH_REDIS_PASSWORD_FILE}\")\"; fi; if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: netwatch-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    networks:
      - netwatch
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ES_PASSWORD=\"$${ELASTIC_PASSWORD:-}\"; if [ -z \"$$ES_PASSWORD\" ] && [ -n \"$${ELASTIC_PASSWORD_FILE:-}\" ]; then ES_PASSWORD=\"$$(cat \"$${ELASTIC_PASSWORD_FILE}\")\"; fi; if [ -n \"$$ES_PASSWORD\" ]; then curl -fsS -u \"elastic:$$ES_PASSWORD\" \"http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s\" >/dev/null; else curl -fsS \"http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s\" >/dev/null; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: netwatch-clickhouse
    environment:
      CLICKHOUSE_DB: ${NETWATCH_CLICKHOUSE_DATABASE:-netwatch}
      CLICKHOUSE_USER: ${NETWATCH_CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${NETWATCH_CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    networks:
      - netwatch
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q 'Ok.'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: netwatch-kibana
    profiles: ["extra"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${NETWATCH_ES_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${NETWATCH_ES_PASSWORD:-}
      ELASTICSEARCH_PASSWORD_FILE: ${NETWATCH_ES_PASSWORD_FILE:-}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-backend:
    build: ./backend
    container_name: netwatch-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${NETWATCH_UVICORN_WORKERS:-2}", "--no-access-log"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${NETWATCH_BACKEND_PORT}:8000"
    environment:
      NETWATCH_DB_HOST: postgres
      NETWATCH_DB_PORT: 5432
      NETWATCH_DB_NAME: ${POSTGRES_DB}
      NETWATCH_DB_USER: ${POSTGRES_USER}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      NETWATCH_DB_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      NETWATCH_REDIS_PASSWORD: ${NETWATCH_REDIS_PASSWORD:-}
      NETWATCH_REDIS_PASSWORD_FILE: ${NETWATCH_REDIS_PASSWORD_FILE:-}
      NETWATCH_MAX_EVENT_CLOCK_SKEW_SECONDS: ${NETWATCH_MAX_EVENT_CLOCK_SKEW_SECONDS}
      # Ingest storm control (protect Postgres under volumetric attacks)
      NETWATCH_INGEST_MAX_BATCH: ${NETWATCH_INGEST_MAX_BATCH:-10000}
      NETWATCH_INGEST_STORM_EVENTS_PER_SECOND: ${NETWATCH_INGEST_STORM_EVENTS_PER_SECOND:-8000}
      NETWATCH_INGEST_STORM_MIN_BATCH: ${NETWATCH_INGEST_STORM_MIN_BATCH:-2500}
      NETWATCH_INGEST_STORM_TTL_SECONDS: ${NETWATCH_INGEST_STORM_TTL_SECONDS:-20}
      NETWATCH_INGEST_STORM_SAMPLE_PERCENT: ${NETWATCH_INGEST_STORM_SAMPLE_PERCENT:-2}
      NETWATCH_INGEST_ROLLUP_ALWAYS: ${NETWATCH_INGEST_ROLLUP_ALWAYS:-false}
      NETWATCH_INGEST_VALUES_PAGE_SIZE: ${NETWATCH_INGEST_VALUES_PAGE_SIZE:-1000}
      NETWATCH_INGEST_ROLLUP_PAGE_SIZE: ${NETWATCH_INGEST_ROLLUP_PAGE_SIZE:-500}
      # Backpressure (Redis queue)
      NETWATCH_INGEST_QUEUE_KEY: ${NETWATCH_INGEST_QUEUE_KEY:-netwatch:ingest:queue}
      NETWATCH_INGEST_WORKER_BATCH_MESSAGES: ${NETWATCH_INGEST_WORKER_BATCH_MESSAGES:-50}
      NETWATCH_INGEST_WORKER_IDLE_SLEEP_SECONDS: ${NETWATCH_INGEST_WORKER_IDLE_SLEEP_SECONDS:-0.25}
      NETWATCH_INGEST_BACKPRESSURE_SOFT_BACKLOG_EVENTS: ${NETWATCH_INGEST_BACKPRESSURE_SOFT_BACKLOG_EVENTS:-50000}
      NETWATCH_INGEST_BACKPRESSURE_HARD_BACKLOG_EVENTS: ${NETWATCH_INGEST_BACKPRESSURE_HARD_BACKLOG_EVENTS:-200000}
      NETWATCH_INGEST_BACKPRESSURE_MODE: ${NETWATCH_INGEST_BACKPRESSURE_MODE:-rollup_only}
      NETWATCH_INGEST_BACKPRESSURE_WARM_SAMPLE_PERCENT: ${NETWATCH_INGEST_BACKPRESSURE_WARM_SAMPLE_PERCENT:-2}

      # Hot/Warm sampling
      NETWATCH_INGEST_WARM_ENABLED: ${NETWATCH_INGEST_WARM_ENABLED:-true}
      NETWATCH_INGEST_WARM_SAMPLE_PERCENT: ${NETWATCH_INGEST_WARM_SAMPLE_PERCENT:-0}
      NETWATCH_INGEST_STORM_HOT_SAMPLE_PERCENT: ${NETWATCH_INGEST_STORM_HOT_SAMPLE_PERCENT:-2}
      NETWATCH_INGEST_STORM_WARM_SAMPLE_PERCENT: ${NETWATCH_INGEST_STORM_WARM_SAMPLE_PERCENT:-5}
      NETWATCH_INGEST_STORM_ALERT_TTL_SECONDS: ${NETWATCH_INGEST_STORM_ALERT_TTL_SECONDS:-3600}

      NETWATCH_ENV: ${NETWATCH_ENV:-dev}
      NETWATCH_JWT_SECRET: ${NETWATCH_JWT_SECRET:-}
      NETWATCH_JWT_SECRET_FILE: ${NETWATCH_JWT_SECRET_FILE:-}
      NETWATCH_TOKEN_PEPPER: ${NETWATCH_TOKEN_PEPPER:-}
      NETWATCH_ACCESS_TOKEN_TTL_SECONDS: ${NETWATCH_ACCESS_TOKEN_TTL_SECONDS:-600}
      NETWATCH_REFRESH_TOKEN_TTL_SECONDS: ${NETWATCH_REFRESH_TOKEN_TTL_SECONDS:-604800}
      NETWATCH_OTP_TOKEN_TTL_SECONDS: ${NETWATCH_OTP_TOKEN_TTL_SECONDS:-900}
      NETWATCH_COOKIE_SECURE: ${NETWATCH_COOKIE_SECURE:-false}
      NETWATCH_COOKIE_SAMESITE: ${NETWATCH_COOKIE_SAMESITE:-lax}
      NETWATCH_COOKIE_DOMAIN: ${NETWATCH_COOKIE_DOMAIN:-}
      NETWATCH_ENABLE_HSTS: ${NETWATCH_ENABLE_HSTS:-false}
      NETWATCH_TRUST_PROXY_HEADERS: ${NETWATCH_TRUST_PROXY_HEADERS:-false}
      NETWATCH_TRUSTED_PROXY_CIDRS: ${NETWATCH_TRUSTED_PROXY_CIDRS:-127.0.0.1,::1}
      NETWATCH_AUDIT_HASH_PEPPER: ${NETWATCH_AUDIT_HASH_PEPPER:-}
      NETWATCH_AUDIT_HASH_PEPPER_FILE: ${NETWATCH_AUDIT_HASH_PEPPER_FILE:-}
      NETWATCH_AUDIT_RETENTION_ENABLED: ${NETWATCH_AUDIT_RETENTION_ENABLED:-true}
      NETWATCH_AUDIT_RETENTION_DAYS: ${NETWATCH_AUDIT_RETENTION_DAYS:-30}
      NETWATCH_LOGIN_AUDIT_RETENTION_DAYS: ${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS:-30}
      NETWATCH_GOVERNANCE_RETENTION_DAYS: ${NETWATCH_GOVERNANCE_RETENTION_DAYS:-30}
      NETWATCH_AUDIT_RETENTION_EVERY_SECONDS: ${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}
      NETWATCH_AUDIT_RETENTION_DELETE_BATCH: ${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}
      NETWATCH_SEARCH_BACKEND: ${NETWATCH_SEARCH_BACKEND:-auto}
      NETWATCH_ES_URL: ${NETWATCH_ES_URL:-http://elasticsearch:9200}
      NETWATCH_ES_INDEX_PREFIX: ${NETWATCH_ES_INDEX_PREFIX:-netwatch-events}
      NETWATCH_INGEST_WARM_INDEX_PREFIX: ${NETWATCH_INGEST_WARM_INDEX_PREFIX:-netwatch-events-warm}
      NETWATCH_INGEST_WARM_ILM_ENABLED: ${NETWATCH_INGEST_WARM_ILM_ENABLED:-true}
      NETWATCH_INGEST_WARM_ILM_POLICY: ${NETWATCH_INGEST_WARM_ILM_POLICY:-netwatch-warm-delete-30d}
      NETWATCH_INGEST_WARM_ILM_DELETE_AFTER_DAYS: ${NETWATCH_INGEST_WARM_ILM_DELETE_AFTER_DAYS:-30}
      NETWATCH_ES_REQUEST_TIMEOUT_SECONDS: ${NETWATCH_ES_REQUEST_TIMEOUT_SECONDS:-30}
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-}
      NETWATCH_ES_PASSWORD: ${NETWATCH_ES_PASSWORD:-}
      NETWATCH_ES_PASSWORD_FILE: ${NETWATCH_ES_PASSWORD_FILE:-}
      NETWATCH_ES_VERIFY_CERTS: ${NETWATCH_ES_VERIFY_CERTS:-true}
      NETWATCH_ES_CA_CERTS: ${NETWATCH_ES_CA_CERTS:-}
      NETWATCH_ES_PING_TTL_SECONDS: ${NETWATCH_ES_PING_TTL_SECONDS:-2}
      NETWATCH_CLICKHOUSE_ENABLED: ${NETWATCH_CLICKHOUSE_ENABLED:-false}
      NETWATCH_CLICKHOUSE_REQUIRED: ${NETWATCH_CLICKHOUSE_REQUIRED:-false}
      NETWATCH_CLICKHOUSE_HOST: ${NETWATCH_CLICKHOUSE_HOST:-clickhouse}
      NETWATCH_CLICKHOUSE_PORT: ${NETWATCH_CLICKHOUSE_PORT:-8123}
      NETWATCH_CLICKHOUSE_DATABASE: ${NETWATCH_CLICKHOUSE_DATABASE:-netwatch}
      NETWATCH_CLICKHOUSE_USERNAME: ${NETWATCH_CLICKHOUSE_USERNAME:-default}
      NETWATCH_CLICKHOUSE_PASSWORD: ${NETWATCH_CLICKHOUSE_PASSWORD:-}
      NETWATCH_CLICKHOUSE_SECURE: ${NETWATCH_CLICKHOUSE_SECURE:-false}
      NETWATCH_CLICKHOUSE_VERIFY: ${NETWATCH_CLICKHOUSE_VERIFY:-true}
      NETWATCH_CLICKHOUSE_CONNECT_TIMEOUT_SECONDS: ${NETWATCH_CLICKHOUSE_CONNECT_TIMEOUT_SECONDS:-2}
      NETWATCH_CLICKHOUSE_SEND_RECEIVE_TIMEOUT_SECONDS: ${NETWATCH_CLICKHOUSE_SEND_RECEIVE_TIMEOUT_SECONDS:-5}
      NETWATCH_CLICKHOUSE_PING_TTL_SECONDS: ${NETWATCH_CLICKHOUSE_PING_TTL_SECONDS:-2}
      NETWATCH_CLICKHOUSE_EVENTS_TABLE: ${NETWATCH_CLICKHOUSE_EVENTS_TABLE:-net_events_raw}
      NETWATCH_CLICKHOUSE_EVENTS_RETENTION_DAYS: ${NETWATCH_CLICKHOUSE_EVENTS_RETENTION_DAYS:-30}
      NETWATCH_BOOTSTRAP_ADMIN_USERNAME: ${NETWATCH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD: ${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD:-}
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD_FILE: ${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD_FILE:-}
      NETWATCH_BOOTSTRAP_ADMIN_RESET_ON_START: ${NETWATCH_BOOTSTRAP_ADMIN_RESET_ON_START:-true}
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_TTL_SECONDS: ${NETWATCH_AGENT_BOOTSTRAP_TOKEN_TTL_SECONDS:-900}
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_MAX_USES: ${NETWATCH_AGENT_BOOTSTRAP_TOKEN_MAX_USES:-1}
      NETWATCH_RULES_ENV: ${NETWATCH_RULES_ENV:-${NETWATCH_ENV:-dev}}
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network,lab}
      NETWATCH_RULES_DISABLED_PACKS: ${NETWATCH_RULES_DISABLED_PACKS:-}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-true}
      NETWATCH_DEFAULT_AGENT_CONFIG_JSON: ${NETWATCH_DEFAULT_AGENT_CONFIG_JSON}
      NETWATCH_MAX_AGENT_CONFIG_BYTES: ${NETWATCH_MAX_AGENT_CONFIG_BYTES}

      # Vulnerability ingest hardening
      NETWATCH_VULN_MAX_FINDINGS_PER_INGEST: ${NETWATCH_VULN_MAX_FINDINGS_PER_INGEST:-2000}
      NETWATCH_VULN_MAX_EVIDENCE_BYTES: ${NETWATCH_VULN_MAX_EVIDENCE_BYTES:-32768}
      NETWATCH_VULN_AUTO_REOPEN: ${NETWATCH_VULN_AUTO_REOPEN:-true}
    volumes:
      - ./rules:/app/rules:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024m
    cpus: "1.00"
    networks:
      - netwatch
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys,urllib.request; u=urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2); sys.exit(0 if u.getcode()==200 else 1)\"",
        ]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 25s
    restart: unless-stopped

  netwatch-ingest-worker:
    build: ./backend
    container_name: netwatch-ingest-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      NETWATCH_DB_HOST: postgres
      NETWATCH_DB_PORT: 5432
      NETWATCH_DB_NAME: ${POSTGRES_DB}
      NETWATCH_DB_USER: ${POSTGRES_USER}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      NETWATCH_DB_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      NETWATCH_REDIS_PASSWORD: ${NETWATCH_REDIS_PASSWORD:-}
      NETWATCH_REDIS_PASSWORD_FILE: ${NETWATCH_REDIS_PASSWORD_FILE:-}
      NETWATCH_ES_URL: ${NETWATCH_ES_URL:-http://elasticsearch:9200}
      NETWATCH_ES_INDEX_PREFIX: ${NETWATCH_ES_INDEX_PREFIX:-netwatch-events}
      NETWATCH_INGEST_WARM_INDEX_PREFIX: ${NETWATCH_INGEST_WARM_INDEX_PREFIX:-netwatch-events-warm}
      NETWATCH_INGEST_WARM_ILM_ENABLED: ${NETWATCH_INGEST_WARM_ILM_ENABLED:-true}
      NETWATCH_INGEST_WARM_ILM_POLICY: ${NETWATCH_INGEST_WARM_ILM_POLICY:-netwatch-warm-delete-30d}
      NETWATCH_INGEST_WARM_ILM_DELETE_AFTER_DAYS: ${NETWATCH_INGEST_WARM_ILM_DELETE_AFTER_DAYS:-30}
      NETWATCH_ES_REQUEST_TIMEOUT_SECONDS: ${NETWATCH_ES_REQUEST_TIMEOUT_SECONDS:-30}
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-}
      NETWATCH_ES_PASSWORD: ${NETWATCH_ES_PASSWORD:-}
      NETWATCH_ES_PASSWORD_FILE: ${NETWATCH_ES_PASSWORD_FILE:-}
      NETWATCH_ES_VERIFY_CERTS: ${NETWATCH_ES_VERIFY_CERTS:-true}
      NETWATCH_ES_CA_CERTS: ${NETWATCH_ES_CA_CERTS:-}
      NETWATCH_CLICKHOUSE_ENABLED: ${NETWATCH_CLICKHOUSE_ENABLED:-false}
      NETWATCH_CLICKHOUSE_HOST: ${NETWATCH_CLICKHOUSE_HOST:-clickhouse}
      NETWATCH_CLICKHOUSE_PORT: ${NETWATCH_CLICKHOUSE_PORT:-8123}
      NETWATCH_CLICKHOUSE_DATABASE: ${NETWATCH_CLICKHOUSE_DATABASE:-netwatch}
      NETWATCH_CLICKHOUSE_USERNAME: ${NETWATCH_CLICKHOUSE_USERNAME:-default}
      NETWATCH_CLICKHOUSE_PASSWORD: ${NETWATCH_CLICKHOUSE_PASSWORD:-}
      NETWATCH_CLICKHOUSE_SECURE: ${NETWATCH_CLICKHOUSE_SECURE:-false}
      NETWATCH_CLICKHOUSE_VERIFY: ${NETWATCH_CLICKHOUSE_VERIFY:-true}
      NETWATCH_CLICKHOUSE_CONNECT_TIMEOUT_SECONDS: ${NETWATCH_CLICKHOUSE_CONNECT_TIMEOUT_SECONDS:-2}
      NETWATCH_CLICKHOUSE_SEND_RECEIVE_TIMEOUT_SECONDS: ${NETWATCH_CLICKHOUSE_SEND_RECEIVE_TIMEOUT_SECONDS:-5}
      NETWATCH_CLICKHOUSE_PING_TTL_SECONDS: ${NETWATCH_CLICKHOUSE_PING_TTL_SECONDS:-2}
      NETWATCH_CLICKHOUSE_EVENTS_TABLE: ${NETWATCH_CLICKHOUSE_EVENTS_TABLE:-net_events_raw}
      NETWATCH_CLICKHOUSE_EVENTS_RETENTION_DAYS: ${NETWATCH_CLICKHOUSE_EVENTS_RETENTION_DAYS:-30}
      NETWATCH_CLICKHOUSE_RECONNECT_SECONDS: ${NETWATCH_CLICKHOUSE_RECONNECT_SECONDS:-5}
      NETWATCH_INGEST_QUEUE_KEY: ${NETWATCH_INGEST_QUEUE_KEY:-netwatch:ingest:queue}
      NETWATCH_INGEST_PROCESSING_KEY: ${NETWATCH_INGEST_PROCESSING_KEY:-netwatch:ingest:queue:processing}
      NETWATCH_INGEST_WORKER_BATCH_MESSAGES: ${NETWATCH_INGEST_WORKER_BATCH_MESSAGES:-50}
      NETWATCH_INGEST_WORKER_IDLE_SLEEP_SECONDS: ${NETWATCH_INGEST_WORKER_IDLE_SLEEP_SECONDS:-0.25}
      NETWATCH_INGEST_VALUES_PAGE_SIZE: ${NETWATCH_INGEST_VALUES_PAGE_SIZE:-1000}
      NETWATCH_INGEST_ROLLUP_PAGE_SIZE: ${NETWATCH_INGEST_ROLLUP_PAGE_SIZE:-500}
      NETWATCH_INGEST_WARM_ENABLED: ${NETWATCH_INGEST_WARM_ENABLED:-true}
    command: ["python", "-m", "app.workers.ingest_worker"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: "0.75"
    networks:
      - netwatch
    restart: unless-stopped


  netwatch-rules-worker:
    build: ./backend
    container_name: netwatch-rules-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NETWATCH_DB_HOST: postgres
      NETWATCH_DB_PORT: 5432
      NETWATCH_DB_NAME: ${POSTGRES_DB}
      NETWATCH_DB_USER: ${POSTGRES_USER}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      NETWATCH_DB_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      NETWATCH_RULES_EVERY_SECONDS: ${NETWATCH_RULES_EVERY_SECONDS}
      NETWATCH_RULES_ENV: ${NETWATCH_RULES_ENV:-${NETWATCH_ENV:-dev}}
