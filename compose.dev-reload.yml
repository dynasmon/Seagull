services:
  seagull-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${SEAGULL_PORTAL_PORT:-127.0.0.1:8080}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          node -e "
          const http=require('node:http');
          const req=http.get('http://127.0.0.1:5173/',(res)=>process.exit((res.statusCode||500)<500?0:1));
          req.setTimeout(2000,()=>{req.destroy();process.exit(1);});
          req.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  caddy:
    environment:
      SEAGULL_PORTAL_INTERNAL_PORT: "5173"
