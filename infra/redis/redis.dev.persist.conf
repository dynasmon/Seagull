# Optional development Redis profile for persistence and recovery validation.

bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
dir /data
dbfilename dump.rdb

appendonly yes
appendfilename "appendonly.aof"
appenddirname appendonlydir
appendfsync everysec
aof-use-rdb-preamble yes
aof-rewrite-incremental-fsync yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes
