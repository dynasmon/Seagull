# Default development Redis profile.
# This mode is intentionally ephemeral to keep restart/down/up loops predictable.

bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
dir /tmp/redis

appendonly no
save ""
