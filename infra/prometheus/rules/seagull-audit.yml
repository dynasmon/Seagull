groups:
  - name: seagull-audit
    rules:
      - alert: AuditChainBroken
        expr: sum(audit_chain_broken_links) > 0
        for: 0m
        labels:
          severity: critical
          subsystem: audit
        annotations:
          summary: The audit chain no longer verifies
          description: >-
            Every admin action and login is linked to the one before it, and the
            verifier just recomputed a link that does not match what is stored.
            The reason label says which kind: event_hash_mismatch means a stored
            row was edited after it was written, prev_hash_mismatch means a row
            was removed or repointed, seq_gap means a numbered event is missing,
            and missing_predecessor means a pruned range lost the checkpoint that
            anchored it. Only the last one has an innocent cause. Do not clear
            this by rebuilding the chain: read audit_chain_broken in the verifier
            log, which names the sequence numbers and event ids involved.
      - alert: AuditChainVerifierSilent
        expr: absent(audit_chain_verified_events)
        for: 30m
        labels:
          severity: warning
          subsystem: audit
        annotations:
          summary: Nothing is verifying the audit chain
          description: >-
            The audit verifier has not reported for half an hour, so a broken
            link would not be noticed. Either the maintenance worker group is
            down, SEAGULL_AUDIT_VERIFY_ENABLED was turned off, or the pass is
            failing before it publishes. Tamper evidence that nobody checks is
            the state this alert exists to prevent.
      - alert: AuditChainVerifyFailing
        expr: sum(rate(audit_chain_verification_total{outcome="error"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
          subsystem: audit
        annotations:
          summary: The audit chain verifier keeps erroring out
          description: >-
            Verification passes are raising instead of reporting a verdict, so
            the chain is unchecked even though the worker is alive. This is
            usually the database being unreachable or the audit tables being
            unreadable by the worker role. Check audit_verifier_loop_error in the
            worker log for the exception.
