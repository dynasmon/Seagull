groups:
  - name: seagull-auth
    rules:
      - alert: RefreshTokenReuseDetected
        expr: sum(rate(auth_refresh_rotation_total{outcome="reuse_detected"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          subsystem: auth
        annotations:
          summary: A rotated refresh token was presented again
          description: >-
            Someone presented a refresh token that had already been rotated into
            a successor. Every rotation is single-use, so the legitimate client
            never holds that token again: either a token leaked and both the
            holder and the owner are using it, or a client is replaying a cookie
            it should have discarded. The whole session family was revoked and
            the user has to sign in again. Find the account in the audit trail
            under action auth.refresh with outcome failure, and check whether
            the requests came from the same address. This fires on a single
            occurrence because one reuse is already the signal.
      - alert: RefreshRotationsRacing
        expr: sum(rate(auth_refresh_rotation_total{outcome="lost_race"}[5m])) > 0.05
        for: 15m
        labels:
          severity: warning
          subsystem: auth
        annotations:
          summary: Refresh rotations keep losing the single-use claim
          description: >-
            Two requests are rotating the same refresh token at the same time.
            The loser is refused with 401 and mints nothing, so no session is
            duplicated, but the client behind it gets signed out for no reason.
            A steady rate means a caller is not serialising its refreshes: the
            portal coalesces them per tab, so this usually points at several
            tabs restoring at once, or at an integration that fires parallel
            requests with a shared cookie jar.
      - alert: RateLimiterWindowDegraded
        expr: sum(rate(rate_limit_decisions_total{backend!="redis"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          subsystem: auth
        annotations:
          summary: Rate limiting is no longer using the shared window
          description: >-
            Redis holds the window every API process counts into, and it has
            stopped answering, so the limiter fell back to whatever
            SEAGULL_RATE_LIMIT_DEGRADED_POLICY says. Under the local policy each
            process now enforces its own copy of every limit, which is why
            SEAGULL_RATE_LIMIT_LOCAL_PROCESSES has to match the process count;
            under deny the protected endpoints are refusing everyone. Look at
            the backend label to tell those apart, then fix Redis — nothing here
            recovers on its own beyond the retry cooldown.
      - alert: LoginRateLimitSustained
        expr: sum(rate(rate_limit_decisions_total{scope="login",outcome="limited"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
          subsystem: auth
        annotations:
          summary: Logins are being refused by the rate limiter
          description: >-
            The login limiter has been turning requests away for ten minutes.
            The per-address budget is 25 attempts in five minutes and the
            per-account budget is 12, so a single person mistyping a password
            never reaches this. Sustained refusals mean either credential
            stuffing against the portal or a client retrying a failed login in a
            loop. Check the audit trail for action auth.login with outcome
            failure and see whether the attempts share an address.
      - alert: OneTimeTokenLoginsRacing
        expr: sum(rate(auth_one_time_token_login_total{outcome="lost_race"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          subsystem: auth
        annotations:
          summary: One-time tokens are being redeemed more than once
          description: >-
            A one-time token was submitted twice close enough together that both
            requests read it as unused. Only one login was admitted and the
            other got 401, so the token stayed single-use. A double-submitting
            form is the ordinary cause; a sustained rate on distinct tokens is
            not, and means someone is replaying handed-out tokens. Cross-check
            the used_ip recorded on the tokens against where they were issued.
