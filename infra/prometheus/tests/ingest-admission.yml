rule_files:
  - ../rules/seagull-ingest.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: a healthy pipeline raises nothing
    input_series:
      - series: 'ingest_queue_depth{queue="deadletter"}'
        values: "0+0x60"
      - series: 'ingest_queue_depth{queue="pending"}'
        values: "120+0x60"
      - series: 'http_request_body_rejected_total{policy="ingest_events"}'
        values: "0+0x60"
      - series: 'ingest_event_fields_normalized_total{field="event_type"}'
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: IngestDeadLetterNotEmpty
        exp_alerts: []
      - eval_time: 60m
        alertname: IngestRequestBodiesRejected
        exp_alerts: []
      - eval_time: 60m
        alertname: IngestEventFieldsNormalized
        exp_alerts: []

  - interval: 1m
    name: a parked batch opens the dead letter alert
    input_series:
      - series: 'ingest_queue_depth{queue="deadletter"}'
        values: "0+0x9 3+0x60"
    alert_rule_test:
      - eval_time: 9m
        alertname: IngestDeadLetterNotEmpty
        exp_alerts: []
      - eval_time: 25m
        alertname: IngestDeadLetterNotEmpty
        exp_alerts:
          - exp_labels:
              severity: warning
              subsystem: ingest
            exp_annotations:
              summary: Ingest batches are parked in the dead letter list
              description: >-
                A batch reached SEAGULL_INGEST_WORKER_MAX_MESSAGE_RETRIES without
                committing, so the worker parked it instead of retrying forever. The
                events are accepted by the API and absent from the hot store until
                someone acts. Inspect the batches with GET /ingest/deadletter, which
                returns counts and ages but never the payloads, fix what made the
                transaction fail, then replay with POST /ingest/deadletter/redrive. The
                list holds the 200 most recent batches for seven days, so an unattended
                alert becomes data loss.

  - interval: 1m
    name: a pending backlog is not a dead letter backlog
    input_series:
      - series: 'ingest_queue_depth{queue="pending"}'
        values: "5000+0x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: IngestDeadLetterNotEmpty
        exp_alerts: []

  - interval: 1m
    name: a producer that keeps overflowing the body ceiling is named
    input_series:
      - series: 'http_request_body_rejected_total{policy="ingest_events"}'
        values: "0+6x60"
    alert_rule_test:
      - eval_time: 5m
        alertname: IngestRequestBodiesRejected
        exp_alerts: []
      - eval_time: 30m
        alertname: IngestRequestBodiesRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              subsystem: ingest
              policy: ingest_events
            exp_annotations:
              summary: Requests on the ingest_events limit are being rejected for size
              description: >-
                The backend counted more bytes than the ingest_events ceiling allows and
                answered 413 before reading the rest. A sustained rate means a producer
                keeps retrying a body it can never deliver, so its data never lands.
                Either the agent is batching beyond SEAGULL_INGEST_MAX_BATCH, or the
                ceilings are inconsistent: check that SEAGULL_EDGE_MAX_BODY and
                SEAGULL_EDGE_AGENT_MAX_BODY in Caddy are not more permissive than
                SEAGULL_MAX_REQUEST_BODY_BYTES and SEAGULL_INGEST_MAX_REQUEST_BODY_BYTES
                in the backend.

  - interval: 1m
    name: sustained field repair in the worker is reported per field
    input_series:
      - series: 'ingest_event_fields_normalized_total{field="event_type"}'
        values: "0+12x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: IngestEventFieldsNormalized
        exp_alerts: []
      - eval_time: 45m
        alertname: IngestEventFieldsNormalized
        exp_alerts:
          - exp_labels:
              severity: warning
              subsystem: ingest
              field: event_type
            exp_annotations:
              summary: The ingest worker keeps repairing the event_type field
              description: >-
                The API validates every event against the hot store columns before it
                answers durable, so events reaching the worker should already fit. A
                sustained repair rate means something is enqueuing events that did not
                pass that check: a batch queued before the contract was enforced, a
                redrive of an old dead letter batch, or a producer that bypasses POST
                /ingest/events. The events are stored with the field truncated or
                dropped, never rejected, so this is data fidelity loss rather than data
                loss. Find the producer before the repaired field reaches detections.

  - interval: 1m
    name: a single rejected body does not hold the alert open
    input_series:
      - series: 'http_request_body_rejected_total{policy="default"}'
        values: "0+0x4 1+0x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: IngestRequestBodiesRejected
        exp_alerts: []
