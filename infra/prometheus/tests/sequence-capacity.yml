rule_files:
  - ../rules/seagull-postgres.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: a healthy sequence raises nothing
    input_series:
      - series: 'postgres_sequence_used_ratio{sequence="net_events_id_seq"}'
        values: "0.3+0x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: PostgresSequenceCapacityElevated
        exp_alerts: []
      - eval_time: 40m
        alertname: PostgresSequenceCapacityCritical
        exp_alerts: []
      - eval_time: 40m
        alertname: PostgresSequenceProbeStale
        exp_alerts: []

  - interval: 1m
    name: crossing 60 percent opens the elevated alert and leaves critical closed
    input_series:
      - series: 'postgres_sequence_used_ratio{sequence="net_events_id_seq"}'
        values: "0.62+0x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: PostgresSequenceCapacityElevated
        exp_alerts: []
      - eval_time: 20m
        alertname: PostgresSequenceCapacityElevated
        exp_alerts:
          - exp_labels: &elevated_labels
              severity: warning
              subsystem: postgres
              sequence: net_events_id_seq
            exp_annotations: &elevated_annotations
              summary: Postgres sequence net_events_id_seq has spent 60% of its value space
              description: >-
                Every integer primary key in Seagull is backed by a 32-bit sequence
                that stops at 2147483647. When it runs out, every INSERT on the
                owning table fails and ingestion falls into retry and deadletter.
                Sequence burn is not row count: workers that delete and reinsert
                (exposure and network topology rebuild their graphs every cycle)
                consume values far faster than their tables grow, so a small table
                can still be the one that exhausts first. Read the current position
                with SELECT sequencename, last_value, max_value FROM pg_sequences
                WHERE schemaname = current_schema() ORDER BY last_value DESC, and
                plan the migration of the owning column to BIGINT. ALTER TABLE
                ... ALTER COLUMN TYPE bigint rewrites the table under an ACCESS
                EXCLUSIVE lock, so size the maintenance window from the table before
                starting.
      - eval_time: 40m
        alertname: PostgresSequenceCapacityCritical
        exp_alerts: []

  - interval: 1m
    name: crossing 85 percent opens the critical alert
    input_series:
      - series: 'postgres_sequence_used_ratio{sequence="net_events_id_seq"}'
        values: "0.9+0x40"
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresSequenceCapacityCritical
        exp_alerts: []
      - eval_time: 10m
        alertname: PostgresSequenceCapacityCritical
        exp_alerts:
          - exp_labels: &critical_labels
              severity: critical
              subsystem: postgres
              sequence: net_events_id_seq
            exp_annotations: &critical_annotations
              summary: Postgres sequence net_events_id_seq is close to exhaustion
              description: >-
                The sequence has consumed 85% of its value space. At the current
                rate the owning table will start rejecting INSERTs; for net_events
                that stops ingestion entirely and drains the queue into the
                deadletter list. Migrate the owning column to BIGINT now. If the
                table is too large for an in-place rewrite, restore headroom first
                by lowering the sequence with setval once the low end of the range
                is provably free, or by rebuilding the table into a partitioned
                BIGINT copy and swapping it in.
      - eval_time: 20m
        alertname: PostgresSequenceCapacityElevated
        exp_alerts:
          - exp_labels: *elevated_labels
            exp_annotations: *elevated_annotations

  - interval: 1m
    name: only the sequence over the floor alerts
    input_series:
      - series: 'postgres_sequence_used_ratio{sequence="net_events_id_seq"}'
        values: "0.9+0x40"
      - series: 'postgres_sequence_used_ratio{sequence="alerts_id_seq"}'
        values: "0.01+0x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: PostgresSequenceCapacityCritical
        exp_alerts:
          - exp_labels: *critical_labels
            exp_annotations: *critical_annotations

  - interval: 1m
    name: several backend processes reporting the same sequence raise one alert
    input_series:
      - series: 'postgres_sequence_used_ratio{sequence="net_events_id_seq", instance="backend-a"}'
        values: "0.9+0x40"
      - series: 'postgres_sequence_used_ratio{sequence="net_events_id_seq", instance="backend-b"}'
        values: "0.88+0x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: PostgresSequenceCapacityCritical
        exp_alerts:
          - exp_labels: *critical_labels
            exp_annotations: *critical_annotations

  - interval: 1m
    name: losing the probe opens the stale alert
    input_series:
      - series: 'postgres_sequence_used_ratio{sequence="net_events_id_seq"}'
        values: "0.3x10 _x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresSequenceProbeStale
        exp_alerts: []
      - eval_time: 60m
        alertname: PostgresSequenceProbeStale
        exp_alerts:
          - exp_labels:
              severity: warning
              subsystem: postgres
            exp_annotations:
              summary: Sequence capacity is no longer being reported
              description: >-
                The backend has not exported postgres_sequence_used_ratio for 30
                minutes, so the exhaustion alerts above cannot fire. The probe runs
                on every /metrics scrape and fails open, which means either the
                scrape target is down or the query against pg_sequences is failing.
                Check the backend logs for sequence_capacity_probe_failed.
