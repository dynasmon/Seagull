map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $ssl_client_s_dn $agent_cert_cn {
  default "";
  ~CN=(?<cn>[^,\\/]+) $cn;
}

limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
  listen 8081;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  resolver 127.0.0.11 ipv6=off valid=30s;

  ssl_certificate /etc/netwatch/tls/tls.crt;
  ssl_certificate_key /etc/netwatch/tls/tls.key;
  ssl_client_certificate /etc/netwatch/agent-ca/ca.crt;
  ssl_crl /etc/netwatch/agent-ca/ca.crl;
  ssl_verify_client optional;
  ssl_verify_depth 3;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  client_max_body_size 2m;
  server_tokens off;
  limit_conn conn_per_ip 60;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

  location = /api/auth/login {
    set $backend_upstream http://netwatch-backend:8000;
    limit_req zone=auth_per_ip burst=8 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_pass $backend_upstream/auth/login;
  }

  location = /api/auth/otp/login {
    set $backend_upstream http://netwatch-backend:8000;
    limit_req zone=auth_per_ip burst=8 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_pass $backend_upstream/auth/otp/login;
  }

  location = /api/auth/refresh {
    set $backend_upstream http://netwatch-backend:8000;
    limit_req zone=auth_per_ip burst=15 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_pass $backend_upstream/auth/refresh;
  }

  location /api/ {
    set $backend_upstream http://netwatch-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_pass $backend_upstream/;
  }

  location /agent/ {
    set $backend_upstream http://netwatch-backend:8000;
    if ($ssl_client_verify != SUCCESS) {
      return 401;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Agent-TLS-Verified $ssl_client_verify;
    proxy_set_header X-Agent-TLS-Subject $ssl_client_s_dn;
    proxy_set_header X-Agent-TLS-Issuer $ssl_client_i_dn;
    proxy_set_header X-Agent-TLS-Serial $ssl_client_serial;
    proxy_set_header X-Agent-TLS-Fingerprint $ssl_client_fingerprint;
    proxy_set_header X-Agent-TLS-Cert $ssl_client_escaped_cert;
    proxy_set_header X-Agent-TLS-Agent-ID $agent_cert_cn;
    proxy_set_header X-Agent-TLS-Not-Before $ssl_client_v_start;
    proxy_set_header X-Agent-TLS-Not-After $ssl_client_v_end;
    rewrite ^/agent/?(.*)$ /$1 break;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_pass $backend_upstream;
  }

  location /kibana/ {
    set $kibana_upstream http://kibana:5601;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_pass $kibana_upstream;
  }

  location /elasticsearch/ {
    set $elasticsearch_upstream http://elasticsearch:9200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    rewrite ^/elasticsearch/?(.*)$ /$1 break;
    proxy_pass $elasticsearch_upstream;
  }

  location / {
    set $portal_upstream http://netwatch-portal:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_pass $portal_upstream;
  }
}
