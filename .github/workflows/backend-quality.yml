name: backend quality

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refact/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint, import contracts, tests and dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: python:3.12-slim
    steps:
      - name: install git for the checkout
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: install the backend toolchain
        run: pip install --no-cache-dir -r backend/requirements-dev.txt
      - name: run the backend quality gate
        run: bash scripts/ci/backend-quality.sh
