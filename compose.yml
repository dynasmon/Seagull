    cap_drop:
      - ALL
    mem_limit: 1280m
    cpus: "1.25"
    networks:
      - seagull
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.manager", "health", "ingest"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  seagull-intelligence-worker:
    build: ./backend
    container_name: seagull-intelligence-worker
    command: ["python", "-m", "app.workers.manager", "intelligence"]
    depends_on:
      postgres:
