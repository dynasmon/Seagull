      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - ${SEAGULL_AGENT_SERVER_CA_FILE:-./secrets/tls/ca.crt}:/etc/seagull/server-ca.crt:ro

  # Agents (optional — profile: extra)

  seagull-agent-lateral:
    <<: *agent-sensor-base
    container_name: seagull-agent-lateral
    profiles: ["extra"]
    depends_on:
      seagull-backend:
        condition: service_healthy
    environment:
      <<: *agent-env
      SEAGULL_AGENT_ID: ${AGENT_LATERAL_ID:-agent-lateral-1}
      SEAGULL_SOURCES: lateral
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ${AGENT_LATERAL_BOOTSTRAP_TOKEN:-}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: ${AGENT_LATERAL_BOOTSTRAP_TOKEN_FILE:-/etc/seagull/bootstrap/${AGENT_LATERAL_ID:-agent-lateral-1}.token}
      SEAGULL_LATERAL_MODE: ${SEAGULL_LATERAL_MODE:-}
      SEAGULL_LATERAL_PCAP_IFACE: ${SEAGULL_LATERAL_PCAP_IFACE:-}
      SEAGULL_LATERAL_PORTS: ${SEAGULL_LATERAL_PORTS:-}
      SEAGULL_LATERAL_INCLUDE_ESTABLISHED: ${SEAGULL_LATERAL_INCLUDE_ESTABLISHED:-}
      SEAGULL_LATERAL_DEDUP_TTL: ${SEAGULL_LATERAL_DEDUP_TTL:-}
      SEAGULL_LATERAL_MAX_BATCH: ${SEAGULL_LATERAL_MAX_BATCH:-}
    volumes:
      - agent-lateral-state:/var/lib/seagull
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - ${SEAGULL_AGENT_SERVER_CA_FILE:-./secrets/tls/ca.crt}:/etc/seagull/server-ca.crt:ro

  # Agents (legacy split — profile: legacy-agents)

  seagull-agent-proc:
    <<: *agent-core-base
    container_name: seagull-agent-proc-legacy
    profiles: ["legacy-agents"]
    depends_on:
      seagull-backend:
        condition: service_healthy
    environment:
      <<: *agent-env
      SEAGULL_AGENT_ID: ${AGENT_PROC_ID:-agent-proc-1}
      SEAGULL_SOURCES: proc,authlog,syscollector
      SEAGULL_AUTHLOG_PATH: /var/log/auth.log
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ${AGENT_PROC_BOOTSTRAP_TOKEN:-}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: ${AGENT_PROC_BOOTSTRAP_TOKEN_FILE:-/etc/seagull/bootstrap/${AGENT_PROC_ID:-agent-proc-1}.token}
    volumes:
      - /var/log:/host/var/log:ro
      - agent-proc-state:/var/lib/seagull
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - ${SEAGULL_AGENT_SERVER_CA_FILE:-./secrets/tls/ca.crt}:/etc/seagull/server-ca.crt:ro

  seagull-agent-scan:
    <<: *agent-sensor-base
    container_name: seagull-agent-scan-legacy
    profiles: ["legacy-agents"]
    depends_on:
      seagull-backend:
        condition: service_healthy
    environment:
      <<: *agent-env
      SEAGULL_AGENT_ID: ${AGENT_SCAN_ID:-agent-scan-1}
      SEAGULL_SOURCES: scan
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ${AGENT_SCAN_BOOTSTRAP_TOKEN:-}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: ${AGENT_SCAN_BOOTSTRAP_TOKEN_FILE:-/etc/seagull/bootstrap/${AGENT_SCAN_ID:-agent-scan-1}.token}
    volumes:
      - agent-scan-state:/var/lib/seagull
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - ${SEAGULL_AGENT_SERVER_CA_FILE:-./secrets/tls/ca.crt}:/etc/seagull/server-ca.crt:ro

  seagull-agent-ddos:
    <<: *agent-sensor-base
    container_name: seagull-agent-ddos-legacy
    profiles: ["legacy-agents"]
    depends_on:
      seagull-backend:
        condition: service_healthy
    environment:
      <<: *agent-env
      SEAGULL_AGENT_ID: ${AGENT_DDOS_ID:-agent-ddos-1}
      SEAGULL_SOURCES: ddos
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ${AGENT_DDOS_BOOTSTRAP_TOKEN:-}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: ${AGENT_DDOS_BOOTSTRAP_TOKEN_FILE:-/etc/seagull/bootstrap/${AGENT_DDOS_ID:-agent-ddos-1}.token}
      SEAGULL_DDOS_SUSTAIN_WINDOWS: ${SEAGULL_DDOS_SUSTAIN_WINDOWS:-}
      SEAGULL_DDOS_COOLDOWN: ${SEAGULL_DDOS_COOLDOWN:-}
    volumes:
      - agent-ddos-state:/var/lib/seagull
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - ${SEAGULL_AGENT_SERVER_CA_FILE:-./secrets/tls/ca.crt}:/etc/seagull/server-ca.crt:ro

  seagull-agent-vuln:
    <<: *agent-core-base
    container_name: seagull-agent-vuln-legacy
    profiles: ["legacy-agents"]
    depends_on:
      seagull-backend:
        condition: service_healthy
    environment:
      <<: *agent-env
      SEAGULL_AGENT_ID: ${AGENT_VULN_ID:-agent-vuln-1}
      SEAGULL_SOURCES: vuln
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ${AGENT_VULN_BOOTSTRAP_TOKEN:-}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: ${AGENT_VULN_BOOTSTRAP_TOKEN_FILE:-/etc/seagull/bootstrap/${AGENT_VULN_ID:-agent-vuln-1}.token}
      SEAGULL_HOST_ROOT: ${SEAGULL_VULN_HOST_ROOT:-}
      SEAGULL_VULN_SCAN_EVERY: ${SEAGULL_VULN_SCAN_EVERY:-}
      SEAGULL_VULN_HTTP_TIMEOUT: ${SEAGULL_VULN_HTTP_TIMEOUT:-}
      SEAGULL_VULN_OSV_URL: ${SEAGULL_VULN_OSV_URL:-}
      SEAGULL_VULN_MIN_SEVERITY: ${SEAGULL_VULN_MIN_SEVERITY:-}
      SEAGULL_VULN_ANALYSIS_PROFILE: ${SEAGULL_VULN_ANALYSIS_PROFILE:-}
      SEAGULL_VULN_EXPOSURE_ENABLED: ${SEAGULL_VULN_EXPOSURE_ENABLED:-}
      SEAGULL_VULN_QUERY_BATCH_SIZE: ${SEAGULL_VULN_QUERY_BATCH_SIZE:-}
      SEAGULL_VULN_CMD_TIMEOUT: ${SEAGULL_VULN_CMD_TIMEOUT:-}
      SEAGULL_VULN_MAX_PACKAGES: ${SEAGULL_VULN_MAX_PACKAGES:-}
      SEAGULL_VULN_HOST_ROOT: ${SEAGULL_VULN_HOST_ROOT:-}
      SEAGULL_VULN_EMIT_SUMMARY_EVENT: ${SEAGULL_VULN_EMIT_SUMMARY_EVENT:-}
    volumes:
      - /:/host:ro
      - agent-vuln-state:/var/lib/seagull
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - ${SEAGULL_AGENT_SERVER_CA_FILE:-./secrets/tls/ca.crt}:/etc/seagull/server-ca.crt:ro

  # Observability (optional — profile: observability)

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: seagull-kibana
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${SEAGULL_ES_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:-}}
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: ${SEAGULL_KIBANA_PUBLIC_BASE_URL:-https://localhost/kibana}
    ports:
      - "${KIBANA_PORT:-}:5601"
    networks:
      - seagull
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: seagull-grafana
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-}
      GF_SECURITY_ADMIN_PASSWORD__FILE: ${GF_SECURITY_ADMIN_PASSWORD_FILE:-}
      POSTGRES_USER: ${POSTGRES_USER:-seagull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      POSTGRES_DB: ${POSTGRES_DB:-seagull}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - seagull
    restart: unless-stopped
