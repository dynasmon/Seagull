  # Portal

  seagull-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seagull-portal
    depends_on:
      seagull-backend:
        condition: service_healthy
    ports:
      - "${SEAGULL_PORTAL_PORT:-}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "0.50"
    networks:
      - seagull
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Edge (Caddy)

  caddy:
    image: caddy:2.10-alpine
    init: true
    container_name: seagull-caddy
    depends_on:
      seagull-portal:
        condition: service_healthy
      seagull-backend:
        condition: service_healthy
    ports:
      - "${SEAGULL_EDGE_HTTP_PORT:-8081}:${SEAGULL_CADDY_HTTP_INTERNAL_PORT:-8081}"
      - "${SEAGULL_EDGE_HTTPS_PORT:-8443}:${SEAGULL_CADDY_HTTPS_INTERNAL_PORT:-8443}"
    environment:
      SEAGULL_CADDY_DOMAIN: ${SEAGULL_CADDY_DOMAIN:-}
      SEAGULL_CADDY_EMAIL: ${SEAGULL_CADDY_EMAIL:-}
      SEAGULL_PORTAL_INTERNAL_PORT: ${SEAGULL_PORTAL_INTERNAL_PORT:-8080}
    volumes:
      - ${SEAGULL_CADDY_CONFIG_FILE:-./infra/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${SEAGULL_TLS_CERT_FILE:-./secrets/tls/tls.crt}:/etc/seagull/tls/tls.crt:ro
      - ${SEAGULL_TLS_KEY_FILE:-./secrets/tls/tls.key}:/etc/seagull/tls/tls.key:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - seagull
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          wget -q -O - --no-check-certificate
          https://${SEAGULL_CADDY_DOMAIN:-localhost}:${SEAGULL_CADDY_HTTPS_INTERNAL_PORT:-8443}/api/health/live
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Agents (core)

  seagull-agent-core:
    <<: *agent-core-base
    container_name: seagull-agent-core-1
    depends_on:
      seagull-backend:
        condition: service_healthy
    environment:
      <<: *agent-env
      SEAGULL_AGENT_ID: ${AGENT_CORE_ID:-agent-core-1}
      SEAGULL_SOURCES: proc,authlog,syscollector,vuln
      SEAGULL_AUTHLOG_PATH: /var/log/auth.log
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ${AGENT_CORE_BOOTSTRAP_TOKEN:-}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: ${AGENT_CORE_BOOTSTRAP_TOKEN_FILE:-/etc/seagull/bootstrap/${AGENT_CORE_ID:-agent-core-1}.token}
      SEAGULL_HOST_ROOT: ${SEAGULL_VULN_HOST_ROOT:-}
      SEAGULL_VULN_SCAN_EVERY: ${SEAGULL_VULN_SCAN_EVERY:-}
      SEAGULL_VULN_HTTP_TIMEOUT: ${SEAGULL_VULN_HTTP_TIMEOUT:-}
      SEAGULL_VULN_OSV_URL: ${SEAGULL_VULN_OSV_URL:-}
      SEAGULL_VULN_MIN_SEVERITY: ${SEAGULL_VULN_MIN_SEVERITY:-}
      SEAGULL_VULN_ANALYSIS_PROFILE: ${SEAGULL_VULN_ANALYSIS_PROFILE:-}
      SEAGULL_VULN_EXPOSURE_ENABLED: ${SEAGULL_VULN_EXPOSURE_ENABLED:-}
      SEAGULL_VULN_QUERY_BATCH_SIZE: ${SEAGULL_VULN_QUERY_BATCH_SIZE:-}
      SEAGULL_VULN_CMD_TIMEOUT: ${SEAGULL_VULN_CMD_TIMEOUT:-}
      SEAGULL_VULN_MAX_PACKAGES: ${SEAGULL_VULN_MAX_PACKAGES:-}
      SEAGULL_VULN_HOST_ROOT: ${SEAGULL_VULN_HOST_ROOT:-}
      SEAGULL_VULN_EMIT_SUMMARY_EVENT: ${SEAGULL_VULN_EMIT_SUMMARY_EVENT:-}
    volumes:
      - /var/log:/host/var/log:ro
      - /:/host:ro
      - agent-core-state:/var/lib/seagull
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - ${SEAGULL_AGENT_SERVER_CA_FILE:-./secrets/tls/ca.crt}:/etc/seagull/server-ca.crt:ro

  seagull-agent-sensor:
    <<: *agent-sensor-base
    container_name: seagull-agent-sensor-1
    depends_on:
      seagull-backend:
        condition: service_healthy
    environment:
      <<: *agent-env
      SEAGULL_AGENT_ID: ${AGENT_SENSOR_ID:-agent-sensor-1}
      SEAGULL_SOURCES: scan,ddos,l7
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ${AGENT_SENSOR_BOOTSTRAP_TOKEN:-}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: ${AGENT_SENSOR_BOOTSTRAP_TOKEN_FILE:-/etc/seagull/bootstrap/${AGENT_SENSOR_ID:-agent-sensor-1}.token}
      SEAGULL_DDOS_SUSTAIN_WINDOWS: ${SEAGULL_DDOS_SUSTAIN_WINDOWS:-}
      SEAGULL_DDOS_COOLDOWN: ${SEAGULL_DDOS_COOLDOWN:-}
    volumes:
