      SEAGULL_PROTO_INTEL_IDLE_SLEEP_SECONDS: ${SEAGULL_PROTO_INTEL_IDLE_SLEEP_SECONDS:-2.0}
      SEAGULL_PROTO_INTEL_MAX_ROWS: ${SEAGULL_PROTO_INTEL_MAX_ROWS:-5000}
      SEAGULL_PROTO_INTEL_BATCH_SIZE: ${SEAGULL_PROTO_INTEL_BATCH_SIZE:-500}
      SEAGULL_PROTO_INTEL_PAYLOAD_MAX_BYTES: ${SEAGULL_PROTO_INTEL_PAYLOAD_MAX_BYTES:-4096}
      SEAGULL_ATTACK_CHAIN_EVERY_SECONDS: ${SEAGULL_ATTACK_CHAIN_EVERY_SECONDS:-1.0}
      SEAGULL_ATTACK_CHAIN_IDLE_SLEEP_SECONDS: ${SEAGULL_ATTACK_CHAIN_IDLE_SLEEP_SECONDS:-2.0}
      SEAGULL_ATTACK_CHAIN_BATCH_SIZE: ${SEAGULL_ATTACK_CHAIN_BATCH_SIZE:-500}
      SEAGULL_ATTACK_CHAIN_LOG_EVERY_SECONDS: ${SEAGULL_ATTACK_CHAIN_LOG_EVERY_SECONDS:-2.0}
      SEAGULL_ATTACK_CHAIN_LOG_IDLE_EVERY_SECONDS: ${SEAGULL_ATTACK_CHAIN_LOG_IDLE_EVERY_SECONDS:-20.0}
      SEAGULL_ATTACK_CHAIN_DEBUG: ${SEAGULL_ATTACK_CHAIN_DEBUG:-false}
      SEAGULL_ATTACK_CHAIN_IDLE_CLOSE_SECONDS: ${SEAGULL_ATTACK_CHAIN_IDLE_CLOSE_SECONDS:-2700}
      SEAGULL_ATTACK_CHAIN_ATTACH_LOCAL_WINDOW_SECONDS: ${SEAGULL_ATTACK_CHAIN_ATTACH_LOCAL_WINDOW_SECONDS:-1200}
      SEAGULL_ATTACK_CHAIN_STEP_DEDUP_SECONDS: ${SEAGULL_ATTACK_CHAIN_STEP_DEDUP_SECONDS:-60}
      SEAGULL_ATTACK_CHAIN_MAX_SCORE: ${SEAGULL_ATTACK_CHAIN_MAX_SCORE:-100}
      SEAGULL_ATTACK_CHAIN_SSH_BRUTEFORCE_SCORE: ${SEAGULL_ATTACK_CHAIN_SSH_BRUTEFORCE_SCORE:-12}
      SEAGULL_ATTACK_CHAIN_SSH_BRUTEFORCE_SUCCESS_SCORE: ${SEAGULL_ATTACK_CHAIN_SSH_BRUTEFORCE_SUCCESS_SCORE:-34}
      SEAGULL_ATTACK_CHAIN_SUDO_PRIV_ESCALATION_SCORE: ${SEAGULL_ATTACK_CHAIN_SUDO_PRIV_ESCALATION_SCORE:-24}
      SEAGULL_ATTACK_CHAIN_SUDO_LOLBIN_SCORE: ${SEAGULL_ATTACK_CHAIN_SUDO_LOLBIN_SCORE:-14}
      SEAGULL_ATTACK_CHAIN_LOG_TAMPER_SCORE: ${SEAGULL_ATTACK_CHAIN_LOG_TAMPER_SCORE:-22}
      SEAGULL_NETWORK_TOPOLOGY_REFRESH_SECONDS: ${SEAGULL_NETWORK_TOPOLOGY_REFRESH_SECONDS:-3600}
      SEAGULL_NETWORK_TOPOLOGY_WINDOW_MINUTES: ${SEAGULL_NETWORK_TOPOLOGY_WINDOW_MINUTES:-60}
      SEAGULL_NETWORK_TOPOLOGY_MAX_EVENTS_PER_RUN: ${SEAGULL_NETWORK_TOPOLOGY_MAX_EVENTS_PER_RUN:-500}
