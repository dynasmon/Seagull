networks:
  seagull:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  elastic-data:
  clickhouse-data:
  caddy-data:
  caddy-config:
  agent-core-state:
  agent-sensor-state:
  agent-lateral-state:
  agent-proc-state:
  agent-scan-state:
  agent-ddos-state:
  agent-vuln-state:

x-agent-env: &agent-env
  SEAGULL_API_URL: ${SEAGULL_API_URL:-https://127.0.0.1:${SEAGULL_EDGE_HTTPS_PORT:-8443}/agent}
  SEAGULL_HTTP_TIMEOUT: ${SEAGULL_HTTP_TIMEOUT:-}
  SEAGULL_CONTROL_HEARTBEAT_EVERY: ${SEAGULL_CONTROL_HEARTBEAT_EVERY:-}
  SEAGULL_CONTROL_HEARTBEAT_JITTER: ${SEAGULL_CONTROL_HEARTBEAT_JITTER:-5s}
  SEAGULL_CONTROL_CONFIG_EVERY: ${SEAGULL_CONTROL_CONFIG_EVERY:-}
  SEAGULL_CONTROL_CONFIG_JITTER: ${SEAGULL_CONTROL_CONFIG_JITTER:-30s}
  SEAGULL_PCAP_IFACE: ${SEAGULL_PCAP_IFACE:-}
  SEAGULL_L7_PCAP_IFACE: ${SEAGULL_L7_PCAP_IFACE:-}
  SEAGULL_L7_DEDUP_TTL: ${SEAGULL_L7_DEDUP_TTL:-20s}
  SEAGULL_L7_MAX_BATCH: ${SEAGULL_L7_MAX_BATCH:-400}
  SEAGULL_L7_MAX_PAYLOAD_BYTES: ${SEAGULL_L7_MAX_PAYLOAD_BYTES:-512}
  SEAGULL_L7_INCLUDE_PAYLOAD: ${SEAGULL_L7_INCLUDE_PAYLOAD:-false}
  SEAGULL_DDOS_SUSTAIN_WINDOWS: ${SEAGULL_DDOS_SUSTAIN_WINDOWS:-}
  SEAGULL_DDOS_COOLDOWN: ${SEAGULL_DDOS_COOLDOWN:-}
  SEAGULL_DDOS_MIN_PPS: ${SEAGULL_DDOS_MIN_PPS:-}
  SEAGULL_DDOS_MIN_BPS: ${SEAGULL_DDOS_MIN_BPS:-}
  SEAGULL_DDOS_MIN_CONFIDENCE: ${SEAGULL_DDOS_MIN_CONFIDENCE:-}
  SEAGULL_DDOS_MIN_SRC_IPS: ${SEAGULL_DDOS_MIN_SRC_IPS:-}
  SEAGULL_DDOS_MIN_SRC_ENTROPY_NORM: ${SEAGULL_DDOS_MIN_SRC_ENTROPY_NORM:-}
  SEAGULL_DDOS_BASELINE_WARMUP_WINDOWS: ${SEAGULL_DDOS_BASELINE_WARMUP_WINDOWS:-}
  SEAGULL_DDOS_BASELINE_FACTOR: ${SEAGULL_DDOS_BASELINE_FACTOR:-}
  SEAGULL_DDOS_MIN_HTTP_RPS: ${SEAGULL_DDOS_MIN_HTTP_RPS:-}
  SEAGULL_DDOS_MIN_TLS_HS_RPS: ${SEAGULL_DDOS_MIN_TLS_HS_RPS:-}
  SEAGULL_DDOS_MAX_BATCH: ${SEAGULL_DDOS_MAX_BATCH:-}
  SEAGULL_DDOS_BACKPRESSURE_HIGH_WATERMARK: ${SEAGULL_DDOS_BACKPRESSURE_HIGH_WATERMARK:-}
  SEAGULL_DDOS_BACKPRESSURE_SAMPLE_EVERY: ${SEAGULL_DDOS_BACKPRESSURE_SAMPLE_EVERY:-}
  SEAGULL_SKIP_LOOPBACK: ${SEAGULL_SKIP_LOOPBACK:-}
  SEAGULL_SKIP_LINK_LOCAL: ${SEAGULL_SKIP_LINK_LOCAL:-}
  SEAGULL_DENY_CIDRS: ${SEAGULL_DENY_CIDRS:-}
  SEAGULL_DENY_DST_PORTS: ${SEAGULL_DENY_DST_PORTS:-}
  SEAGULL_AGENT_CONFIG_FILE: ${SEAGULL_AGENT_CONFIG_FILE:-}
  SEAGULL_SYSCOLLECT_EVERY: ${SEAGULL_SYSCOLLECT_EVERY:-}
  SEAGULL_SYSCOLLECT_STARTUP_JITTER: ${SEAGULL_SYSCOLLECT_STARTUP_JITTER:-45s}
  SEAGULL_SYSCOLLECT_CMD_TIMEOUT: ${SEAGULL_SYSCOLLECT_CMD_TIMEOUT:-}
  SEAGULL_SYSCOLLECT_MAX_OUTPUT_BYTES: ${SEAGULL_SYSCOLLECT_MAX_OUTPUT_BYTES:-}
  SEAGULL_SYSCOLLECT_MAX_PACKAGES: ${SEAGULL_SYSCOLLECT_MAX_PACKAGES:-}
  SEAGULL_AUTHLOG_DEDUP_TTL: ${SEAGULL_AUTHLOG_DEDUP_TTL:-}
  SEAGULL_AUTHLOG_INCLUDE_ACCEPTED: ${SEAGULL_AUTHLOG_INCLUDE_ACCEPTED:-}
  SEAGULL_VULN_STARTUP_JITTER: ${SEAGULL_VULN_STARTUP_JITTER:-2m}
  SEAGULL_FORCE_ENROLL_ON_START: ${SEAGULL_FORCE_ENROLL_ON_START:-true}
  SEAGULL_TLS_SERVER_NAME: ${SEAGULL_AGENT_TLS_SERVER_NAME:-localhost}
  SEAGULL_TLS_CA_FILE: /etc/seagull/server-ca.crt
  SEAGULL_AGENT_IDENTITY_STATE_FILE: ${SEAGULL_AGENT_IDENTITY_STATE_FILE:-/var/lib/seagull/agent.identity.json}
  SEAGULL_AGENT_CREDENTIAL_FILE: ${SEAGULL_AGENT_CREDENTIAL_FILE:-/var/lib/seagull/agent.credential}
  SEAGULL_CONTROL_CREDENTIAL_ROTATE_EVERY: ${SEAGULL_CONTROL_CREDENTIAL_ROTATE_EVERY:-5m}
  SEAGULL_CONTROL_CREDENTIAL_ROTATE_BEFORE: ${SEAGULL_CONTROL_CREDENTIAL_ROTATE_BEFORE:-24h}

x-agent-build: &agent-build
  build:
    context: ./agent
    dockerfile: Dockerfile

x-agent-common: &agent-common
  <<: *agent-build
  network_mode: host
  user: "0:0"
  group_add:
    - "${SEAGULL_HOST_ADM_GID:-4}"
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-agent-core-base: &agent-core-base
  <<: *agent-common
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  mem_limit: 384m
  cpus: "0.75"

x-agent-sensor-base: &agent-sensor-base
  <<: *agent-common
  cap_drop:
    - ALL
  cap_add:
    - NET_RAW
    - NET_ADMIN
  read_only: true
  tmpfs:
    - /tmp
  mem_limit: 512m
  cpus: "1.50"

services:

  # Data layer

  postgres:
    image: postgres:16-alpine
    container_name: seagull-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seagull}
      POSTGRES_USER: ${POSTGRES_USER:-seagull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - seagull
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          DB_PASS="${POSTGRES_PASSWORD:-}";
          if [ -z "$$DB_PASS" ] && [ -n "${POSTGRES_PASSWORD_FILE:-}" ]; then
            DB_PASS="$$(cat "${POSTGRES_PASSWORD_FILE}")";
          fi;
          PGPASSWORD="$$DB_PASS" psql -h 127.0.0.1 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -tAc 'SELECT 1' >/dev/null 2>&1 ||
          { echo 'postgres auth failed'; exit 1; }
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: seagull-redis
    command: ["/bin/sh", "/etc/seagull/redis/start.sh"]
    environment:
      SEAGULL_REDIS_PASSWORD: ${SEAGULL_REDIS_PASSWORD:-${NETWATCH_REDIS_PASSWORD:-}}
      SEAGULL_REDIS_PASSWORD_FILE: ${SEAGULL_REDIS_PASSWORD_FILE:-${NETWATCH_REDIS_PASSWORD_FILE:-}}
      SEAGULL_REDIS_CONFIG_FILE: /etc/seagull/redis/${SEAGULL_REDIS_CONFIG:-redis.dev.conf}
      SEAGULL_REDIS_STRICT_PASSWORD: ${SEAGULL_REDIS_STRICT_PASSWORD:-false}
    stop_grace_period: ${SEAGULL_REDIS_STOP_GRACE_PERIOD:-10s}
    volumes:
      - ./infra/redis:/etc/seagull/redis:ro
      - redis-data:/data
    networks:
      - seagull
    healthcheck:
      test: ["CMD", "/bin/sh", "/etc/seagull/redis/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: seagull-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: ${SEAGULL_ES_SECURITY_ENABLED:-false}
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      ELASTIC_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:-}}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-}:9200"
    networks:
      - seagull
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          ES_PASS="${SEAGULL_ES_PASSWORD:-}";
          if [ -n "$$ES_PASS" ]; then
            curl -fsS -u "elastic:$$ES_PASS" "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s" >/dev/null;
          else
            curl -fsS "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s" >/dev/null;
          fi
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: seagull-clickhouse
    environment:
      CLICKHOUSE_DB: ${SEAGULL_CLICKHOUSE_DATABASE:-${NETWATCH_CLICKHOUSE_DATABASE:-seagull}}
      CLICKHOUSE_USER: ${SEAGULL_CLICKHOUSE_USERNAME:-${NETWATCH_CLICKHOUSE_USERNAME:-default}}
      CLICKHOUSE_PASSWORD: ${SEAGULL_CLICKHOUSE_PASSWORD:-${NETWATCH_CLICKHOUSE_PASSWORD:-}}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-}:9000"
    networks:
      - seagull
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q 'Ok.'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Backend

  seagull-backend:
    build: ./backend
    container_name: seagull-backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "${SEAGULL_UVICORN_WORKERS:-2}"
      - --no-access-log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SEAGULL_BACKEND_PORT:-}:8000"
    environment:
      SEAGULL_ENV: ${SEAGULL_ENV:-${SEAGULL_MODE:-dev}}
      SEAGULL_DB_HOST: postgres
      SEAGULL_DB_PORT: "5432"
      SEAGULL_DB_NAME: ${POSTGRES_DB:-seagull}
      SEAGULL_DB_USER: ${POSTGRES_USER:-seagull}
      SEAGULL_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      SEAGULL_DB_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      SEAGULL_DB_AUTO_UPGRADE: ${SEAGULL_DB_AUTO_UPGRADE:-true}
      SEAGULL_REDIS_PASSWORD: ${SEAGULL_REDIS_PASSWORD:-${NETWATCH_REDIS_PASSWORD:-}}
      SEAGULL_REDIS_PASSWORD_FILE: ${SEAGULL_REDIS_PASSWORD_FILE:-${NETWATCH_REDIS_PASSWORD_FILE:-}}
      SEAGULL_JWT_SECRET: ${SEAGULL_JWT_SECRET:-${NETWATCH_JWT_SECRET:-}}
      SEAGULL_JWT_SECRET_FILE: ${SEAGULL_JWT_SECRET_FILE:-${NETWATCH_JWT_SECRET_FILE:-}}
      SEAGULL_JWT_ISSUER: ${SEAGULL_JWT_ISSUER:-seagull-backend}
      SEAGULL_JWT_AUDIENCE: ${SEAGULL_JWT_AUDIENCE:-seagull-portal}
      SEAGULL_TOKEN_PEPPER: ${SEAGULL_TOKEN_PEPPER:-}
      SEAGULL_ACCESS_TOKEN_TTL_SECONDS: ${SEAGULL_ACCESS_TOKEN_TTL_SECONDS:-600}
      SEAGULL_REFRESH_TOKEN_TTL_SECONDS: ${SEAGULL_REFRESH_TOKEN_TTL_SECONDS:-604800}
      SEAGULL_OTP_TOKEN_TTL_SECONDS: ${SEAGULL_OTP_TOKEN_TTL_SECONDS:-900}
      SEAGULL_AUTH_OTP_ENABLED: ${SEAGULL_AUTH_OTP_ENABLED:-false}
      SEAGULL_COOKIE_SECURE: ${SEAGULL_COOKIE_SECURE:-false}
      SEAGULL_COOKIE_SAMESITE: ${SEAGULL_COOKIE_SAMESITE:-lax}
      SEAGULL_COOKIE_DOMAIN: ${SEAGULL_COOKIE_DOMAIN:-}
      SEAGULL_ENABLE_HSTS: ${SEAGULL_ENABLE_HSTS:-false}
      SEAGULL_TRUST_PROXY_HEADERS: ${SEAGULL_TRUST_PROXY_HEADERS:-false}
      SEAGULL_TRUSTED_PROXY_CIDRS: ${SEAGULL_TRUSTED_PROXY_CIDRS:-127.0.0.1,::1}
      SEAGULL_INTERNAL_NETWORK_CIDRS: ${SEAGULL_INTERNAL_NETWORK_CIDRS:-}
      SEAGULL_ALLOWED_HOSTS: ${SEAGULL_ALLOWED_HOSTS:-${SEAGULL_ALLOWED_HOSTS_PROD:-localhost,127.0.0.1}}
      SEAGULL_AUDIT_HASH_PEPPER: ${SEAGULL_AUDIT_HASH_PEPPER:-${NETWATCH_AUDIT_HASH_PEPPER:-}}
      SEAGULL_AUDIT_HASH_PEPPER_FILE: ${SEAGULL_AUDIT_HASH_PEPPER_FILE:-}
      SEAGULL_AUDIT_RETENTION_ENABLED: ${SEAGULL_AUDIT_RETENTION_ENABLED:-true}
      SEAGULL_AUDIT_RETENTION_DAYS: ${SEAGULL_AUDIT_RETENTION_DAYS:-30}
      SEAGULL_LOGIN_AUDIT_RETENTION_DAYS: ${SEAGULL_LOGIN_AUDIT_RETENTION_DAYS:-30}
      SEAGULL_GOVERNANCE_RETENTION_DAYS: ${SEAGULL_GOVERNANCE_RETENTION_DAYS:-30}
      SEAGULL_AUDIT_RETENTION_EVERY_SECONDS: ${SEAGULL_AUDIT_RETENTION_EVERY_SECONDS:-3600}
      SEAGULL_AUDIT_RETENTION_DELETE_BATCH: ${SEAGULL_AUDIT_RETENTION_DELETE_BATCH:-5000}
      SEAGULL_SEARCH_BACKEND: ${SEAGULL_SEARCH_BACKEND:-auto}
      SEAGULL_ES_URL: ${SEAGULL_ES_URL:-http://elasticsearch:9200}
      SEAGULL_ES_INDEX_PREFIX: ${SEAGULL_ES_INDEX_PREFIX:-seagull-events}
      SEAGULL_ES_REQUEST_TIMEOUT_SECONDS: ${SEAGULL_ES_REQUEST_TIMEOUT_SECONDS:-30}
      SEAGULL_ES_USERNAME: ${SEAGULL_ES_USERNAME:-${NETWATCH_ES_USERNAME:-}}
      SEAGULL_ES_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:-}}
      SEAGULL_ES_PASSWORD_FILE: ${SEAGULL_ES_PASSWORD_FILE:-}
      SEAGULL_ES_VERIFY_CERTS: ${SEAGULL_ES_VERIFY_CERTS:-true}
      SEAGULL_ES_CA_CERTS: ${SEAGULL_ES_CA_CERTS:-}
      SEAGULL_ES_PING_TTL_SECONDS: ${SEAGULL_ES_PING_TTL_SECONDS:-2}
      SEAGULL_INGEST_WARM_INDEX_PREFIX: ${SEAGULL_INGEST_WARM_INDEX_PREFIX:-seagull-events-warm}
      SEAGULL_INGEST_WARM_ILM_ENABLED: ${SEAGULL_INGEST_WARM_ILM_ENABLED:-true}
      SEAGULL_INGEST_WARM_ILM_POLICY: ${SEAGULL_INGEST_WARM_ILM_POLICY:-seagull-warm-delete-30d}
      SEAGULL_INGEST_WARM_ILM_DELETE_AFTER_DAYS: ${SEAGULL_INGEST_WARM_ILM_DELETE_AFTER_DAYS:-30}
      SEAGULL_CLICKHOUSE_ENABLED: ${SEAGULL_CLICKHOUSE_ENABLED:-true}
      SEAGULL_CLICKHOUSE_REQUIRED: ${SEAGULL_CLICKHOUSE_REQUIRED:-false}
      SEAGULL_CLICKHOUSE_HOST: ${SEAGULL_CLICKHOUSE_HOST:-clickhouse}
      SEAGULL_CLICKHOUSE_PORT: ${SEAGULL_CLICKHOUSE_PORT:-8123}
      SEAGULL_CLICKHOUSE_DATABASE: ${SEAGULL_CLICKHOUSE_DATABASE:-${NETWATCH_CLICKHOUSE_DATABASE:-seagull}}
      SEAGULL_CLICKHOUSE_USERNAME: ${SEAGULL_CLICKHOUSE_USERNAME:-${NETWATCH_CLICKHOUSE_USERNAME:-default}}
      SEAGULL_CLICKHOUSE_PASSWORD: ${SEAGULL_CLICKHOUSE_PASSWORD:-${NETWATCH_CLICKHOUSE_PASSWORD:-}}
      SEAGULL_CLICKHOUSE_SECURE: ${SEAGULL_CLICKHOUSE_SECURE:-false}
      SEAGULL_CLICKHOUSE_VERIFY: ${SEAGULL_CLICKHOUSE_VERIFY:-true}
      SEAGULL_CLICKHOUSE_CONNECT_TIMEOUT_SECONDS: ${SEAGULL_CLICKHOUSE_CONNECT_TIMEOUT_SECONDS:-2}
      SEAGULL_CLICKHOUSE_SEND_RECEIVE_TIMEOUT_SECONDS: ${SEAGULL_CLICKHOUSE_SEND_RECEIVE_TIMEOUT_SECONDS:-5}
      SEAGULL_CLICKHOUSE_PING_TTL_SECONDS: ${SEAGULL_CLICKHOUSE_PING_TTL_SECONDS:-2}
      SEAGULL_CLICKHOUSE_EVENTS_TABLE: ${SEAGULL_CLICKHOUSE_EVENTS_TABLE:-net_events_raw}
      SEAGULL_CLICKHOUSE_EVENTS_RETENTION_DAYS: ${SEAGULL_CLICKHOUSE_EVENTS_RETENTION_DAYS:-30}
      SEAGULL_INGEST_MAX_BATCH: ${SEAGULL_INGEST_MAX_BATCH:-10000}
      SEAGULL_INGEST_STORM_EVENTS_PER_SECOND: ${SEAGULL_INGEST_STORM_EVENTS_PER_SECOND:-8000}
      SEAGULL_INGEST_STORM_MIN_BATCH: ${SEAGULL_INGEST_STORM_MIN_BATCH:-2500}
      SEAGULL_INGEST_STORM_TTL_SECONDS: ${SEAGULL_INGEST_STORM_TTL_SECONDS:-20}
      SEAGULL_INGEST_STORM_SAMPLE_PERCENT: ${SEAGULL_INGEST_STORM_SAMPLE_PERCENT:-2}
      SEAGULL_INGEST_ROLLUP_ALWAYS: ${SEAGULL_INGEST_ROLLUP_ALWAYS:-false}
      SEAGULL_INGEST_VALUES_PAGE_SIZE: ${SEAGULL_INGEST_VALUES_PAGE_SIZE:-1000}
      SEAGULL_INGEST_ROLLUP_PAGE_SIZE: ${SEAGULL_INGEST_ROLLUP_PAGE_SIZE:-500}
      SEAGULL_INGEST_QUEUE_KEY: ${SEAGULL_INGEST_QUEUE_KEY:-seagull:ingest:queue}
      SEAGULL_INGEST_WORKER_BATCH_MESSAGES: ${SEAGULL_INGEST_WORKER_BATCH_MESSAGES:-50}
      SEAGULL_INGEST_WORKER_IDLE_SLEEP_SECONDS: ${SEAGULL_INGEST_WORKER_IDLE_SLEEP_SECONDS:-0.25}
      SEAGULL_INGEST_BACKPRESSURE_SOFT_BACKLOG_EVENTS: ${SEAGULL_INGEST_BACKPRESSURE_SOFT_BACKLOG_EVENTS:-50000}
      SEAGULL_INGEST_BACKPRESSURE_HARD_BACKLOG_EVENTS: ${SEAGULL_INGEST_BACKPRESSURE_HARD_BACKLOG_EVENTS:-200000}
      SEAGULL_INGEST_BACKPRESSURE_MODE: ${SEAGULL_INGEST_BACKPRESSURE_MODE:-rollup_only}
      SEAGULL_INGEST_BACKPRESSURE_WARM_SAMPLE_PERCENT: ${SEAGULL_INGEST_BACKPRESSURE_WARM_SAMPLE_PERCENT:-2}
      SEAGULL_INGEST_WARM_ENABLED: ${SEAGULL_INGEST_WARM_ENABLED:-true}
      SEAGULL_INGEST_WARM_SAMPLE_PERCENT: ${SEAGULL_INGEST_WARM_SAMPLE_PERCENT:-0}
      SEAGULL_INGEST_STORM_HOT_SAMPLE_PERCENT: ${SEAGULL_INGEST_STORM_HOT_SAMPLE_PERCENT:-2}
      SEAGULL_INGEST_STORM_WARM_SAMPLE_PERCENT: ${SEAGULL_INGEST_STORM_WARM_SAMPLE_PERCENT:-5}
      SEAGULL_INGEST_STORM_ALERT_TTL_SECONDS: ${SEAGULL_INGEST_STORM_ALERT_TTL_SECONDS:-3600}
      SEAGULL_INGEST_ELEVATED_HOT_SAMPLE_PERCENT: ${SEAGULL_INGEST_ELEVATED_HOT_SAMPLE_PERCENT:-50}
      SEAGULL_INGEST_DEGRADED_HOT_SAMPLE_PERCENT: ${SEAGULL_INGEST_DEGRADED_HOT_SAMPLE_PERCENT:-5}
      SEAGULL_INGEST_CRITICAL_HOT_SAMPLE_PERCENT: ${SEAGULL_INGEST_CRITICAL_HOT_SAMPLE_PERCENT:-1}
      SEAGULL_INGEST_CLICKHOUSE_SAMPLE_PERCENT: ${SEAGULL_INGEST_CLICKHOUSE_SAMPLE_PERCENT:-100}
      SEAGULL_INGEST_DEGRADED_CLICKHOUSE_SAMPLE_PERCENT: ${SEAGULL_INGEST_DEGRADED_CLICKHOUSE_SAMPLE_PERCENT:-25}
      SEAGULL_INGEST_CRITICAL_CLICKHOUSE_SAMPLE_PERCENT: ${SEAGULL_INGEST_CRITICAL_CLICKHOUSE_SAMPLE_PERCENT:-10}
      SEAGULL_INGEST_MIN_HOT_EVENTS_PER_BATCH: ${SEAGULL_INGEST_MIN_HOT_EVENTS_PER_BATCH:-1}
      SEAGULL_INGEST_MIN_CLICKHOUSE_EVENTS_PER_BATCH: ${SEAGULL_INGEST_MIN_CLICKHOUSE_EVENTS_PER_BATCH:-32}
      SEAGULL_INGEST_RECENT_FEED_MAX_EVENTS: ${SEAGULL_INGEST_RECENT_FEED_MAX_EVENTS:-5000}
      SEAGULL_INGEST_RECENT_FEED_PER_AGENT_MAX_EVENTS: ${SEAGULL_INGEST_RECENT_FEED_PER_AGENT_MAX_EVENTS:-1000}
      SEAGULL_INGEST_RECENT_FEED_MIN_BATCH: ${SEAGULL_INGEST_RECENT_FEED_MIN_BATCH:-24}
      SEAGULL_INGEST_RECENT_FEED_LOOKBACK_SECONDS: ${SEAGULL_INGEST_RECENT_FEED_LOOKBACK_SECONDS:-900}
      SEAGULL_INGEST_RECENT_FEED_MAX_PUSH_PER_CALL: ${SEAGULL_INGEST_RECENT_FEED_MAX_PUSH_PER_CALL:-512}
      SEAGULL_MAX_EVENT_CLOCK_SKEW_SECONDS: ${SEAGULL_MAX_EVENT_CLOCK_SKEW_SECONDS:-}
      SEAGULL_RULES_ENV: ${SEAGULL_RULES_ENV:-${SEAGULL_ENV:-${SEAGULL_MODE:-dev}}}
      SEAGULL_RULES_ENABLED_PACKS: ${SEAGULL_RULES_ENABLED_PACKS:-core,network,lab}
      SEAGULL_RULES_DISABLED_PACKS: ${SEAGULL_RULES_DISABLED_PACKS:-}
      SEAGULL_RULES_INCLUDE_EXPERIMENTAL: ${SEAGULL_RULES_INCLUDE_EXPERIMENTAL:-true}
      SEAGULL_DEFAULT_AGENT_CONFIG_JSON: ${SEAGULL_DEFAULT_AGENT_CONFIG_JSON:-}
      SEAGULL_MAX_AGENT_CONFIG_BYTES: ${SEAGULL_MAX_AGENT_CONFIG_BYTES:-}
      SEAGULL_BOOTSTRAP_ADMIN_USERNAME: ${SEAGULL_BOOTSTRAP_ADMIN_USERNAME:-admin}
      SEAGULL_BOOTSTRAP_ADMIN_PASSWORD: ${SEAGULL_BOOTSTRAP_ADMIN_PASSWORD:-${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD:-}}
      SEAGULL_BOOTSTRAP_ADMIN_PASSWORD_FILE: ${SEAGULL_BOOTSTRAP_ADMIN_PASSWORD_FILE:-}
      SEAGULL_BOOTSTRAP_ADMIN_RESET_ON_START: ${SEAGULL_BOOTSTRAP_ADMIN_RESET_ON_START:-true}
      SEAGULL_BOOTSTRAP_ADMIN_SYNC_ON_START: ${SEAGULL_BOOTSTRAP_ADMIN_SYNC_ON_START:-false}
      SEAGULL_BOOTSTRAP_ADMIN_ALLOW_SYNC_ON_START: ${SEAGULL_BOOTSTRAP_ADMIN_ALLOW_SYNC_ON_START:-false}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_TTL_SECONDS: ${SEAGULL_AGENT_BOOTSTRAP_TOKEN_TTL_SECONDS:-900}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_MAX_USES: ${SEAGULL_AGENT_BOOTSTRAP_TOKEN_MAX_USES:-1}
      SEAGULL_VULN_MAX_FINDINGS_PER_INGEST: ${SEAGULL_VULN_MAX_FINDINGS_PER_INGEST:-2000}
      SEAGULL_VULN_MAX_EVIDENCE_BYTES: ${SEAGULL_VULN_MAX_EVIDENCE_BYTES:-32768}
    volumes:
      - ./rules:/app/rules:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024m
    cpus: "1.00"
    networks:
      - seagull
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "import sys,urllib.request;
