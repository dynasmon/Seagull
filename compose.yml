      - /tmp/seagull-metrics
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: "0.30"
    networks:
      - seagull
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.manager", "health", "maintenance"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Portal

  seagull-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seagull-portal
    depends_on:
      seagull-backend:
        condition: service_healthy
    ports:
      - "${SEAGULL_PORTAL_PORT:-}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "0.50"
    networks:
      - seagull
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Edge (Caddy)

  caddy:
    image: caddy:2.10-alpine
    init: true
    container_name: seagull-caddy
    depends_on:
      seagull-portal:
        condition: service_healthy
      seagull-backend:
        condition: service_healthy
    ports:
      - "${SEAGULL_EDGE_HTTP_PORT:-8081}:${SEAGULL_CADDY_HTTP_INTERNAL_PORT:-8081}"
      - "${SEAGULL_EDGE_HTTPS_PORT:-8443}:${SEAGULL_CADDY_HTTPS_INTERNAL_PORT:-8443}"
      - "${SEAGULL_AGENT_MTLS_PORT:-8444}:8444"
    environment:
      SEAGULL_CADDY_DOMAIN: ${SEAGULL_CADDY_DOMAIN:-}
      SEAGULL_CADDY_EMAIL: ${SEAGULL_CADDY_EMAIL:-}
      SEAGULL_PORTAL_INTERNAL_PORT: ${SEAGULL_PORTAL_INTERNAL_PORT:-8080}
    volumes:
      - ${SEAGULL_CADDY_CONFIG_FILE:-./infra/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${SEAGULL_TLS_CERT_FILE:-./secrets/tls/tls.crt}:/etc/seagull/tls/tls.crt:ro
      - ${SEAGULL_TLS_KEY_FILE:-./secrets/tls/tls.key}:/etc/seagull/tls/tls.key:ro
      - ${SEAGULL_AGENT_MTLS_CA_FILE:-./secrets/pki/agent-ca.crt}:/etc/seagull/mtls/agent-ca.crt:ro
      - ${SEAGULL_AGENT_MTLS_SERVER_CERT_FILE:-./secrets/pki/server/mtls.crt}:/etc/seagull/mtls/server.crt:ro
      - ${SEAGULL_AGENT_MTLS_SERVER_KEY_FILE:-./secrets/pki/server/mtls.key}:/etc/seagull/mtls/server.key:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - seagull
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          wget -q -O - --no-check-certificate
          https://${SEAGULL_CADDY_DOMAIN:-localhost}:${SEAGULL_CADDY_HTTPS_INTERNAL_PORT:-8443}/api/health/live
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Observability (optional — profile: observability)

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: seagull-kibana
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${SEAGULL_ES_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:-}}
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: ${SEAGULL_KIBANA_PUBLIC_BASE_URL:-https://localhost/kibana}
    ports:
      - "${KIBANA_PORT:-}:5601"
    networks:
      - seagull
    restart: unless-stopped

  # Internal metrics store. Scrapes Seagull services over the private `seagull`
  # network and is queried only by the backend observability API (server-side).
  # Intentionally NOT published to the host (no `ports:`) and NOT profile-gated:
  # it is core infrastructure for the native observability feature.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: seagull-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${SEAGULL_PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle
    depends_on:
      - seagull-backend
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "0.50"
    networks:
      - seagull
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
