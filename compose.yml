  seagull-maintenance-worker:
    build: ./backend
    container_name: seagull-maintenance-worker
    command: ["python", "-m", "app.workers.manager", "maintenance"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SEAGULL_ENV: ${SEAGULL_ENV:-${SEAGULL_MODE:-dev}}
      SEAGULL_DB_HOST: postgres
      SEAGULL_DB_PORT: "5432"
      SEAGULL_DB_NAME: ${POSTGRES_DB:-seagull}
      SEAGULL_DB_USER: ${POSTGRES_USER:-seagull}
      SEAGULL_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      SEAGULL_DB_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      SEAGULL_DB_AUTO_UPGRADE: ${SEAGULL_DB_AUTO_UPGRADE:-true}
      SEAGULL_JWT_SECRET: ${SEAGULL_JWT_SECRET:-${NETWATCH_JWT_SECRET:-}}
      SEAGULL_JWT_SECRET_FILE: ${SEAGULL_JWT_SECRET_FILE:-}
      SEAGULL_AUDIT_HASH_PEPPER: ${SEAGULL_AUDIT_HASH_PEPPER:-${NETWATCH_AUDIT_HASH_PEPPER:-}}
      SEAGULL_AUDIT_HASH_PEPPER_FILE: ${SEAGULL_AUDIT_HASH_PEPPER_FILE:-}
      SEAGULL_AUDIT_RETENTION_ENABLED: ${SEAGULL_AUDIT_RETENTION_ENABLED:-true}
      SEAGULL_AUDIT_RETENTION_DAYS: ${SEAGULL_AUDIT_RETENTION_DAYS:-30}
      SEAGULL_LOGIN_AUDIT_RETENTION_DAYS: ${SEAGULL_LOGIN_AUDIT_RETENTION_DAYS:-30}
      SEAGULL_GOVERNANCE_RETENTION_DAYS: ${SEAGULL_GOVERNANCE_RETENTION_DAYS:-30}
      SEAGULL_AUDIT_RETENTION_EVERY_SECONDS: ${SEAGULL_AUDIT_RETENTION_EVERY_SECONDS:-3600}
      SEAGULL_AUDIT_RETENTION_DELETE_BATCH: ${SEAGULL_AUDIT_RETENTION_DELETE_BATCH:-5000}
      SEAGULL_MAINTENANCE_ENABLE_BOOTSTRAP_ROTATOR: ${SEAGULL_MAINTENANCE_ENABLE_BOOTSTRAP_ROTATOR:-false}
      SEAGULL_BOOTSTRAP_ADMIN_USERNAME: ${SEAGULL_BOOTSTRAP_ADMIN_USERNAME:-admin}
      SEAGULL_BOOTSTRAP_ADMIN_PASSWORD: ${SEAGULL_BOOTSTRAP_ADMIN_PASSWORD:-${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD:-}}
      SEAGULL_BOOTSTRAP_ROTATOR_EDGE_BASE: ${SEAGULL_BOOTSTRAP_ROTATOR_EDGE_BASE:-}
      SEAGULL_BOOTSTRAP_ROTATOR_BACKEND_BASE: ${SEAGULL_BOOTSTRAP_ROTATOR_BACKEND_BASE:-http://seagull-backend:8000}
      SEAGULL_BOOTSTRAP_ROTATOR_AGENT_IDS: ${SEAGULL_BOOTSTRAP_ROTATOR_AGENT_IDS:-agent-core-1,agent-sensor-1,agent-lateral-1,agent-proc-1,agent-scan-1,agent-ddos-1,agent-vuln-1}
      SEAGULL_BOOTSTRAP_ROTATOR_TOKEN_TTL_SECONDS: ${SEAGULL_BOOTSTRAP_ROTATOR_TOKEN_TTL_SECONDS:-2592000}
      SEAGULL_BOOTSTRAP_ROTATOR_TOKEN_MAX_USES: ${SEAGULL_BOOTSTRAP_ROTATOR_TOKEN_MAX_USES:-5}
      SEAGULL_BOOTSTRAP_ROTATOR_EVERY_SECONDS: ${SEAGULL_BOOTSTRAP_ROTATOR_EVERY_SECONDS:-900}
      SEAGULL_BOOTSTRAP_ROTATOR_REFRESH_BEFORE_SECONDS: ${SEAGULL_BOOTSTRAP_ROTATOR_REFRESH_BEFORE_SECONDS:-86400}
      SEAGULL_BOOTSTRAP_ROTATOR_OUTPUT_DIR: ${SEAGULL_BOOTSTRAP_ROTATOR_OUTPUT_DIR:-/etc/seagull/bootstrap}
      SEAGULL_BOOTSTRAP_ROTATOR_STATE_DIR: ${SEAGULL_BOOTSTRAP_ROTATOR_STATE_DIR:-/var/lib/seagull/bootstrap-rotator}
      # Observability: group manager exposes aggregated child metrics on :9100.
      PROMETHEUS_MULTIPROC_DIR: /tmp/seagull-metrics
      SEAGULL_METRICS_ENABLED: ${SEAGULL_METRICS_ENABLED:-true}
      SEAGULL_WORKER_METRICS_PORT: ${SEAGULL_WORKER_METRICS_PORT:-9100}
    volumes:
      - ./scripts/pki/agent_bootstrap_token_rotator.py:/scripts/agent_bootstrap_token_rotator.py:ro
      - ./secrets/bootstrap:/etc/seagull/bootstrap
      - ./secrets/runtime:/var/lib/seagull
