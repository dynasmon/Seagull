services:
  netwatch-edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      netwatch-portal:
        condition: service_healthy
      netwatch-backend:
        condition: service_healthy
    ports:
      - "${NETWATCH_EDGE_HTTP_PORT:-80}:8081"
      - "${NETWATCH_EDGE_HTTPS_PORT:-443}:8443"
    volumes:
      - ./infra/nginx/edge.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NETWATCH_TLS_CERT_FILE:-./secrets/tls/tls.crt}:/etc/netwatch/tls/tls.crt:ro
      - ${NETWATCH_TLS_KEY_FILE:-./secrets/tls/tls.key}:/etc/netwatch/tls/tls.key:ro
      - ${NETWATCH_AGENT_CA_CERT_FILE:-./secrets/agent-ca/ca.crt}:/etc/netwatch/agent-ca/ca.crt:ro
      - ${NETWATCH_AGENT_CA_CRL_FILE:-./secrets/agent-ca/ca.crl}:/etc/netwatch/agent-ca/ca.crl:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - netwatch
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netwatch123}

  redis:
    environment:
      NETWATCH_REDIS_PASSWORD: ${NETWATCH_REDIS_PASSWORD:-}

  elasticsearch:
    ports: []
    environment:
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${NETWATCH_ES_PASSWORD:-netwatch_es_change_me_123}

  kibana:
    ports: []
    environment:
      ELASTICSEARCH_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${NETWATCH_ES_PASSWORD:-netwatch_es_change_me_123}
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: ${NETWATCH_KIBANA_PUBLIC_BASE_URL:-https://localhost/kibana}

  netwatch-backend:
    ports: []
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_RULES_ENV: prod
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}
      NETWATCH_COOKIE_SECURE: "true"
      NETWATCH_ENABLE_HSTS: "true"
      NETWATCH_TRUST_PROXY_HEADERS: "true"
      NETWATCH_TRUSTED_PROXY_CIDRS: ${NETWATCH_TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1,::1}
      NETWATCH_ALLOWED_HOSTS: ${NETWATCH_ALLOWED_HOSTS_PROD:-localhost,127.0.0.1}
      NETWATCH_AUDIT_HASH_PEPPER: ${NETWATCH_AUDIT_HASH_PEPPER:-}
      NETWATCH_AUDIT_RETENTION_ENABLED: "true"
      NETWATCH_AUDIT_RETENTION_DAYS: ${NETWATCH_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_LOGIN_AUDIT_RETENTION_DAYS: ${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_GOVERNANCE_RETENTION_DAYS: ${NETWATCH_GOVERNANCE_RETENTION_DAYS_PROD:-365}
      NETWATCH_AUDIT_RETENTION_EVERY_SECONDS: ${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}
      NETWATCH_AUDIT_RETENTION_DELETE_BATCH: ${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch123}
      NETWATCH_JWT_SECRET: ${NETWATCH_JWT_SECRET:-change_me_dev_jwt_secret_at_least_32_chars_long}
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD: ${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD:-change_me_dev_bootstrap_admin_password_123}
      NETWATCH_BOOTSTRAP_ADMIN_RESET_ON_START: "false"
      NETWATCH_REDIS_PASSWORD: ${NETWATCH_REDIS_PASSWORD:-}
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      NETWATCH_ES_PASSWORD: ${NETWATCH_ES_PASSWORD:-netwatch_es_change_me_123}

  netwatch-ingest-worker:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_RULES_ENV: prod
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch123}
      NETWATCH_REDIS_PASSWORD: ${NETWATCH_REDIS_PASSWORD:-}
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      NETWATCH_ES_PASSWORD: ${NETWATCH_ES_PASSWORD:-netwatch_es_change_me_123}

  netwatch-audit-retention:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch123}
      NETWATCH_JWT_SECRET: ${NETWATCH_JWT_SECRET:-change_me_dev_jwt_secret_at_least_32_chars_long}
      NETWATCH_AUDIT_HASH_PEPPER: ${NETWATCH_AUDIT_HASH_PEPPER:-}
      NETWATCH_AUDIT_RETENTION_ENABLED: "true"
      NETWATCH_AUDIT_RETENTION_DAYS: ${NETWATCH_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_LOGIN_AUDIT_RETENTION_DAYS: ${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_GOVERNANCE_RETENTION_DAYS: ${NETWATCH_GOVERNANCE_RETENTION_DAYS_PROD:-365}
      NETWATCH_AUDIT_RETENTION_EVERY_SECONDS: ${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}
      NETWATCH_AUDIT_RETENTION_DELETE_BATCH: ${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}

  netwatch-rules-worker:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch123}

  netwatch-es-indexer:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch123}
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      NETWATCH_ES_PASSWORD: ${NETWATCH_ES_PASSWORD:-netwatch_es_change_me_123}

  netwatch-rollup-worker:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch123}

  netwatch-ip-intel:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch123}

  netwatch-proto-intel:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch123}

  netwatch-attack-chain:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch123}

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-change_me_dev_grafana_password_123}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netwatch123}

  netwatch-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: []
    environment: {}
    volumes: []
