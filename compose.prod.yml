services:
  caddy:
    image: caddy:2.10-alpine
    container_name: seagull-caddy
    depends_on:
      seagull-portal:
        condition: service_healthy
      seagull-backend:
        condition: service_healthy
    ports:
      - "${SEAGULL_EDGE_HTTP_PORT:-${NETWATCH_EDGE_HTTP_PORT:-80}}:80"
      - "${SEAGULL_EDGE_HTTPS_PORT:-${NETWATCH_EDGE_HTTPS_PORT:-443}}:443"
    environment:
      SEAGULL_CADDY_DOMAIN: ${SEAGULL_CADDY_DOMAIN:-${NETWATCH_CADDY_DOMAIN:?set SEAGULL_CADDY_DOMAIN in .env}}
      SEAGULL_CADDY_EMAIL: ${SEAGULL_CADDY_EMAIL:-${NETWATCH_CADDY_EMAIL:-}}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - seagull
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seagull}
      POSTGRES_USER: ${POSTGRES_USER:-seagull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_PASSWORD_FILE: ""

  redis:
    environment:
      SEAGULL_REDIS_PASSWORD: ${SEAGULL_REDIS_PASSWORD:-${NETWATCH_REDIS_PASSWORD:-}}
      SEAGULL_REDIS_PASSWORD_FILE: ${SEAGULL_REDIS_PASSWORD_FILE:-${NETWATCH_REDIS_PASSWORD_FILE:-}}
      SEAGULL_REDIS_CONFIG_FILE: /etc/seagull/redis/redis.prod.conf
      SEAGULL_REDIS_STRICT_PASSWORD: "true"
    stop_grace_period: 1m

  elasticsearch:
    ports: []
    environment:
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:?set SEAGULL_ES_PASSWORD in .env}}
      ELASTIC_PASSWORD_FILE: ""

  kibana:
    ports: []
    environment:
      ELASTICSEARCH_USERNAME: ${SEAGULL_ES_USERNAME:-${NETWATCH_ES_USERNAME:-elastic}}
      ELASTICSEARCH_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:?set SEAGULL_ES_PASSWORD in .env}}
      ELASTICSEARCH_PASSWORD_FILE: ""
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: ${SEAGULL_KIBANA_PUBLIC_BASE_URL:-${NETWATCH_KIBANA_PUBLIC_BASE_URL:-https://localhost/kibana}}

  seagull-backend:
    ports: []
    environment:
      SEAGULL_ENV: prod
      SEAGULL_DB_AUTO_UPGRADE: ${SEAGULL_DB_AUTO_UPGRADE_PROD:-${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}}
      SEAGULL_RULES_ENV: prod
      SEAGULL_RULES_ENABLED_PACKS: ${SEAGULL_RULES_ENABLED_PACKS:-${NETWATCH_RULES_ENABLED_PACKS:-core,network}}
      SEAGULL_RULES_INCLUDE_EXPERIMENTAL: ${SEAGULL_RULES_INCLUDE_EXPERIMENTAL:-${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}}
      SEAGULL_COOKIE_SECURE: "true"
      SEAGULL_ENABLE_HSTS: "true"
      SEAGULL_TRUST_PROXY_HEADERS: "true"
      SEAGULL_TRUSTED_PROXY_CIDRS: ${SEAGULL_TRUSTED_PROXY_CIDRS:-${NETWATCH_TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1,::1}}
      SEAGULL_ALLOWED_HOSTS: ${SEAGULL_ALLOWED_HOSTS_PROD:-${NETWATCH_ALLOWED_HOSTS_PROD:-localhost,127.0.0.1}}
      SEAGULL_AUDIT_HASH_PEPPER: ${SEAGULL_AUDIT_HASH_PEPPER:-${NETWATCH_AUDIT_HASH_PEPPER:-}}
      SEAGULL_AUDIT_HASH_PEPPER_FILE: ""
      SEAGULL_AUDIT_RETENTION_ENABLED: "true"
      SEAGULL_AUDIT_RETENTION_DAYS: ${SEAGULL_AUDIT_RETENTION_DAYS_PROD:-${NETWATCH_AUDIT_RETENTION_DAYS_PROD:-365}}
      SEAGULL_LOGIN_AUDIT_RETENTION_DAYS: ${SEAGULL_LOGIN_AUDIT_RETENTION_DAYS_PROD:-${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS_PROD:-365}}
      SEAGULL_GOVERNANCE_RETENTION_DAYS: ${SEAGULL_GOVERNANCE_RETENTION_DAYS_PROD:-${NETWATCH_GOVERNANCE_RETENTION_DAYS_PROD:-365}}
      SEAGULL_AUDIT_RETENTION_EVERY_SECONDS: ${SEAGULL_AUDIT_RETENTION_EVERY_SECONDS:-${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}}
      SEAGULL_AUDIT_RETENTION_DELETE_BATCH: ${SEAGULL_AUDIT_RETENTION_DELETE_BATCH:-${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}}
      SEAGULL_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SEAGULL_DB_PASSWORD_FILE: ""
      SEAGULL_JWT_SECRET: ${SEAGULL_JWT_SECRET:-${NETWATCH_JWT_SECRET:?set SEAGULL_JWT_SECRET in .env}}
      SEAGULL_JWT_SECRET_FILE: ""
      SEAGULL_JWT_ISSUER: ${SEAGULL_JWT_ISSUER:-${NETWATCH_JWT_ISSUER:-seagull-backend}}
      SEAGULL_JWT_AUDIENCE: ${SEAGULL_JWT_AUDIENCE:-${NETWATCH_JWT_AUDIENCE:-seagull-portal}}
      SEAGULL_AUTH_OTP_ENABLED: ${SEAGULL_AUTH_OTP_ENABLED_PROD:-${NETWATCH_AUTH_OTP_ENABLED_PROD:-false}}
      SEAGULL_BOOTSTRAP_ADMIN_PASSWORD: ${SEAGULL_BOOTSTRAP_ADMIN_PASSWORD:-${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD:?set SEAGULL_BOOTSTRAP_ADMIN_PASSWORD in .env}}
      SEAGULL_BOOTSTRAP_ADMIN_PASSWORD_FILE: ""
      SEAGULL_BOOTSTRAP_ADMIN_RESET_ON_START: "false"
      SEAGULL_BOOTSTRAP_ADMIN_SYNC_ON_START: "false"
      SEAGULL_BOOTSTRAP_ADMIN_ALLOW_SYNC_ON_START: "false"
      SEAGULL_ES_USERNAME: ${SEAGULL_ES_USERNAME:-${NETWATCH_ES_USERNAME:-elastic}}
      SEAGULL_ES_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:?set SEAGULL_ES_PASSWORD in .env}}
      SEAGULL_ES_PASSWORD_FILE: ""
      SEAGULL_CLICKHOUSE_REQUIRED: "true"

  seagull-ingest-pipeline:
    environment:
      SEAGULL_ENV: prod
      SEAGULL_DB_AUTO_UPGRADE: ${SEAGULL_DB_AUTO_UPGRADE_PROD:-${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}}
      SEAGULL_RULES_ENV: prod
      SEAGULL_RULES_ENABLED_PACKS: ${SEAGULL_RULES_ENABLED_PACKS:-${NETWATCH_RULES_ENABLED_PACKS:-core,network}}
      SEAGULL_RULES_INCLUDE_EXPERIMENTAL: ${SEAGULL_RULES_INCLUDE_EXPERIMENTAL:-${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}}
      SEAGULL_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SEAGULL_DB_PASSWORD_FILE: ""
      SEAGULL_ES_USERNAME: ${SEAGULL_ES_USERNAME:-${NETWATCH_ES_USERNAME:-elastic}}
      SEAGULL_ES_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:?set SEAGULL_ES_PASSWORD in .env}}
      SEAGULL_ES_PASSWORD_FILE: ""
      SEAGULL_CLICKHOUSE_REQUIRED: "true"

  seagull-intelligence-worker:
    environment:
      SEAGULL_ENV: prod
      SEAGULL_DB_AUTO_UPGRADE: ${SEAGULL_DB_AUTO_UPGRADE_PROD:-${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}}
      SEAGULL_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SEAGULL_DB_PASSWORD_FILE: ""
      SEAGULL_RULES_ENV: prod
      SEAGULL_RULES_ENABLED_PACKS: ${SEAGULL_RULES_ENABLED_PACKS:-${NETWATCH_RULES_ENABLED_PACKS:-core,network}}
      SEAGULL_RULES_INCLUDE_EXPERIMENTAL: ${SEAGULL_RULES_INCLUDE_EXPERIMENTAL:-${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}}

  seagull-maintenance-worker:
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      seagull-backend:
        condition: service_healthy
    environment:
      SEAGULL_ENV: prod
      SEAGULL_DB_AUTO_UPGRADE: ${SEAGULL_DB_AUTO_UPGRADE_PROD:-${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}}
      SEAGULL_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SEAGULL_DB_PASSWORD_FILE: ""
      SEAGULL_JWT_SECRET: ${SEAGULL_JWT_SECRET:-${NETWATCH_JWT_SECRET:?set SEAGULL_JWT_SECRET in .env}}
      SEAGULL_JWT_SECRET_FILE: ""
      SEAGULL_AUDIT_HASH_PEPPER: ${SEAGULL_AUDIT_HASH_PEPPER:-${NETWATCH_AUDIT_HASH_PEPPER:-}}
      SEAGULL_AUDIT_HASH_PEPPER_FILE: ""
      SEAGULL_AUDIT_RETENTION_ENABLED: "true"
      SEAGULL_AUDIT_RETENTION_DAYS: ${SEAGULL_AUDIT_RETENTION_DAYS_PROD:-${NETWATCH_AUDIT_RETENTION_DAYS_PROD:-365}}
      SEAGULL_LOGIN_AUDIT_RETENTION_DAYS: ${SEAGULL_LOGIN_AUDIT_RETENTION_DAYS_PROD:-${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS_PROD:-365}}
      SEAGULL_GOVERNANCE_RETENTION_DAYS: ${SEAGULL_GOVERNANCE_RETENTION_DAYS_PROD:-${NETWATCH_GOVERNANCE_RETENTION_DAYS_PROD:-365}}
      SEAGULL_AUDIT_RETENTION_EVERY_SECONDS: ${SEAGULL_AUDIT_RETENTION_EVERY_SECONDS:-${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}}
      SEAGULL_AUDIT_RETENTION_DELETE_BATCH: ${SEAGULL_AUDIT_RETENTION_DELETE_BATCH:-${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}}
      SEAGULL_MAINTENANCE_ENABLE_BOOTSTRAP_ROTATOR: "true"
      SEAGULL_BOOTSTRAP_ADMIN_USERNAME: ${SEAGULL_BOOTSTRAP_ADMIN_USERNAME:-${NETWATCH_BOOTSTRAP_ADMIN_USERNAME:-admin}}
      SEAGULL_BOOTSTRAP_ADMIN_PASSWORD: ${SEAGULL_BOOTSTRAP_ADMIN_PASSWORD:-${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD:?set SEAGULL_BOOTSTRAP_ADMIN_PASSWORD in .env}}
      SEAGULL_BOOTSTRAP_ROTATOR_EDGE_BASE: ${SEAGULL_BOOTSTRAP_ROTATOR_EDGE_BASE:-${NETWATCH_BOOTSTRAP_ROTATOR_EDGE_BASE:-}}
      SEAGULL_BOOTSTRAP_ROTATOR_BACKEND_BASE: ${SEAGULL_BOOTSTRAP_ROTATOR_BACKEND_BASE:-${NETWATCH_BOOTSTRAP_ROTATOR_BACKEND_BASE:-http://seagull-backend:8000}}
      SEAGULL_BOOTSTRAP_ROTATOR_AGENT_IDS: ${SEAGULL_BOOTSTRAP_ROTATOR_AGENT_IDS:-${NETWATCH_BOOTSTRAP_ROTATOR_AGENT_IDS:-agent-core-1,agent-sensor-1,agent-lateral-1,agent-proc-1,agent-scan-1,agent-ddos-1,agent-vuln-1}}
      SEAGULL_BOOTSTRAP_ROTATOR_TOKEN_TTL_SECONDS: ${SEAGULL_BOOTSTRAP_ROTATOR_TOKEN_TTL_SECONDS:-${NETWATCH_BOOTSTRAP_ROTATOR_TOKEN_TTL_SECONDS:-2592000}}
      SEAGULL_BOOTSTRAP_ROTATOR_TOKEN_MAX_USES: ${SEAGULL_BOOTSTRAP_ROTATOR_TOKEN_MAX_USES:-${NETWATCH_BOOTSTRAP_ROTATOR_TOKEN_MAX_USES:-5}}
      SEAGULL_BOOTSTRAP_ROTATOR_EVERY_SECONDS: ${SEAGULL_BOOTSTRAP_ROTATOR_EVERY_SECONDS:-${NETWATCH_BOOTSTRAP_ROTATOR_EVERY_SECONDS:-900}}
      SEAGULL_BOOTSTRAP_ROTATOR_REFRESH_BEFORE_SECONDS: ${SEAGULL_BOOTSTRAP_ROTATOR_REFRESH_BEFORE_SECONDS:-${NETWATCH_BOOTSTRAP_ROTATOR_REFRESH_BEFORE_SECONDS:-86400}}
      SEAGULL_BOOTSTRAP_ROTATOR_OUTPUT_DIR: /etc/seagull/bootstrap
      SEAGULL_BOOTSTRAP_ROTATOR_STATE_DIR: /var/lib/seagull/bootstrap-rotator
    volumes:
      - ./scripts/pki/agent_bootstrap_token_rotator.py:/scripts/agent_bootstrap_token_rotator.py:ro
      - ./secrets/bootstrap:/etc/seagull/bootstrap
      - ./secrets/runtime:/var/lib/seagull

  grafana:
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-change_me_dev_grafana_password_123}
      GF_SECURITY_ADMIN_PASSWORD__FILE: ""
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_PASSWORD_FILE: ""

  seagull-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: []
    environment: {}
    volumes: []

  seagull-agent-core:
    depends_on:
      seagull-backend:
        condition: service_healthy
      seagull-maintenance-worker:
        condition: service_healthy
    environment:
      SEAGULL_FORCE_ENROLL_ON_START: "true"
      SEAGULL_API_URL: ${SEAGULL_API_URL_PROD:-https://127.0.0.1:${SEAGULL_EDGE_HTTPS_PORT:-${NETWATCH_EDGE_HTTPS_PORT:-443}}/agent}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ""
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/seagull/bootstrap/${AGENT_CORE_ID:-agent-core-1}.token
      SEAGULL_AGENT_CREDENTIAL_FILE: /var/lib/seagull/agent.credential
    volumes:
      - /var/log:/host/var/log:ro
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - agent-core-state:/var/lib/seagull
      - /:/host:ro

  seagull-agent-sensor:
    depends_on:
      seagull-backend:
        condition: service_healthy
      seagull-maintenance-worker:
        condition: service_healthy
    environment:
      SEAGULL_FORCE_ENROLL_ON_START: "true"
      SEAGULL_API_URL: ${SEAGULL_API_URL_PROD:-https://127.0.0.1:${SEAGULL_EDGE_HTTPS_PORT:-${NETWATCH_EDGE_HTTPS_PORT:-443}}/agent}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ""
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/seagull/bootstrap/${AGENT_SENSOR_ID:-agent-sensor-1}.token
      SEAGULL_AGENT_CREDENTIAL_FILE: /var/lib/seagull/agent.credential
    volumes:
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - agent-sensor-state:/var/lib/seagull

  seagull-agent-lateral:
    depends_on:
      seagull-backend:
        condition: service_healthy
      seagull-maintenance-worker:
        condition: service_healthy
    environment:
      SEAGULL_FORCE_ENROLL_ON_START: "true"
      SEAGULL_API_URL: ${SEAGULL_API_URL_PROD:-https://127.0.0.1:${SEAGULL_EDGE_HTTPS_PORT:-${NETWATCH_EDGE_HTTPS_PORT:-443}}/agent}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ""
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/seagull/bootstrap/${AGENT_LATERAL_ID:-agent-lateral-1}.token
      SEAGULL_AGENT_CREDENTIAL_FILE: /var/lib/seagull/agent.credential
    volumes:
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - agent-lateral-state:/var/lib/seagull

  seagull-agent-proc:
    profiles: ["legacy-agents"]
    depends_on:
      seagull-backend:
        condition: service_healthy
      seagull-maintenance-worker:
        condition: service_healthy
    environment:
      SEAGULL_FORCE_ENROLL_ON_START: "true"
      SEAGULL_API_URL: ${SEAGULL_API_URL_PROD:-https://127.0.0.1:${SEAGULL_EDGE_HTTPS_PORT:-${NETWATCH_EDGE_HTTPS_PORT:-443}}/agent}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ""
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/seagull/bootstrap/${AGENT_PROC_ID:-agent-proc-1}.token
      SEAGULL_AGENT_CREDENTIAL_FILE: /var/lib/seagull/agent.credential
    volumes:
      - /var/log:/host/var/log:ro
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - agent-proc-state:/var/lib/seagull

  seagull-agent-scan:
    profiles: ["legacy-agents"]
    depends_on:
      seagull-backend:
        condition: service_healthy
      seagull-maintenance-worker:
        condition: service_healthy
    environment:
      SEAGULL_FORCE_ENROLL_ON_START: "true"
      SEAGULL_API_URL: ${SEAGULL_API_URL_PROD:-https://127.0.0.1:${SEAGULL_EDGE_HTTPS_PORT:-${NETWATCH_EDGE_HTTPS_PORT:-443}}/agent}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ""
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/seagull/bootstrap/${AGENT_SCAN_ID:-agent-scan-1}.token
      SEAGULL_AGENT_CREDENTIAL_FILE: /var/lib/seagull/agent.credential
    volumes:
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - agent-scan-state:/var/lib/seagull

  seagull-agent-ddos:
    profiles: ["legacy-agents"]
    depends_on:
      seagull-backend:
        condition: service_healthy
      seagull-maintenance-worker:
        condition: service_healthy
    environment:
      SEAGULL_FORCE_ENROLL_ON_START: "true"
      SEAGULL_API_URL: ${SEAGULL_API_URL_PROD:-https://127.0.0.1:${SEAGULL_EDGE_HTTPS_PORT:-${NETWATCH_EDGE_HTTPS_PORT:-443}}/agent}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ""
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/seagull/bootstrap/${AGENT_DDOS_ID:-agent-ddos-1}.token
      SEAGULL_AGENT_CREDENTIAL_FILE: /var/lib/seagull/agent.credential
    volumes:
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - agent-ddos-state:/var/lib/seagull

  seagull-agent-vuln:
    profiles: ["legacy-agents"]
    depends_on:
      seagull-backend:
        condition: service_healthy
      seagull-maintenance-worker:
        condition: service_healthy
    environment:
      SEAGULL_FORCE_ENROLL_ON_START: "true"
      SEAGULL_API_URL: ${SEAGULL_API_URL_PROD:-https://127.0.0.1:${SEAGULL_EDGE_HTTPS_PORT:-${NETWATCH_EDGE_HTTPS_PORT:-443}}/agent}
      SEAGULL_AGENT_BOOTSTRAP_TOKEN: ""
      SEAGULL_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/seagull/bootstrap/${AGENT_VULN_ID:-agent-vuln-1}.token
      SEAGULL_AGENT_CREDENTIAL_FILE: /var/lib/seagull/agent.credential
    volumes:
      - ./secrets/bootstrap:/etc/seagull/bootstrap:ro
      - agent-vuln-state:/var/lib/seagull
      - /:/host:ro

volumes:
  caddy-data:
  caddy-config:
