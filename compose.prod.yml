services:
  netwatch-step-ca:
    image: smallstep/step-ca:0.27.4
    container_name: netwatch-step-ca
    user: "0:0"
    environment:
      STEPPATH: /var/lib/step
      NETWATCH_STEP_CA_URL: ${NETWATCH_STEP_CA_URL:-https://netwatch-step-ca:9000}
      NETWATCH_STEP_CA_PROVISIONER: ${NETWATCH_STEP_CA_PROVISIONER:-netwatch-provisioner}
      NETWATCH_STEP_CA_PASSWORD_FILE: /etc/netwatch/step-ca/ca-password.txt
      NETWATCH_STEP_CA_PROVISIONER_PASSWORD_FILE: /etc/netwatch/step-ca/provisioner-password.txt
      NETWATCH_STEP_CA_DNS_NAMES: ${NETWATCH_STEP_CA_DNS_NAMES:-netwatch-step-ca,localhost,netwatch-edge}
    command: ["/bin/sh", "/scripts/stepca_boot.sh"]
    volumes:
      - ./scripts/pki/stepca_boot.sh:/scripts/stepca_boot.sh:ro
      - ./secrets/step-ca:/etc/netwatch/step-ca:ro
      - ./secrets/step-ca/data:/var/lib/step
    healthcheck:
      test: ["CMD-SHELL", "step ca health --ca-url https://localhost:9000 --root /var/lib/step/certs/root_ca.crt >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.50"
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-step-ca-issuer:
    image: smallstep/step-cli:0.27.4
    container_name: netwatch-step-ca-issuer
    user: "0:0"
    depends_on:
      netwatch-step-ca:
        condition: service_healthy
    environment:
      NETWATCH_STEP_CA_URL: ${NETWATCH_STEP_CA_URL:-https://netwatch-step-ca:9000}
      NETWATCH_STEP_CA_PROVISIONER: ${NETWATCH_STEP_CA_PROVISIONER:-netwatch-provisioner}
      NETWATCH_STEP_CA_PROVISIONER_PASSWORD_FILE: /etc/netwatch/step-ca/provisioner-password.txt
      NETWATCH_STEP_CA_ROOT_SOURCE: /var/lib/step/certs/root_ca.crt
      NETWATCH_STEP_CA_AGENT_IDS: ${NETWATCH_STEP_CA_AGENT_IDS:-agent-core-1,agent-sensor-1,agent-lateral-1,agent-proc-1,agent-scan-1,agent-ddos-1,agent-vuln-1}
      NETWATCH_EDGE_CERT_CN: ${NETWATCH_AGENT_TLS_SERVER_NAME:-localhost}
      NETWATCH_EDGE_CERT_SANS: ${NETWATCH_EDGE_CERT_SANS:-localhost,netwatch-edge,127.0.0.1}
      NETWATCH_STEP_CA_RENEW_EVERY_SECONDS: ${NETWATCH_STEP_CA_RENEW_EVERY_SECONDS:-21600}
      NETWATCH_STEP_CA_RENEW_BEFORE_SECONDS: ${NETWATCH_STEP_CA_RENEW_BEFORE_SECONDS:-43200}
    command: ["/bin/sh", "/scripts/stepca_issue_runtime_certs.sh"]
    volumes:
      - ./scripts/pki/stepca_issue_runtime_certs.sh:/scripts/stepca_issue_runtime_certs.sh:ro
      - ./scripts/pki/check_pki_health.sh:/scripts/check_pki_health.sh:ro
      - ./secrets/step-ca:/etc/netwatch/step-ca:ro
      - ./secrets/step-ca/data:/var/lib/step:ro
      - netwatch-pki:/var/lib/netwatch/pki
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/bin/sh /scripts/check_pki_health.sh",
        ]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-edge-reloader:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: netwatch-edge-reloader
    user: "0:0"
    pid: "service:netwatch-edge"
    depends_on:
      netwatch-edge:
        condition: service_started
      netwatch-step-ca-issuer:
        condition: service_healthy
    environment:
      NETWATCH_EDGE_RELOAD_CHECK_SECONDS: ${NETWATCH_EDGE_RELOAD_CHECK_SECONDS:-15}
    command: ["/bin/sh", "/scripts/edge_cert_reloader.sh"]
    volumes:
      - ./scripts/pki/edge_cert_reloader.sh:/scripts/edge_cert_reloader.sh:ro
      - ./infra/nginx/edge.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - netwatch-pki:/etc/netwatch/pki:ro
    cap_drop:
      - ALL
    cap_add:
      - KILL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/netwatch-edge-reloader/current.sha256 && kill -0 1"]
      interval: 15s
      timeout: 4s
      retries: 10
      start_period: 20s
    mem_limit: 64m
    cpus: "0.10"
    networks:
      - netwatch
    restart: unless-stopped

  netwatch-edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      netwatch-portal:
        condition: service_healthy
      netwatch-backend:
        condition: service_healthy
      netwatch-step-ca-issuer:
        condition: service_healthy
    ports:
      - "${NETWATCH_EDGE_HTTP_PORT:-80}:8081"
      - "${NETWATCH_EDGE_HTTPS_PORT:-443}:8443"
    volumes:
      - ./infra/nginx/edge.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - netwatch-pki:/etc/netwatch/pki:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - netwatch
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netwatch}
      POSTGRES_USER: ${POSTGRES_USER:-netwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_PASSWORD_FILE: ""

  redis:
    environment:
      NETWATCH_REDIS_PASSWORD: ${NETWATCH_REDIS_PASSWORD:?set NETWATCH_REDIS_PASSWORD in .env}
      NETWATCH_REDIS_PASSWORD_FILE: ""

  elasticsearch:
    ports: []
    environment:
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${NETWATCH_ES_PASSWORD:?set NETWATCH_ES_PASSWORD in .env}
      ELASTIC_PASSWORD_FILE: ""

  kibana:
    ports: []
    environment:
      ELASTICSEARCH_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${NETWATCH_ES_PASSWORD:?set NETWATCH_ES_PASSWORD in .env}
      ELASTICSEARCH_PASSWORD_FILE: ""
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: ${NETWATCH_KIBANA_PUBLIC_BASE_URL:-https://localhost/kibana}

  netwatch-backend:
    ports: []
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_RULES_ENV: prod
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}
      NETWATCH_COOKIE_SECURE: "true"
      NETWATCH_ENABLE_HSTS: "true"
      NETWATCH_TRUST_PROXY_HEADERS: "true"
      NETWATCH_TRUSTED_PROXY_CIDRS: ${NETWATCH_TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1,::1}
      NETWATCH_ALLOWED_HOSTS: ${NETWATCH_ALLOWED_HOSTS_PROD:-localhost,127.0.0.1}
      NETWATCH_AUDIT_HASH_PEPPER: ${NETWATCH_AUDIT_HASH_PEPPER:-}
      NETWATCH_AUDIT_HASH_PEPPER_FILE: ""
      NETWATCH_AUDIT_RETENTION_ENABLED: "true"
      NETWATCH_AUDIT_RETENTION_DAYS: ${NETWATCH_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_LOGIN_AUDIT_RETENTION_DAYS: ${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_GOVERNANCE_RETENTION_DAYS: ${NETWATCH_GOVERNANCE_RETENTION_DAYS_PROD:-365}
      NETWATCH_AUDIT_RETENTION_EVERY_SECONDS: ${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}
      NETWATCH_AUDIT_RETENTION_DELETE_BATCH: ${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""
      NETWATCH_JWT_SECRET: ${NETWATCH_JWT_SECRET:?set NETWATCH_JWT_SECRET in .env}
      NETWATCH_JWT_SECRET_FILE: ""
      NETWATCH_JWT_ISSUER: ${NETWATCH_JWT_ISSUER:-netwatch-backend}
      NETWATCH_JWT_AUDIENCE: ${NETWATCH_JWT_AUDIENCE:-netwatch-portal}
      NETWATCH_AUTH_OTP_ENABLED: ${NETWATCH_AUTH_OTP_ENABLED_PROD:-false}
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD: ${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD:?set NETWATCH_BOOTSTRAP_ADMIN_PASSWORD in .env}
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD_FILE: ""
      NETWATCH_BOOTSTRAP_ADMIN_RESET_ON_START: "false"
      NETWATCH_BOOTSTRAP_ADMIN_SYNC_ON_START: "false"
      NETWATCH_BOOTSTRAP_ADMIN_ALLOW_SYNC_ON_START: "false"
      NETWATCH_REDIS_PASSWORD: ${NETWATCH_REDIS_PASSWORD:?set NETWATCH_REDIS_PASSWORD in .env}
      NETWATCH_REDIS_PASSWORD_FILE: ""
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      NETWATCH_ES_PASSWORD: ${NETWATCH_ES_PASSWORD:?set NETWATCH_ES_PASSWORD in .env}
      NETWATCH_ES_PASSWORD_FILE: ""

  netwatch-ingest-worker:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_RULES_ENV: prod
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""
      NETWATCH_REDIS_PASSWORD: ${NETWATCH_REDIS_PASSWORD:?set NETWATCH_REDIS_PASSWORD in .env}
      NETWATCH_REDIS_PASSWORD_FILE: ""
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      NETWATCH_ES_PASSWORD: ${NETWATCH_ES_PASSWORD:?set NETWATCH_ES_PASSWORD in .env}
      NETWATCH_ES_PASSWORD_FILE: ""

  netwatch-audit-retention:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""
      NETWATCH_JWT_SECRET: ${NETWATCH_JWT_SECRET:?set NETWATCH_JWT_SECRET in .env}
      NETWATCH_JWT_SECRET_FILE: ""
      NETWATCH_AUDIT_HASH_PEPPER: ${NETWATCH_AUDIT_HASH_PEPPER:-}
      NETWATCH_AUDIT_HASH_PEPPER_FILE: ""
      NETWATCH_AUDIT_RETENTION_ENABLED: "true"
      NETWATCH_AUDIT_RETENTION_DAYS: ${NETWATCH_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_LOGIN_AUDIT_RETENTION_DAYS: ${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_GOVERNANCE_RETENTION_DAYS: ${NETWATCH_GOVERNANCE_RETENTION_DAYS_PROD:-365}
      NETWATCH_AUDIT_RETENTION_EVERY_SECONDS: ${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}
      NETWATCH_AUDIT_RETENTION_DELETE_BATCH: ${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}

  netwatch-rules-worker:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""

  netwatch-es-indexer:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      NETWATCH_ES_PASSWORD: ${NETWATCH_ES_PASSWORD:?set NETWATCH_ES_PASSWORD in .env}
      NETWATCH_ES_PASSWORD_FILE: ""

  netwatch-rollup-worker:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""

  netwatch-ip-intel:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""

  netwatch-proto-intel:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""

  netwatch-attack-chain:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-change_me_dev_grafana_password_123}
      GF_SECURITY_ADMIN_PASSWORD__FILE: ""
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_PASSWORD_FILE: ""

  netwatch-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: []
    environment: {}
    volumes: []

  netwatch-agent-bootstrap-rotator:
    build: ./backend
    container_name: netwatch-agent-bootstrap-rotator
    user: "0:0"
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-step-ca-issuer:
        condition: service_healthy
    environment:
      NETWATCH_BOOTSTRAP_ADMIN_USERNAME: ${NETWATCH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD: ${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD:?set NETWATCH_BOOTSTRAP_ADMIN_PASSWORD in .env}
      NETWATCH_BOOTSTRAP_ROTATOR_CA_FILE: /etc/netwatch/pki/root_ca.crt
      NETWATCH_BOOTSTRAP_ROTATOR_EDGE_BASE: ${NETWATCH_BOOTSTRAP_ROTATOR_EDGE_BASE:-https://netwatch-edge:8443}
      NETWATCH_BOOTSTRAP_ROTATOR_BACKEND_BASE: ${NETWATCH_BOOTSTRAP_ROTATOR_BACKEND_BASE:-http://netwatch-backend:8000}
      NETWATCH_BOOTSTRAP_ROTATOR_AGENT_IDS: ${NETWATCH_BOOTSTRAP_ROTATOR_AGENT_IDS:-agent-core-1,agent-sensor-1,agent-lateral-1,agent-proc-1,agent-scan-1,agent-ddos-1,agent-vuln-1}
      NETWATCH_BOOTSTRAP_ROTATOR_TOKEN_TTL_SECONDS: ${NETWATCH_BOOTSTRAP_ROTATOR_TOKEN_TTL_SECONDS:-2592000}
      NETWATCH_BOOTSTRAP_ROTATOR_TOKEN_MAX_USES: ${NETWATCH_BOOTSTRAP_ROTATOR_TOKEN_MAX_USES:-5}
      NETWATCH_BOOTSTRAP_ROTATOR_EVERY_SECONDS: ${NETWATCH_BOOTSTRAP_ROTATOR_EVERY_SECONDS:-900}
      NETWATCH_BOOTSTRAP_ROTATOR_REFRESH_BEFORE_SECONDS: ${NETWATCH_BOOTSTRAP_ROTATOR_REFRESH_BEFORE_SECONDS:-86400}
      NETWATCH_BOOTSTRAP_ROTATOR_OUTPUT_DIR: /etc/netwatch/bootstrap
      NETWATCH_BOOTSTRAP_ROTATOR_STATE_DIR: /var/lib/netwatch/bootstrap-rotator
    command:
      - python
      - /scripts/agent_bootstrap_token_rotator.py
    volumes:
      - ./scripts/pki/agent_bootstrap_token_rotator.py:/scripts/agent_bootstrap_token_rotator.py:ro
      - ./secrets/bootstrap:/etc/netwatch/bootstrap
      - ./secrets/runtime:/var/lib/netwatch
      - netwatch-pki:/etc/netwatch/pki:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - netwatch
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "from pathlib import Path; import sys,time; p=Path('/var/lib/netwatch/bootstrap-rotator/last_success_at');
          sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 3600 else 1)"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  netwatch-agent-core:
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-step-ca-issuer:
        condition: service_healthy
      netwatch-agent-bootstrap-rotator:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_CORE_ID:-agent-core-1}.token
      NETWATCH_TLS_CA_FILE: /etc/netwatch/pki/root_ca.crt
      NETWATCH_TLS_CERT_FILE: /etc/netwatch/pki/agents/${AGENT_CORE_ID:-agent-core-1}/tls.crt
      NETWATCH_TLS_KEY_FILE: /etc/netwatch/pki/agents/${AGENT_CORE_ID:-agent-core-1}/tls.key
      NETWATCH_TLS_WAIT_TIMEOUT: ${NETWATCH_TLS_WAIT_TIMEOUT:-120s}
      NETWATCH_TLS_CA_SOURCE_FILE: ""
      NETWATCH_TLS_CERT_SOURCE_FILE: ""
      NETWATCH_TLS_KEY_SOURCE_FILE: ""
    volumes:
      - /var/log:/host/var/log:ro
      - ./secrets/bootstrap:/etc/netwatch/bootstrap:ro
      - agent-core-state:/var/lib/netwatch
      - /:/host:ro
      - netwatch-pki:/etc/netwatch/pki:ro

  netwatch-agent-sensor:
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-step-ca-issuer:
        condition: service_healthy
      netwatch-agent-bootstrap-rotator:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_SENSOR_ID:-agent-sensor-1}.token
      NETWATCH_TLS_CA_FILE: /etc/netwatch/pki/root_ca.crt
      NETWATCH_TLS_CERT_FILE: /etc/netwatch/pki/agents/${AGENT_SENSOR_ID:-agent-sensor-1}/tls.crt
      NETWATCH_TLS_KEY_FILE: /etc/netwatch/pki/agents/${AGENT_SENSOR_ID:-agent-sensor-1}/tls.key
      NETWATCH_TLS_WAIT_TIMEOUT: ${NETWATCH_TLS_WAIT_TIMEOUT:-120s}
      NETWATCH_TLS_CA_SOURCE_FILE: ""
      NETWATCH_TLS_CERT_SOURCE_FILE: ""
      NETWATCH_TLS_KEY_SOURCE_FILE: ""
    volumes:
      - ./secrets/bootstrap:/etc/netwatch/bootstrap:ro
      - agent-sensor-state:/var/lib/netwatch
      - netwatch-pki:/etc/netwatch/pki:ro

  netwatch-agent-lateral:
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-step-ca-issuer:
        condition: service_healthy
      netwatch-agent-bootstrap-rotator:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_LATERAL_ID:-agent-lateral-1}.token
      NETWATCH_TLS_CA_FILE: /etc/netwatch/pki/root_ca.crt
      NETWATCH_TLS_CERT_FILE: /etc/netwatch/pki/agents/${AGENT_LATERAL_ID:-agent-lateral-1}/tls.crt
      NETWATCH_TLS_KEY_FILE: /etc/netwatch/pki/agents/${AGENT_LATERAL_ID:-agent-lateral-1}/tls.key
      NETWATCH_TLS_WAIT_TIMEOUT: ${NETWATCH_TLS_WAIT_TIMEOUT:-120s}
      NETWATCH_TLS_CA_SOURCE_FILE: ""
      NETWATCH_TLS_CERT_SOURCE_FILE: ""
      NETWATCH_TLS_KEY_SOURCE_FILE: ""
    volumes:
      - ./secrets/bootstrap:/etc/netwatch/bootstrap:ro
      - agent-lateral-state:/var/lib/netwatch
      - netwatch-pki:/etc/netwatch/pki:ro

  netwatch-agent-proc:
    profiles: ["legacy-agents"]
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-step-ca-issuer:
        condition: service_healthy
      netwatch-agent-bootstrap-rotator:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_PROC_ID:-agent-proc-1}.token
      NETWATCH_TLS_CA_FILE: /etc/netwatch/pki/root_ca.crt
      NETWATCH_TLS_CERT_FILE: /etc/netwatch/pki/agents/${AGENT_PROC_ID:-agent-proc-1}/tls.crt
      NETWATCH_TLS_KEY_FILE: /etc/netwatch/pki/agents/${AGENT_PROC_ID:-agent-proc-1}/tls.key
      NETWATCH_TLS_WAIT_TIMEOUT: ${NETWATCH_TLS_WAIT_TIMEOUT:-120s}
      NETWATCH_TLS_CA_SOURCE_FILE: ""
      NETWATCH_TLS_CERT_SOURCE_FILE: ""
      NETWATCH_TLS_KEY_SOURCE_FILE: ""
    volumes:
      - /var/log:/host/var/log:ro
      - ./secrets/bootstrap:/etc/netwatch/bootstrap:ro
      - agent-proc-state:/var/lib/netwatch
      - netwatch-pki:/etc/netwatch/pki:ro

  netwatch-agent-scan:
    profiles: ["legacy-agents"]
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-step-ca-issuer:
        condition: service_healthy
      netwatch-agent-bootstrap-rotator:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_SCAN_ID:-agent-scan-1}.token
      NETWATCH_TLS_CA_FILE: /etc/netwatch/pki/root_ca.crt
      NETWATCH_TLS_CERT_FILE: /etc/netwatch/pki/agents/${AGENT_SCAN_ID:-agent-scan-1}/tls.crt
      NETWATCH_TLS_KEY_FILE: /etc/netwatch/pki/agents/${AGENT_SCAN_ID:-agent-scan-1}/tls.key
      NETWATCH_TLS_WAIT_TIMEOUT: ${NETWATCH_TLS_WAIT_TIMEOUT:-120s}
      NETWATCH_TLS_CA_SOURCE_FILE: ""
      NETWATCH_TLS_CERT_SOURCE_FILE: ""
