secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password.txt}
  grafana_admin_password:
    file: ${GF_SECURITY_ADMIN_PASSWORD_FILE:-./secrets/grafana_admin_password.txt}
  netwatch_jwt_secret:
    file: ${NETWATCH_JWT_SECRET_FILE:-./secrets/netwatch_jwt_secret.txt}
  netwatch_bootstrap_admin_password:
    file: ${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD_FILE:-./secrets/netwatch_bootstrap_admin_password.txt}
  netwatch_redis_password:
    file: ${NETWATCH_REDIS_PASSWORD_FILE:-./secrets/netwatch_redis_password.txt}
  netwatch_es_password:
    file: ${NETWATCH_ES_PASSWORD_FILE:-./secrets/netwatch_es_password.txt}
  netwatch_audit_hash_pepper:
    file: ${NETWATCH_AUDIT_HASH_PEPPER_FILE:-./secrets/netwatch_audit_hash_pepper.txt}

services:
  netwatch-edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      netwatch-portal:
        condition: service_healthy
      netwatch-backend:
        condition: service_healthy
    ports:
      - "${NETWATCH_EDGE_HTTP_PORT:-80}:8081"
      - "${NETWATCH_EDGE_HTTPS_PORT:-443}:8443"
    volumes:
      - ./infra/nginx/edge.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NETWATCH_TLS_CERT_FILE:-./secrets/tls/tls.crt}:/etc/netwatch/tls/tls.crt:ro
      - ${NETWATCH_TLS_KEY_FILE:-./secrets/tls/tls.key}:/etc/netwatch/tls/tls.key:ro
      - ${NETWATCH_AGENT_CA_CERT_FILE:-./secrets/agent-ca/ca.crt}:/etc/netwatch/agent-ca/ca.crt:ro
      - ${NETWATCH_AGENT_CA_CRL_FILE:-./secrets/agent-ca/ca.crl}:/etc/netwatch/agent-ca/ca.crl:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - netwatch
    restart: unless-stopped

  postgres:
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  redis:
    secrets:
      - netwatch_redis_password
    environment:
      NETWATCH_REDIS_PASSWORD: ""
      NETWATCH_REDIS_PASSWORD_FILE: /run/secrets/netwatch_redis_password

  elasticsearch:
    secrets:
      - netwatch_es_password
    ports: []
    environment:
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD_FILE: /run/secrets/netwatch_es_password

  kibana:
    secrets:
      - netwatch_es_password
    ports: []
    environment:
      ELASTICSEARCH_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD_FILE: /run/secrets/netwatch_es_password
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: ${NETWATCH_KIBANA_PUBLIC_BASE_URL:-https://localhost/kibana}

  netwatch-backend:
    secrets:
      - postgres_password
      - netwatch_jwt_secret
      - netwatch_bootstrap_admin_password
      - netwatch_redis_password
      - netwatch_es_password
      - netwatch_audit_hash_pepper
    ports: []
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: "false"
      NETWATCH_RULES_ENV: prod
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}
      NETWATCH_COOKIE_SECURE: "true"
      NETWATCH_ENABLE_HSTS: "true"
      NETWATCH_TRUST_PROXY_HEADERS: "true"
      NETWATCH_TRUSTED_PROXY_CIDRS: ${NETWATCH_TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1,::1}
      NETWATCH_ALLOWED_HOSTS: ${NETWATCH_ALLOWED_HOSTS:-localhost,127.0.0.1}
      NETWATCH_AUDIT_HASH_PEPPER: ""
      NETWATCH_AUDIT_HASH_PEPPER_FILE: /run/secrets/netwatch_audit_hash_pepper
      NETWATCH_AUDIT_RETENTION_ENABLED: "true"
      NETWATCH_AUDIT_RETENTION_DAYS: ${NETWATCH_AUDIT_RETENTION_DAYS:-365}
      NETWATCH_LOGIN_AUDIT_RETENTION_DAYS: ${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS:-365}
      NETWATCH_GOVERNANCE_RETENTION_DAYS: ${NETWATCH_GOVERNANCE_RETENTION_DAYS:-365}
      NETWATCH_AUDIT_RETENTION_EVERY_SECONDS: ${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}
      NETWATCH_AUDIT_RETENTION_DELETE_BATCH: ${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}
      NETWATCH_DB_PASSWORD: ""
      NETWATCH_DB_PASSWORD_FILE: /run/secrets/postgres_password
      NETWATCH_JWT_SECRET: ""
      NETWATCH_JWT_SECRET_FILE: /run/secrets/netwatch_jwt_secret
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD: ""
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/netwatch_bootstrap_admin_password
      NETWATCH_BOOTSTRAP_ADMIN_RESET_ON_START: "false"
      NETWATCH_REDIS_PASSWORD: ""
      NETWATCH_REDIS_PASSWORD_FILE: /run/secrets/netwatch_redis_password
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      NETWATCH_ES_PASSWORD: ""
      NETWATCH_ES_PASSWORD_FILE: /run/secrets/netwatch_es_password

  netwatch-ingest-worker:
    secrets:
      - postgres_password
      - netwatch_redis_password
      - netwatch_es_password
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: "false"
      NETWATCH_RULES_ENV: prod
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}
      NETWATCH_DB_PASSWORD: ""
      NETWATCH_DB_PASSWORD_FILE: /run/secrets/postgres_password
      NETWATCH_REDIS_PASSWORD: ""
      NETWATCH_REDIS_PASSWORD_FILE: /run/secrets/netwatch_redis_password
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      NETWATCH_ES_PASSWORD: ""
      NETWATCH_ES_PASSWORD_FILE: /run/secrets/netwatch_es_password

  netwatch-audit-retention:
    secrets:
      - postgres_password
      - netwatch_jwt_secret
      - netwatch_audit_hash_pepper
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: "false"
      NETWATCH_DB_PASSWORD: ""
      NETWATCH_DB_PASSWORD_FILE: /run/secrets/postgres_password
      NETWATCH_JWT_SECRET: ""
      NETWATCH_JWT_SECRET_FILE: /run/secrets/netwatch_jwt_secret
      NETWATCH_AUDIT_HASH_PEPPER: ""
      NETWATCH_AUDIT_HASH_PEPPER_FILE: /run/secrets/netwatch_audit_hash_pepper
      NETWATCH_AUDIT_RETENTION_ENABLED: "true"
      NETWATCH_AUDIT_RETENTION_DAYS: ${NETWATCH_AUDIT_RETENTION_DAYS:-365}
      NETWATCH_LOGIN_AUDIT_RETENTION_DAYS: ${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS:-365}
      NETWATCH_GOVERNANCE_RETENTION_DAYS: ${NETWATCH_GOVERNANCE_RETENTION_DAYS:-365}
      NETWATCH_AUDIT_RETENTION_EVERY_SECONDS: ${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}
      NETWATCH_AUDIT_RETENTION_DELETE_BATCH: ${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}

  netwatch-rules-worker:
    secrets:
      - postgres_password
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: "false"
      NETWATCH_DB_PASSWORD: ""
      NETWATCH_DB_PASSWORD_FILE: /run/secrets/postgres_password

  netwatch-es-indexer:
    secrets:
      - postgres_password
      - netwatch_es_password
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: "false"
      NETWATCH_DB_PASSWORD: ""
      NETWATCH_DB_PASSWORD_FILE: /run/secrets/postgres_password
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      NETWATCH_ES_PASSWORD: ""
      NETWATCH_ES_PASSWORD_FILE: /run/secrets/netwatch_es_password

  netwatch-rollup-worker:
    secrets:
      - postgres_password
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: "false"
      NETWATCH_DB_PASSWORD: ""
      NETWATCH_DB_PASSWORD_FILE: /run/secrets/postgres_password

  netwatch-ip-intel:
    secrets:
      - postgres_password
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: "false"
      NETWATCH_DB_PASSWORD: ""
      NETWATCH_DB_PASSWORD_FILE: /run/secrets/postgres_password

  netwatch-proto-intel:
    secrets:
      - postgres_password
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: "false"
      NETWATCH_DB_PASSWORD: ""
      NETWATCH_DB_PASSWORD_FILE: /run/secrets/postgres_password

  netwatch-attack-chain:
    secrets:
      - postgres_password
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: "false"
      NETWATCH_DB_PASSWORD: ""
      NETWATCH_DB_PASSWORD_FILE: /run/secrets/postgres_password

  grafana:
    secrets:
      - postgres_password
      - grafana_admin_password
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ""
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  netwatch-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: []
    environment: {}
    volumes: []
