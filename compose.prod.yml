name: seagull-prod

networks:
  seagull:
    driver: bridge

volumes:
  es01-data:
  es02-data:
  es03-data:
  es-snapshots:
  postgres-data:
  postgres-replica-1-data:
  postgres-replica-2-data:
  redis-data:
  redpanda-1-data:
  redpanda-2-data:
  redpanda-3-data:

x-es-node-env: &es-node-env
  cluster.name: ${SEAGULL_PROD_ES_CLUSTER_NAME:-seagull-es}
  discovery.seed_hosts: es01,es02,es03
  cluster.initial_master_nodes: es01,es02,es03
  node.roles: ${SEAGULL_PROD_ES_NODE_ROLES:-master,data_hot,data_content,data_warm,data_cold,ingest}
  path.repo: /usr/share/elasticsearch/snapshots
  bootstrap.memory_lock: ${SEAGULL_PROD_ES_MEMORY_LOCK:-true}
  xpack.security.enabled: ${SEAGULL_PROD_ES_SECURITY_ENABLED:-false}
  xpack.security.http.ssl.enabled: "false"
  xpack.ml.enabled: "false"
  ES_JAVA_OPTS: "-Xms${SEAGULL_PROD_ES_HEAP:-2g} -Xmx${SEAGULL_PROD_ES_HEAP:-2g}"
  ELASTIC_PASSWORD: ${SEAGULL_ES_PASSWORD:-${NETWATCH_ES_PASSWORD:-}}

x-redpanda-node: &redpanda-node
  image: redpandadata/redpanda:${SEAGULL_REDPANDA_VERSION:-v24.2.20}
  networks:
    - seagull
  healthcheck:
    test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' >/dev/null 2>&1"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s
  mem_limit: ${SEAGULL_PROD_REDPANDA_MEM_LIMIT:-2g}
  restart: unless-stopped

x-pg-replica: &pg-replica
  image: postgres:16-alpine
  user: postgres
  entrypoint: ["/bin/sh", "/usr/local/bin/seagull-replica-start.sh"]
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - seagull
  healthcheck:
    test:
      - "CMD-SHELL"
      - >-
        psql -h /var/run/postgresql -U "${POSTGRES_USER:-seagull}" -d "${POSTGRES_DB:-seagull}" -tAc 'SELECT 1' >/dev/null 2>&1
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 40s
  restart: unless-stopped

x-pg-replica-env: &pg-replica-env
  PGDATA: /var/lib/postgresql/data
  POSTGRES_USER: ${POSTGRES_USER:-seagull}
  POSTGRES_DB: ${POSTGRES_DB:-seagull}
  POSTGRES_REPLICATION_USER: ${SEAGULL_PG_REPLICATION_USER:-replicator}
  POSTGRES_REPLICATION_PASSWORD: ${SEAGULL_PG_REPLICATION_PASSWORD:-${POSTGRES_PASSWORD:-}}
  SEAGULL_PG_PRIMARY_HOST: postgres
  SEAGULL_PG_PRIMARY_PORT: "5432"
  SEAGULL_PG_SHARED_BUFFERS: ${SEAGULL_PG_SHARED_BUFFERS:-128MB}
  SEAGULL_PG_MAX_CONNECTIONS: ${SEAGULL_PROD_PG_MAX_CONNECTIONS:-300}

x-es-node: &es-node
  image: docker.elastic.co/elasticsearch/elasticsearch:${SEAGULL_PROD_ES_VERSION:-8.13.4}
  depends_on:
    es-snapshots-init:
      condition: service_completed_successfully
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65536
      hard: 65536
  mem_limit: ${SEAGULL_PROD_ES_MEM_LIMIT:-4g}
  networks:
    - seagull
  healthcheck:
    test:
      - "CMD-SHELL"
      - >-
        ES_PASS="${SEAGULL_ES_PASSWORD:-}";
        if [ -n "$$ES_PASS" ] && [ "${SEAGULL_PROD_ES_SECURITY_ENABLED:-false}" = "true" ]; then
          curl -fsS -u "elastic:$$ES_PASS" "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s" >/dev/null;
        else
          curl -fsS "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s" >/dev/null;
        fi
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s
  restart: unless-stopped

services:

  # Elasticsearch cluster

  es-snapshots-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:${SEAGULL_PROD_ES_VERSION:-8.13.4}
    container_name: seagull-prod-es-snapshots-init
    user: root
    entrypoint: ["sh", "-c", "chown -R 1000:0 /usr/share/elasticsearch/snapshots && chmod 0770 /usr/share/elasticsearch/snapshots"]
    volumes:
      - es-snapshots:/usr/share/elasticsearch/snapshots
    networks:
      - seagull
    restart: "no"

  es01:
    <<: *es-node
    container_name: seagull-prod-es01
    environment:
      <<: *es-node-env
      node.name: es01
    volumes:
      - es01-data:/usr/share/elasticsearch/data
      - es-snapshots:/usr/share/elasticsearch/snapshots
    ports:
      - "${SEAGULL_PROD_ES01_PORT:-127.0.0.1:9201}:9200"

  es02:
    <<: *es-node
    container_name: seagull-prod-es02
    environment:
      <<: *es-node-env
      node.name: es02
    volumes:
      - es02-data:/usr/share/elasticsearch/data
      - es-snapshots:/usr/share/elasticsearch/snapshots
    ports:
      - "${SEAGULL_PROD_ES02_PORT:-127.0.0.1:9202}:9200"

  es03:
    <<: *es-node
    container_name: seagull-prod-es03
    environment:
      <<: *es-node-env
      node.name: es03
    volumes:
      - es03-data:/usr/share/elasticsearch/data
      - es-snapshots:/usr/share/elasticsearch/snapshots
    ports:
      - "${SEAGULL_PROD_ES03_PORT:-127.0.0.1:9203}:9200"

  # Redpanda cluster

  redpanda-1:
    <<: *redpanda-node
    container_name: seagull-prod-redpanda-1
    command:
      - redpanda
      - start
      - --smp=${SEAGULL_PROD_REDPANDA_SMP:-1}
      - --memory=${SEAGULL_PROD_REDPANDA_MEMORY:-1536M}
      - --reserve-memory=0M
      - --set=redpanda.empty_seed_starts_cluster=false
      - --seeds=redpanda-1:33145,redpanda-2:33145,redpanda-3:33145
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda-1:9092,external://127.0.0.1:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda-1:33145
    volumes:
      - redpanda-1-data:/var/lib/redpanda/data
    ports:
      - "${SEAGULL_PROD_REDPANDA1_PORT:-127.0.0.1:19092}:19092"
      - "${SEAGULL_PROD_REDPANDA1_ADMIN_PORT:-127.0.0.1:19644}:9644"

  redpanda-2:
    <<: *redpanda-node
    container_name: seagull-prod-redpanda-2
    command:
      - redpanda
      - start
      - --smp=${SEAGULL_PROD_REDPANDA_SMP:-1}
      - --memory=${SEAGULL_PROD_REDPANDA_MEMORY:-1536M}
      - --reserve-memory=0M
      - --set=redpanda.empty_seed_starts_cluster=false
      - --seeds=redpanda-1:33145,redpanda-2:33145,redpanda-3:33145
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda-2:9092,external://127.0.0.1:19093
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda-2:33145
    volumes:
      - redpanda-2-data:/var/lib/redpanda/data
    ports:
      - "${SEAGULL_PROD_REDPANDA2_PORT:-127.0.0.1:19093}:19092"
      - "${SEAGULL_PROD_REDPANDA2_ADMIN_PORT:-127.0.0.1:19645}:9644"

  redpanda-3:
    <<: *redpanda-node
    container_name: seagull-prod-redpanda-3
    command:
      - redpanda
      - start
      - --smp=${SEAGULL_PROD_REDPANDA_SMP:-1}
      - --memory=${SEAGULL_PROD_REDPANDA_MEMORY:-1536M}
      - --reserve-memory=0M
      - --set=redpanda.empty_seed_starts_cluster=false
      - --seeds=redpanda-1:33145,redpanda-2:33145,redpanda-3:33145
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda-3:9092,external://127.0.0.1:19094
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda-3:33145
    volumes:
      - redpanda-3-data:/var/lib/redpanda/data
    ports:
      - "${SEAGULL_PROD_REDPANDA3_PORT:-127.0.0.1:19094}:19092"
      - "${SEAGULL_PROD_REDPANDA3_ADMIN_PORT:-127.0.0.1:19646}:9644"

  redpanda-provision:
    extends:
      file: compose.yml
      service: redpanda-provision
    container_name: seagull-prod-redpanda-provision
    depends_on: !override
      redpanda-1:
        condition: service_healthy
      redpanda-2:
        condition: service_healthy
      redpanda-3:
        condition: service_healthy
    environment:
      SEAGULL_REDPANDA_BROKERS: ${SEAGULL_PROD_REDPANDA_BROKERS:-redpanda-1:9092,redpanda-2:9092,redpanda-3:9092}
      SEAGULL_REDPANDA_TOPIC_REPLICATION: ${SEAGULL_PROD_REDPANDA_TOPIC_REPLICATION:-3}

  # Application

  postgres:
    extends:
      file: compose.yml
      service: postgres
    container_name: seagull-prod-postgres
    command: !override
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${SEAGULL_PG_SHARED_BUFFERS:-128MB}
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=${SEAGULL_PROD_PG_MAX_WAL_SENDERS:-10}
      - -c
      - max_replication_slots=${SEAGULL_PROD_PG_MAX_REPLICATION_SLOTS:-10}
      - -c
      - max_slot_wal_keep_size=${SEAGULL_PROD_PG_MAX_SLOT_WAL_KEEP_SIZE:-2GB}
      - -c
      - max_connections=${SEAGULL_PROD_PG_MAX_CONNECTIONS:-300}
      - -c
      - synchronous_commit=${SEAGULL_PROD_PG_SYNCHRONOUS_COMMIT:-on}
    environment:
      POSTGRES_REPLICATION_USER: ${SEAGULL_PG_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${SEAGULL_PG_REPLICATION_PASSWORD:-${POSTGRES_PASSWORD:-}}
      POSTGRES_REPLICATION_SLOTS: ${SEAGULL_PROD_PG_REPLICATION_SLOTS:-seagull_replica_1,seagull_replica_2}
    volumes:
      - ./infra/postgres/primary-replication-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports:
      - "${SEAGULL_PROD_PG_PORT:-127.0.0.1:5440}:5432"

  postgres-replica-1:
    <<: *pg-replica
    container_name: seagull-prod-postgres-replica-1
    environment:
      <<: *pg-replica-env
      SEAGULL_PG_REPLICATION_SLOT: seagull_replica_1
    volumes:
      - postgres-replica-1-data:/var/lib/postgresql/data
      - ./infra/postgres/replica-start.sh:/usr/local/bin/seagull-replica-start.sh:ro
    ports:
      - "${SEAGULL_PROD_PG_REPLICA1_PORT:-127.0.0.1:5441}:5432"

  postgres-replica-2:
    <<: *pg-replica
    container_name: seagull-prod-postgres-replica-2
    environment:
      <<: *pg-replica-env
      SEAGULL_PG_REPLICATION_SLOT: seagull_replica_2
    volumes:
      - postgres-replica-2-data:/var/lib/postgresql/data
      - ./infra/postgres/replica-start.sh:/usr/local/bin/seagull-replica-start.sh:ro
    ports:
      - "${SEAGULL_PROD_PG_REPLICA2_PORT:-127.0.0.1:5442}:5432"

  redis:
    extends:
      file: compose.yml
      service: redis
    container_name: seagull-prod-redis

  seagull-backend:
    extends:
      file: compose.yml
      service: seagull-backend
    container_name: seagull-prod-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: !override
      - "${SEAGULL_PROD_BACKEND_PORT:-127.0.0.1:18000}:8000"
    environment:
      SEAGULL_ES_URL: ${SEAGULL_PROD_ES_URL:-http://es01:9200,http://es02:9200,http://es03:9200}
      SEAGULL_ES_EXPECTED_STATUS: ${SEAGULL_PROD_ES_EXPECTED_STATUS:-green}
      SEAGULL_ES_YELLOW_ALERT_MINUTES: ${SEAGULL_ES_YELLOW_ALERT_MINUTES:-15}
      SEAGULL_REDPANDA_BROKERS: ${SEAGULL_PROD_REDPANDA_BROKERS:-redpanda-1:9092,redpanda-2:9092,redpanda-3:9092}
      SEAGULL_CLICKHOUSE_ENABLED: "false"
      SEAGULL_PROMETHEUS_ENABLED: "false"
      SEAGULL_DB_REPLICA_HOSTS: ${SEAGULL_PROD_DB_REPLICA_HOSTS:-postgres-replica-1:5432,postgres-replica-2:5432}
      SEAGULL_DB_READ_ROUTES: ${SEAGULL_DB_READ_ROUTES:-}
      SEAGULL_DB_POOL_SIZE: ${SEAGULL_PROD_DB_POOL_SIZE:-20}
      SEAGULL_DB_MAX_OVERFLOW: ${SEAGULL_PROD_DB_MAX_OVERFLOW:-10}
      SEAGULL_DB_READ_POOL_SIZE: ${SEAGULL_PROD_DB_READ_POOL_SIZE:-50}
      SEAGULL_DB_READ_MAX_OVERFLOW: ${SEAGULL_PROD_DB_READ_MAX_OVERFLOW:-10}

  seagull-ingest-pipeline:
    extends:
      file: compose.yml
      service: seagull-ingest-pipeline
    container_name: seagull-prod-ingest-pipeline
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      es01:
        condition: service_healthy
    environment:
      SEAGULL_ES_URL: ${SEAGULL_PROD_ES_URL:-http://es01:9200,http://es02:9200,http://es03:9200}
      SEAGULL_REDPANDA_BROKERS: ${SEAGULL_PROD_REDPANDA_BROKERS:-redpanda-1:9092,redpanda-2:9092,redpanda-3:9092}
      SEAGULL_ES_BOOTSTRAP: "true"
      SEAGULL_ES_NUMBER_OF_SHARDS: ${SEAGULL_PROD_ES_NUMBER_OF_SHARDS:-3}
      SEAGULL_ES_NUMBER_OF_REPLICAS: ${SEAGULL_PROD_ES_NUMBER_OF_REPLICAS:-1}
      SEAGULL_ES_ILM_WARM_SHRINK_SHARDS: ${SEAGULL_PROD_ES_ILM_WARM_SHRINK_SHARDS:-1}
      SEAGULL_ES_TIER_PREFERENCE: ${SEAGULL_PROD_ES_TIER_PREFERENCE:-data_hot}
      SEAGULL_ES_ILM_MIGRATE_ENABLED: ${SEAGULL_PROD_ES_ILM_MIGRATE_ENABLED:-true}
      SEAGULL_CLICKHOUSE_ENABLED: "false"
