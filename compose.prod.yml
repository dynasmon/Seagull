services:
  caddy:
    image: caddy:2.10-alpine
    container_name: netwatch-caddy
    depends_on:
      netwatch-portal:
        condition: service_healthy
      netwatch-backend:
        condition: service_healthy
    ports:
      - "${NETWATCH_EDGE_HTTP_PORT:-80}:80"
      - "${NETWATCH_EDGE_HTTPS_PORT:-443}:443"
    environment:
      NETWATCH_CADDY_DOMAIN: ${NETWATCH_CADDY_DOMAIN:?set NETWATCH_CADDY_DOMAIN in .env}
      NETWATCH_CADDY_EMAIL: ${NETWATCH_CADDY_EMAIL:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - netwatch
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netwatch}
      POSTGRES_USER: ${POSTGRES_USER:-netwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_PASSWORD_FILE: ""

  redis:
    environment:
      NETWATCH_REDIS_PASSWORD: ${NETWATCH_REDIS_PASSWORD:-}
      NETWATCH_REDIS_PASSWORD_FILE: ${NETWATCH_REDIS_PASSWORD_FILE:-}
      NETWATCH_REDIS_CONFIG_FILE: /etc/netwatch/redis/redis.prod.conf
      NETWATCH_REDIS_STRICT_PASSWORD: "true"
    stop_grace_period: 1m

  elasticsearch:
    ports: []
    environment:
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${NETWATCH_ES_PASSWORD:?set NETWATCH_ES_PASSWORD in .env}
      ELASTIC_PASSWORD_FILE: ""

  kibana:
    ports: []
    environment:
      ELASTICSEARCH_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${NETWATCH_ES_PASSWORD:?set NETWATCH_ES_PASSWORD in .env}
      ELASTICSEARCH_PASSWORD_FILE: ""
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: ${NETWATCH_KIBANA_PUBLIC_BASE_URL:-https://localhost/kibana}

  netwatch-backend:
    ports: []
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_RULES_ENV: prod
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}
      NETWATCH_COOKIE_SECURE: "true"
      NETWATCH_ENABLE_HSTS: "true"
      NETWATCH_TRUST_PROXY_HEADERS: "true"
      NETWATCH_TRUSTED_PROXY_CIDRS: ${NETWATCH_TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1,::1}
      NETWATCH_ALLOWED_HOSTS: ${NETWATCH_ALLOWED_HOSTS_PROD:-localhost,127.0.0.1}
      NETWATCH_AUDIT_HASH_PEPPER: ${NETWATCH_AUDIT_HASH_PEPPER:-}
      NETWATCH_AUDIT_HASH_PEPPER_FILE: ""
      NETWATCH_AUDIT_RETENTION_ENABLED: "true"
      NETWATCH_AUDIT_RETENTION_DAYS: ${NETWATCH_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_LOGIN_AUDIT_RETENTION_DAYS: ${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_GOVERNANCE_RETENTION_DAYS: ${NETWATCH_GOVERNANCE_RETENTION_DAYS_PROD:-365}
      NETWATCH_AUDIT_RETENTION_EVERY_SECONDS: ${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}
      NETWATCH_AUDIT_RETENTION_DELETE_BATCH: ${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""
      NETWATCH_JWT_SECRET: ${NETWATCH_JWT_SECRET:?set NETWATCH_JWT_SECRET in .env}
      NETWATCH_JWT_SECRET_FILE: ""
      NETWATCH_JWT_ISSUER: ${NETWATCH_JWT_ISSUER:-netwatch-backend}
      NETWATCH_JWT_AUDIENCE: ${NETWATCH_JWT_AUDIENCE:-netwatch-portal}
      NETWATCH_AUTH_OTP_ENABLED: ${NETWATCH_AUTH_OTP_ENABLED_PROD:-false}
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD: ${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD:?set NETWATCH_BOOTSTRAP_ADMIN_PASSWORD in .env}
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD_FILE: ""
      NETWATCH_BOOTSTRAP_ADMIN_RESET_ON_START: "false"
      NETWATCH_BOOTSTRAP_ADMIN_SYNC_ON_START: "false"
      NETWATCH_BOOTSTRAP_ADMIN_ALLOW_SYNC_ON_START: "false"
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      NETWATCH_ES_PASSWORD: ${NETWATCH_ES_PASSWORD:?set NETWATCH_ES_PASSWORD in .env}
      NETWATCH_ES_PASSWORD_FILE: ""
      NETWATCH_CLICKHOUSE_REQUIRED: "true"

  netwatch-ingest-pipeline:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_RULES_ENV: prod
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""
      NETWATCH_ES_USERNAME: ${NETWATCH_ES_USERNAME:-elastic}
      NETWATCH_ES_PASSWORD: ${NETWATCH_ES_PASSWORD:?set NETWATCH_ES_PASSWORD in .env}
      NETWATCH_ES_PASSWORD_FILE: ""
      NETWATCH_CLICKHOUSE_REQUIRED: "true"

  netwatch-intelligence-worker:
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""
      NETWATCH_RULES_ENV: prod
      NETWATCH_RULES_ENABLED_PACKS: ${NETWATCH_RULES_ENABLED_PACKS:-core,network}
      NETWATCH_RULES_INCLUDE_EXPERIMENTAL: ${NETWATCH_RULES_INCLUDE_EXPERIMENTAL:-false}

  netwatch-maintenance-worker:
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      netwatch-backend:
        condition: service_healthy
    environment:
      NETWATCH_ENV: prod
      NETWATCH_DB_AUTO_UPGRADE: ${NETWATCH_DB_AUTO_UPGRADE_PROD:-true}
      NETWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NETWATCH_DB_PASSWORD_FILE: ""
      NETWATCH_JWT_SECRET: ${NETWATCH_JWT_SECRET:?set NETWATCH_JWT_SECRET in .env}
      NETWATCH_JWT_SECRET_FILE: ""
      NETWATCH_AUDIT_HASH_PEPPER: ${NETWATCH_AUDIT_HASH_PEPPER:-}
      NETWATCH_AUDIT_HASH_PEPPER_FILE: ""
      NETWATCH_AUDIT_RETENTION_ENABLED: "true"
      NETWATCH_AUDIT_RETENTION_DAYS: ${NETWATCH_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_LOGIN_AUDIT_RETENTION_DAYS: ${NETWATCH_LOGIN_AUDIT_RETENTION_DAYS_PROD:-365}
      NETWATCH_GOVERNANCE_RETENTION_DAYS: ${NETWATCH_GOVERNANCE_RETENTION_DAYS_PROD:-365}
      NETWATCH_AUDIT_RETENTION_EVERY_SECONDS: ${NETWATCH_AUDIT_RETENTION_EVERY_SECONDS:-3600}
      NETWATCH_AUDIT_RETENTION_DELETE_BATCH: ${NETWATCH_AUDIT_RETENTION_DELETE_BATCH:-5000}
      NETWATCH_MAINTENANCE_ENABLE_BOOTSTRAP_ROTATOR: "true"
      NETWATCH_BOOTSTRAP_ADMIN_USERNAME: ${NETWATCH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      NETWATCH_BOOTSTRAP_ADMIN_PASSWORD: ${NETWATCH_BOOTSTRAP_ADMIN_PASSWORD:?set NETWATCH_BOOTSTRAP_ADMIN_PASSWORD in .env}
      NETWATCH_BOOTSTRAP_ROTATOR_EDGE_BASE: ${NETWATCH_BOOTSTRAP_ROTATOR_EDGE_BASE:-}
      NETWATCH_BOOTSTRAP_ROTATOR_BACKEND_BASE: ${NETWATCH_BOOTSTRAP_ROTATOR_BACKEND_BASE:-http://netwatch-backend:8000}
      NETWATCH_BOOTSTRAP_ROTATOR_AGENT_IDS: ${NETWATCH_BOOTSTRAP_ROTATOR_AGENT_IDS:-agent-core-1,agent-sensor-1,agent-lateral-1,agent-proc-1,agent-scan-1,agent-ddos-1,agent-vuln-1}
      NETWATCH_BOOTSTRAP_ROTATOR_TOKEN_TTL_SECONDS: ${NETWATCH_BOOTSTRAP_ROTATOR_TOKEN_TTL_SECONDS:-2592000}
      NETWATCH_BOOTSTRAP_ROTATOR_TOKEN_MAX_USES: ${NETWATCH_BOOTSTRAP_ROTATOR_TOKEN_MAX_USES:-5}
      NETWATCH_BOOTSTRAP_ROTATOR_EVERY_SECONDS: ${NETWATCH_BOOTSTRAP_ROTATOR_EVERY_SECONDS:-900}
      NETWATCH_BOOTSTRAP_ROTATOR_REFRESH_BEFORE_SECONDS: ${NETWATCH_BOOTSTRAP_ROTATOR_REFRESH_BEFORE_SECONDS:-86400}
      NETWATCH_BOOTSTRAP_ROTATOR_OUTPUT_DIR: /etc/netwatch/bootstrap
      NETWATCH_BOOTSTRAP_ROTATOR_STATE_DIR: /var/lib/netwatch/bootstrap-rotator
    volumes:
      - ./scripts/pki/agent_bootstrap_token_rotator.py:/scripts/agent_bootstrap_token_rotator.py:ro
      - ./secrets/bootstrap:/etc/netwatch/bootstrap
      - ./secrets/runtime:/var/lib/netwatch

  grafana:
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-change_me_dev_grafana_password_123}
      GF_SECURITY_ADMIN_PASSWORD__FILE: ""
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_PASSWORD_FILE: ""

  netwatch-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: []
    environment: {}
    volumes: []

  netwatch-agent-core:
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-maintenance-worker:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_API_URL: ${NETWATCH_API_URL_PROD:-https://127.0.0.1:${NETWATCH_EDGE_HTTPS_PORT:-443}/agent}
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_CORE_ID:-agent-core-1}.token
      NETWATCH_AGENT_CREDENTIAL_FILE: /var/lib/netwatch/agent.credential
    volumes:
      - /var/log:/host/var/log:ro
      - ./secrets/bootstrap:/etc/netwatch/bootstrap:ro
      - agent-core-state:/var/lib/netwatch
      - /:/host:ro

  netwatch-agent-sensor:
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-maintenance-worker:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_API_URL: ${NETWATCH_API_URL_PROD:-https://127.0.0.1:${NETWATCH_EDGE_HTTPS_PORT:-443}/agent}
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_SENSOR_ID:-agent-sensor-1}.token
      NETWATCH_AGENT_CREDENTIAL_FILE: /var/lib/netwatch/agent.credential
    volumes:
      - ./secrets/bootstrap:/etc/netwatch/bootstrap:ro
      - agent-sensor-state:/var/lib/netwatch

  netwatch-agent-lateral:
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-maintenance-worker:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_API_URL: ${NETWATCH_API_URL_PROD:-https://127.0.0.1:${NETWATCH_EDGE_HTTPS_PORT:-443}/agent}
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_LATERAL_ID:-agent-lateral-1}.token
      NETWATCH_AGENT_CREDENTIAL_FILE: /var/lib/netwatch/agent.credential
    volumes:
      - ./secrets/bootstrap:/etc/netwatch/bootstrap:ro
      - agent-lateral-state:/var/lib/netwatch

  netwatch-agent-proc:
    profiles: ["legacy-agents"]
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-maintenance-worker:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_API_URL: ${NETWATCH_API_URL_PROD:-https://127.0.0.1:${NETWATCH_EDGE_HTTPS_PORT:-443}/agent}
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_PROC_ID:-agent-proc-1}.token
      NETWATCH_AGENT_CREDENTIAL_FILE: /var/lib/netwatch/agent.credential
    volumes:
      - /var/log:/host/var/log:ro
      - ./secrets/bootstrap:/etc/netwatch/bootstrap:ro
      - agent-proc-state:/var/lib/netwatch

  netwatch-agent-scan:
    profiles: ["legacy-agents"]
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-maintenance-worker:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_API_URL: ${NETWATCH_API_URL_PROD:-https://127.0.0.1:${NETWATCH_EDGE_HTTPS_PORT:-443}/agent}
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_SCAN_ID:-agent-scan-1}.token
      NETWATCH_AGENT_CREDENTIAL_FILE: /var/lib/netwatch/agent.credential
    volumes:
      - ./secrets/bootstrap:/etc/netwatch/bootstrap:ro
      - agent-scan-state:/var/lib/netwatch

  netwatch-agent-ddos:
    profiles: ["legacy-agents"]
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-maintenance-worker:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_API_URL: ${NETWATCH_API_URL_PROD:-https://127.0.0.1:${NETWATCH_EDGE_HTTPS_PORT:-443}/agent}
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_DDOS_ID:-agent-ddos-1}.token
      NETWATCH_AGENT_CREDENTIAL_FILE: /var/lib/netwatch/agent.credential
    volumes:
      - ./secrets/bootstrap:/etc/netwatch/bootstrap:ro
      - agent-ddos-state:/var/lib/netwatch

  netwatch-agent-vuln:
    profiles: ["legacy-agents"]
    depends_on:
      netwatch-backend:
        condition: service_healthy
      netwatch-maintenance-worker:
        condition: service_healthy
    environment:
      NETWATCH_FORCE_ENROLL_ON_START: "true"
      NETWATCH_API_URL: ${NETWATCH_API_URL_PROD:-https://127.0.0.1:${NETWATCH_EDGE_HTTPS_PORT:-443}/agent}
      NETWATCH_AGENT_BOOTSTRAP_TOKEN: ""
      NETWATCH_AGENT_BOOTSTRAP_TOKEN_FILE: /etc/netwatch/bootstrap/${AGENT_VULN_ID:-agent-vuln-1}.token
      NETWATCH_AGENT_CREDENTIAL_FILE: /var/lib/netwatch/agent.credential
    volumes:
      - ./secrets/bootstrap:/etc/netwatch/bootstrap:ro
      - agent-vuln-state:/var/lib/netwatch
      - /:/host:ro

volumes:
  caddy-data:
  caddy-config:
